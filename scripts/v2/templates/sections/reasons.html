{# 근거 섹션 — "왜 오를까/내릴까" 근거 리스트 #}
<div class="open-section">
  <div class="open-section__title reason-section-title">{{ reason_title }}</div>
  <div class="reason-block">
    <ul>
      {% for reason in reasons %}
      <li>{{ reason | safe }}</li>
      {% endfor %}
    </ul>
  </div>
  {% if counter_signal %}
  <div class="counter-signal">
    <span class="counter-signal__tag">⚠️ 단, 이건 주의해요</span>
    <p class="counter-signal__text">{{ counter_signal | safe }}</p>
  </div>
  {% endif %}
</div>
