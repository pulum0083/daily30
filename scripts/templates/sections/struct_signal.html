{# 구조 신호 — 나스닥 체크 한 줄. 숫자는 build_struct_signal이 스냅샷에서 만든다.
   같은 블록을 두 곳에 찍고 CSS로 하나만 보인다(ssig_place: main=PC 본문 끝, aside=모바일 시장 지표 위). #}
<section class="ssig ssig--{{ ssig_place }}">
  <div class="ssig-h"><span class="ssig-t">🧱 구조 신호</span></div>
  {% set n = struct_sig %}
  <a class="ssig-r" href="/stocks/nasdaq-check/">
    <div class="ssig-l">
      <span class="ssig-k">나스닥 체크</span>
      <div class="ssig-m"><b>{{ '%+.1f'|format(n.gap) }}%</b><span class="ssig-pill {{ n.level }}">{{ n.badge }}</span></div>
      <em>60개월선 대비 {{ n.month_label }} 월봉 고점<span class="ssig-go">상세 그래프 ›</span></em>
    </div>
    <div class="ssig-g">
      <div class="ssig-track">
        <i class="z1" style="left:{{ n.x_caution }}%;width:{{ n.w_caution }}%"></i><i class="z2" style="left:{{ n.x_warn }}%;right:0"></i>
        <i class="f {{ n.level }}" style="width:{{ n.x_gap }}%"></i><i class="dot {{ n.level }}" style="left:{{ n.x_gap }}%"></i>
      </div>
      <div class="ssig-ticks"><span style="left:0">0</span><span class="c" style="left:{{ n.x_caution }}%">{{ n.caution }} 주의</span><span class="w">{{ n.warn }} 경고</span></div>
    </div>
  </a>
</section>
