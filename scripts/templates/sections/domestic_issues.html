{# 국내 이슈 다이제스트 — RSS 실수집 + 발행일 검증분만. 리스트 비면 전체 생략(운영 규칙 0). #}
{% if domestic_issues %}
<div class="open-section">
  <div class="open-section__title">
    <span>🇰🇷 국내 이슈</span>
    <span class="dom-window">{{ domestic_window_label }}</span>
  </div>
  <div class="dom-list">
    {% for it in domestic_issues %}
    <a class="dom-card" href="{{ it.url }}" target="_blank" rel="noopener noreferrer">
      <div class="dom-card__head">
        <span class="dom-src">{{ it.source }}</span>
        <span class="dom-time">{{ it.time_label }}</span>
      </div>
      <div class="dom-title">{{ it.title }}</div>
      <div class="dom-summary">{{ it.summary }}</div>
    </a>
    {% endfor %}
  </div>
</div>
{% endif %}
