{# 반도체 섹터 브리핑 — 코스피 아침 브리핑 하단 추가 섹션 #}
<div class="semicon-brief">
  <div class="semicon-brief__header">
    <span class="semicon-brief__icon">💾</span>
    <span class="semicon-brief__title">반도체 섹터 브리핑</span>
    <span class="semicon-brief__date">{{ date_str }}</span>
  </div>
  <div class="semicon-brief__signal">{{ semicon_signal }}</div>
  <div class="semicon-brief__divider"></div>
  <div class="semicon-brief__body">
    {% for para in semicon_paragraphs %}
    <p>{{ para | safe }}</p>
    {% endfor %}
  </div>
</div>
