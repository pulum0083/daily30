{# 간밤 미국 시장 이슈 — 코스피 아침 브리핑 전용 (us_issues, 뉴스 요약 기반) #}
{% if us_issues %}
<div class="open-section">
  <div class="open-section__title us-linked-title">
    <span class="us-badge"><span class="us-badge__flag" aria-hidden="true">🇺🇸</span>US</span> 간밤 미국 시장 이슈
  </div>
  <div class="issue-list">
    {% for it in us_issues %}
    <div class="issue-card">
      <div class="issue-card__title">{{ it.title }}</div>
      {% if it.body %}<div class="issue-card__body">{{ it.body | safe }}</div>{% endif %}
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
