{# 예측 강등 스트립 — '당일 방향 예측'을 참고 지표로 격하. 오늘의 관점 승격에 따른 재배치. 코스피 전용. #}
<div class="open-section">
  <div class="predc">
    <div class="predc__lbl">
      당일 방향 예측 <span class="ref">참고 지표</span>
      <button class="info-icon-btn" data-modal-open="pred-modal">?</button>
      <span class="section-time">{{ generated_time }} KST 생성</span>
    </div>
    <div class="predc__main">
      <span class="pchip {{ dir_cls }}">{{ dir_arrow }} {{ direction }}</span>
      <span class="predc__pct {{ dir_cls }} num">{{ readout_pct }}<span class="predc__pct-u">%</span></span>
      <span class="predc__conf num">신뢰도 {{ confidence }}%</span>
    </div>
    <div class="predc__note">모델의 방향 확률일 뿐이에요. 매매 판단은 위 '오늘의 관점'과 아래 분석을 함께 보세요.</div>
  </div>
</div>
