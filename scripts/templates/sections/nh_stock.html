{# 프리장 52주 신고가 종목 섹션 (미국) #}
<div class="open-section">
  <div class="open-section__title">🏆 프리장 신고가 종목</div>
  <div style="font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.7">오늘 프리장에서 52주 신고가 또는 역대 최고가를 기록한 종목이에요.</div>
  <div class="premarket-highs">
    {% for s in nh_stocks %}
    <div class="pmh-c-row">
      <div class="pmh-c-row__main">
        <div class="pmh-c-row__line1"><span class="pmh-c-row__ticker">{{ s.ticker }}</span><span class="pmh-c-row__name">{{ s.name }}</span><span class="hi-pill-sm{% if s.alltime %} alltime{% endif %}">{{ s.tag }}</span></div>
        <div class="pmh-c-row__break"><span class="arrow">▲</span>{{ s.break_note | safe }}{% if s.reason %}<span class="dot">·</span><span>{{ s.reason }}</span>{% endif %}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
