# main 브랜치 코드 변경 시 web/ 를 gh-pages에 배포
# web/data/ 변경(뉴스·브리핑 JSON)은 제외 — kospi-news-live.yml이 직접 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/assets/**'
      - 'web/*.html'
      - 'web/briefings/**'
      - 'web/stocks/**'
      - 'api/**'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true
          user_name: "DailyB Bot"
          user_email: "dailyb-bot@users.noreply.github.com"
