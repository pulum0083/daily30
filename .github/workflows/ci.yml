# 발행 게이트 + 회귀 테스트 — 메타 누락·테스트 실패 시 빌드를 실패시킨다
#
# 2026-07-21 신설. 저장소에 테스트가 22개 있는데 어느 워크플로우에서도 실행되지 않았고,
# STOCKS_SERVICE_RULES §9 발행 전 검증 기준도 문서상 체크리스트로만 존재했다.
# 그래서 종목 상세 46개가 SEO 메타 없이 발행되는 동안 아무도 못 잡았다.
#
# 여기가 "빌드 실패" 담당이다. 생성 시점 차단(파일을 안 씀)은 generate_html.py가 맡는다.
name: CI

on:
  push:
    branches: [main]
    # 데이터 갱신 커밋(web/data/**)만으로는 돌지 않는다 — 평일 30분마다 푸시되므로 노이즈가 된다.
    paths:
      - "scripts/**"
      - "web/stocks/**"
      - "web/sitemap.xml"
      - ".github/workflows/ci.yml"
      - "requirements.txt"
      # 2026-07-25 추가 — main.js·stocks-home.js를 고쳐도 CI가 돌지 않고 있었다.
      # web/assets/**는 데이터 갱신 경로(web/data/**)와 달리 사람이 고치는 코드다.
      - "web/assets/**"
      - "api/**"
      - "eslint.config.mjs"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Python 패키지 설치
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Python 회귀 테스트
        # 2026-07-21에 걸어둔 --deselect(test_block_close_scalar_prose)는 2026-07-25에
        # 제거했다. "별도 판단"을 미뤄둔 stale 테스트였고, 판단 결과 구현이 맞고 테스트가
        # 낡은 것이었다 — 의도된 동작(금지 문장 제거 후 발행)을 검증하도록 재작성했으므로
        # 이제 전부 돌린다. 파헤치는 과정에서 close_reason.html의 빈 <p> 렌더 결함도 나왔다.
        run: python3 -m pytest scripts/ -q

      - name: 🧪 JS 회귀 테스트
        # 2026-07-25 신설. api/*.test.mjs 4개와 web/assets/main.test.mjs가 저장소에
        # 있는데도 어느 워크플로우에서도 실행되지 않았다.
        run: |
          node --test api/*.test.mjs
          node --test web/assets/*.test.mjs

      - name: 🔍 JS 정적 검사 (no-undef 등 런타임 에러 클래스)
        # 2026-07-25 신설. main.js 리팩토링 중 삭제한 변수를 계속 참조하는 고아 참조를
        # 두 번 만들었고(k0·todayKst), node --check·브라우저 콘솔·단위 테스트가 모두
        # 통과했다 — 해당 코드 경로가 DOM 없는 환경에서 조기 return되기 때문이다.
        # no-undef가 둘 다 즉시 잡았다. warning은 실패시키지 않는다(인라인 onclick
        # 전역 함수를 ESLint가 미사용으로 오탐하므로).
        run: npx --yes eslint@9 web/assets/ api/

      - name: 🚦 발행 게이트 — 발행본 전수 감사 (메타 5종·JSON-LD·canonical·sitemap)
        run: python3 scripts/verify_publish_gate.py
