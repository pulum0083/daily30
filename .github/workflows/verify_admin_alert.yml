# 관리자 알림 도착 확인용 일회용 워크플로 — 확인 후 삭제
name: "🔔 관리자 알림 테스트 (일회용)"

on:
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

jobs:
  test-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 관리자 알림 1회 발송
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from validate_analysis import send_admin_alert
          send_admin_alert(
              "🔔 <b>검증 게이트 관리자 알림 테스트</b>\n"
              "이 메시지가 보이면 차단 알림 연결이 정상입니다."
          )
          PY
