# 코스피 장중 뉴스를 30분마다 수집해 kospi-news-live.json을 갱신하는 워크플로우
name: 코스피 장중 뉴스 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * 1-5'  # 09:10 KST
    - cron: '30 0 * * 1-5'  # 09:30 KST
    - cron: '0 1 * * 1-5'   # 10:00 KST
    - cron: '30 1 * * 1-5'  # 10:30 KST
    - cron: '0 2 * * 1-5'   # 11:00 KST
    - cron: '30 2 * * 1-5'  # 11:30 KST
    - cron: '0 3 * * 1-5'   # 12:00 KST
    - cron: '30 3 * * 1-5'  # 12:30 KST
    - cron: '0 4 * * 1-5'   # 13:00 KST
    - cron: '30 4 * * 1-5'  # 13:30 KST
    - cron: '0 5 * * 1-5'   # 14:00 KST
    - cron: '30 5 * * 1-5'  # 14:30 KST
    - cron: '0 6 * * 1-5'   # 15:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

concurrency:
  group: kospi-news-live
  cancel-in-progress: false

jobs:
  run:
    name: "📰 코스피 장중 뉴스 갱신"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 의존성 설치
        run: pip install google-genai

      - name: 📰 뉴스 이슈 수집
        run: python3 scripts/fetch_news_live.py

      - name: 💾 JSON 커밋 & 푸시
        run: |
          git config user.name  "DailyB Bot"
          git config user.email "dailyb-bot@users.noreply.github.com"
          git add web/data/kospi-news-live.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
          else
            git commit -m "data: 코스피 장중 뉴스 갱신 $(TZ=Asia/Seoul date +'%H:%M') KST"
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                git push && break
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push attempt $i failed, retrying in 15s..."
              sleep 15
            done
          fi

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true
          user_name: "DailyB Bot"
          user_email: "dailyb-bot@users.noreply.github.com"
