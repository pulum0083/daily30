# 이슈 브리핑 수집 워크플로우
# 트리거: cron-job.org → GitHub API dispatch (workflow_dispatch)
# GHA native schedule 제거 — 주말 비활성화 문제로 cron-job.org로 전환
#
# cron-job.org Job 3개 (Asia/Seoul 기준):
#   장중:      */30 9-15 * * 1-5   (09:00~15:30, 30분 간격)
#   장 후:     35 16-20 * * 1-5    (16:35~20:35, 1시간 간격)
#   미국장:    30 21-23 * * 1-5    (21:30~23:30, 1시간 간격)

name: 이슈 브리핑 수집

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # vercel-deploy.yml 명시적 dispatch (GITHUB_TOKEN 커밋은 push 트리거를 발동 안 시켜 명시적 dispatch 필요)

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

concurrency:
  group: kospi-news-live
  cancel-in-progress: false

jobs:
  run:
    name: "📰 이슈 브리핑 수집"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 세팅
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 의존성 설치
        run: pip install google-genai

      - name: 📰 이슈 수집
        run: python3 scripts/fetch_news_live.py

      - name: 📈 왜 움직였나 수집
        continue-on-error: true
        run: python3 scripts/fetch_movers_why.py

      - name: 💾 JSON 커밋 & 푸시
        id: commit
        run: |
          git config user.name  "DailyB Bot"
          git config user.email "dailyb-bot@users.noreply.github.com"
          git add web/data/kospi-news-live.json "web/data/kospi-news-$(TZ=Asia/Seoul date +'%Y-%m-%d').json" web/data/movers-why-live.json "web/data/movers-why-$(TZ=Asia/Seoul date +'%Y-%m-%d').json" 2>/dev/null || true
          git add web/data/kospi-news-live.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 이슈 브리핑 갱신 $(TZ=Asia/Seoul date +'%H:%M') KST"
            pushed=false
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if git push; then pushed=true; break; fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push attempt $i failed, retrying in 15s..."
              sleep 15
            done
            echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Vercel 배포 트리거 (GITHUB_TOKEN 커밋은 push 트리거를 발동 안 시켜 명시적 dispatch 필요)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run vercel-deploy.yml --ref main -f sha=$(git rev-parse HEAD)

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true
          user_name: "DailyB Bot"
          user_email: "dailyb-bot@users.noreply.github.com"

      # Vercel 프로덕션 배포는 위 "🚀 Vercel 배포 트리거" 스텝의 명시적 dispatch로 이뤄진다.
      # 근본 원인 1(2026-07-07 확정): 커밋 작성자(dailyb-bot@...)가 Vercel 계정과 연결돼 있지 않아
      # git-트리거 자동배포가 "가끔"이 아니라 매번 예외 없이 BLOCKED 상태로 멈춘다. 토큰 기반
      # `vercel deploy`는 커밋 작성자 검증을 받지 않으므로 이 경로로만 배포해야 한다.
      # 근본 원인 2(2026-07-13 확정): vercel-deploy.yml의 on:push는 이 워크플로우가 기본
      # GITHUB_TOKEN으로 만든 push에는 애초에 발동하지 않는다(GitHub의 재귀 방지 제약) — "push 이벤트를
      # 공용으로 받아 처리한다"는 이전 가정이 틀렸다. 매 실행마다 vercel-deploy.yml을 조용히 건너뛰어
      # 이슈 브리핑 데이터가 갱신돼도 doubleshot.space에는 몇 시간씩 반영되지 않는 사고로 이어졌다.
      # daily_report.yml과 동일하게 gh workflow run으로 명시적 dispatch해야 실제로 배포된다.
