# 이슈 브리핑 수집 워크플로우
# 트리거: cron-job.org → GitHub API dispatch (workflow_dispatch)
# GHA native schedule 제거 — 주말 비활성화 문제로 cron-job.org로 전환
#
# cron-job.org Job 3개 (Asia/Seoul 기준):
#   장중:      */30 9-15 * * 1-5   (09:00~15:30, 30분 간격)
#   장 후:     35 16-20 * * 1-5    (16:35~20:35, 1시간 간격)
#   미국장:    30 21-23 * * 1-5    (21:30~23:30, 1시간 간격)

name: 이슈 브리핑 수집

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

concurrency:
  group: kospi-news-live
  cancel-in-progress: false

jobs:
  run:
    name: "📰 이슈 브리핑 수집"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 세팅
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 의존성 설치
        run: pip install google-genai

      - name: 📰 이슈 수집
        run: python3 scripts/fetch_news_live.py

      - name: 📈 왜 움직였나 수집
        continue-on-error: true
        run: python3 scripts/fetch_movers_why.py

      - name: 💾 JSON 커밋 & 푸시
        id: commit
        run: |
          git config user.name  "DailyB Bot"
          git config user.email "dailyb-bot@users.noreply.github.com"
          git add web/data/kospi-news-live.json "web/data/kospi-news-$(TZ=Asia/Seoul date +'%Y-%m-%d').json" web/data/movers-why-live.json "web/data/movers-why-$(TZ=Asia/Seoul date +'%Y-%m-%d').json" 2>/dev/null || true
          git add web/data/kospi-news-live.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 이슈 브리핑 갱신 $(TZ=Asia/Seoul date +'%H:%M') KST"
            pushed=false
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if git push; then pushed=true; break; fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push attempt $i failed, retrying in 15s..."
              sleep 15
            done
            echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true
          user_name: "DailyB Bot"
          user_email: "dailyb-bot@users.noreply.github.com"

      # Vercel 프로덕션(doubleshot.space)이 이 push로 실제 배포됐는지 검증.
      # git-트리거 자동배포가 조용히 Canceled 되는 사고가 있었음(2026-07-03) — 방치하면
      # 데이터는 계속 정확한데 사이트만 몇 시간째 멈춰 있는 상태를 아무도 모르고 지나침.
      - name: 🔍 프로덕션 배포 반영 확인
        if: steps.commit.outputs.pushed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # doubleshot.space는 "double-shot" 프로젝트 소속. 이 저장소의 실제 GitHub repo명이
          # "daily30"이라 프로젝트 링크 없이 `vercel deploy`를 돌리면 CLI가 이름만 보고
          # 엉뚱한 "daily30" 프로젝트로 자동 연결해버린다(2026-07-06 발견). 그러면 복구 배포가
          # daily30-seven.vercel.app에만 나가고 doubleshot.space는 영영 갱신되지 않아
          # 알림이 매번 반복 발송된다 — 반드시 double-shot 프로젝트로 명시 고정한다.
          VERCEL_ORG_ID: team_iPwo9taZIskxdoXOJu9assy2
          VERCEL_PROJECT_ID: prj_XRVsCkXlroRpbd9WVPgtH3OiE6Fo
        run: |
          sleep 30
          expected=$(python3 -c "import json; print(json.load(open('web/data/kospi-news-live.json')).get('updated_at',''))")
          live=$(curl -s --max-time 10 "https://doubleshot.space/data/kospi-news-live.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('updated_at',''))" 2>/dev/null || echo "")
          echo "expected=$expected live=$live"
          if [ "$live" = "$expected" ]; then
            echo "✓ 프로덕션 반영 확인됨"
            exit 0
          fi
          echo "⚠️ 프로덕션 미반영 감지 (expected=$expected, live=$live)"
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "→ vercel --prod 로 자동 복구 시도"
            npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN" || echo "자동 복구 실패"
            sleep 15
            live=$(curl -s --max-time 10 "https://doubleshot.space/data/kospi-news-live.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('updated_at',''))" 2>/dev/null || echo "")
            echo "재확인: live=$live"
            if [ "$live" = "$expected" ]; then
              echo "✓ 자동 복구로 반영 확인됨 — 알림 생략"
              exit 0
            fi
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
              -d "text=⚠️ 이슈 브리핑 프로덕션 미반영 — expected=${expected} live=${live}. doubleshot.space가 최신 커밋을 안 물고 있음. Vercel 배포 상태 확인 필요." \
              >/dev/null || true
          fi
