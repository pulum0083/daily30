# 이슈 브리핑 수집 워크플로우
# 트리거: cron-job.org → GitHub API dispatch (workflow_dispatch)
# GHA native schedule 제거 — 주말 비활성화 문제로 cron-job.org로 전환
#
# cron-job.org Job 3개 (Asia/Seoul 기준):
#   장중:      */30 9-15 * * 1-5   (09:00~15:30, 30분 간격)
#   장 후:     35 16-20 * * 1-5    (16:35~20:35, 1시간 간격)
#   미국장:    30 21-23 * * 1-5    (21:30~23:30, 1시간 간격)

name: 이슈 브리핑 수집

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

concurrency:
  group: kospi-news-live
  cancel-in-progress: false

jobs:
  run:
    name: "📰 이슈 브리핑 수집"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 세팅
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 의존성 설치
        run: pip install google-genai

      - name: 📰 이슈 수집
        run: python3 scripts/fetch_news_live.py

      - name: 💾 JSON 커밋 & 푸시
        run: |
          git config user.name  "DailyB Bot"
          git config user.email "dailyb-bot@users.noreply.github.com"
          git add web/data/kospi-news-live.json "web/data/kospi-news-$(TZ=Asia/Seoul date +'%Y-%m-%d').json" 2>/dev/null || true
          git add web/data/kospi-news-live.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
          else
            git commit -m "data: 이슈 브리핑 갱신 $(TZ=Asia/Seoul date +'%H:%M') KST"
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                git push && break
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push attempt $i failed, retrying in 15s..."
              sleep 15
            done
          fi

      - name: 🚀 GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true
          user_name: "DailyB Bot"
          user_email: "dailyb-bot@users.noreply.github.com"
