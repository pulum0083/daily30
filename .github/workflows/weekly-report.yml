# 주간 장기 리포트 — 토요일 아침(미국 금요일 장 마감 뒤) web/weekly/{금요일}/을 한 번 만들고, 토요일 09:00에 텔레그램으로 보낸다
# (2026-11-09, SERVICE_RULES §82). 이번 주를 만들 때는 금요일 종가로 나스닥 체크·S&P 500 200일선 상세 페이지와 홈 줄도 다시 쓴다.
#
# 언제 도나:
#   · Cloudflare 워커(workers/cron) — 토 07:25 KST(만들기)·토 09:00 KST(보내기)에 telegram=on으로 dispatch한다. 시각이 정확하다.
#   · GHA native cron 08·11·14시 KST — 워커가 빠졌을 때의 대비. 이 저장소에서 GHA cron은 몇 시간씩 늦게 뜰 수 있다(§10).
#   만드는 부분은 그 주 리포트가 이미 있으면 바로 끝난다. 보내는 부분은 토요일 09:00 이후에만, 하루 한 번만
#   (send_telegram의 발송 기록) 돈다 — 07:25 실행은 만들기만 하고, 09:00 실행이 보낸다. 08:00 실행이 늦게 떠 09:00을 넘기면 그 실행이 보낸다.
#   수동 실행(workflow_dispatch)은 telegram 기본값 off — 지난 주를 채우거나 시험할 때 구독자에게 나가지 않는다.
# 이 워크플로우가 커밋하는 건 web/weekly/·web/sitemap.xml·web/stocks/index.html(최근 브리핑 목록)·상세 페이지 2개와 홈 줄 파일·
# data/sp500_breadth_history.json·data/telegram_sent_log.json뿐이다(§18).
name: 📅 주간 장기 리포트

on:
  schedule:
    - cron: "0 23 * * 5"   # 토 08:00 KST
    - cron: "0 2 * * 6"    # 토 11:00 KST (앞 실행이 빠졌을 때)
    - cron: "0 5 * * 6"    # 토 14:00 KST
  workflow_dispatch:
    inputs:
      week_end:
        description: "그 주 금요일(YYYY-MM-DD). 비우면 오늘 이전 가장 최근 금요일"
        required: false
        default: ""
      telegram:
        description: "텔레그램 발송(on이면 토요일 09:00 이후·이번 주·오늘 처음일 때만 보낸다). 수동 시험은 off"
        required: false
        default: "off"
        type: choice
        options: ["off", "on"]

permissions:
  contents: write
  actions: write   # vercel-deploy.yml 명시적 dispatch (GITHUB_TOKEN 커밋은 push 트리거를 발동 안 시킴)

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  run:
    name: "📅 주간 장기 리포트"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      WEB_BASE_URL: "https://doubleshot.space"
    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 세팅
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 의존성 설치
        run: pip install -r requirements.txt

      - name: 📅 주간 리포트 생성
        timeout-minutes: 10
        run: |
          if [ -n "${{ github.event.inputs.week_end }}" ]; then
            python3 scripts/weekly_report.py --week-end "${{ github.event.inputs.week_end }}"
          else
            python3 scripts/weekly_report.py
          fi

      - name: 💾 커밋 & 푸시
        id: commit
        run: |
          git config user.name  "DailyB Bot"
          git config user.email "dailyb-bot@users.noreply.github.com"
          git add web/weekly web/sitemap.xml web/stocks/index.html data/sp500_breadth_history.json \
                  web/stocks/nasdaq-check web/stocks/sp500-200 web/data/nasdaq-home.json web/data/sp500-home.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "📅 주간 장기 리포트: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          pushed=false
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main; then
              if git push; then pushed=true; break; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          if [ "$pushed" != "true" ]; then
            echo "::error::push 5회 재시도 모두 실패 — 잡을 중단합니다."
            exit 1
          fi

      - name: 🚀 Vercel 배포 트리거
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            if gh workflow run vercel-deploy.yml --ref main -f sha="$sha"; then
              echo "✅ 배포 트리거 성공 (시도 $i/5)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Vercel 배포 트리거 실패 — 수동 조치: gh workflow run vercel-deploy.yml --ref main -f sha=$sha"
          exit 1

      # 토요일 09:00 텔레그램 — 이번 주·토요일 09:00 이후·발송 허용(cron 또는 telegram=on)일 때만. 하루 한 번은 send_telegram이 지킨다.
      - name: 🕘 텔레그램 보낼지 판단
        id: tg
        env:
          EVENT: ${{ github.event_name }}
          TG_INPUT: ${{ github.event.inputs.telegram }}
          WEEK_END: ${{ github.event.inputs.week_end }}
        run: |
          dow=$(TZ=Asia/Seoul date +%u); hm=$(TZ=Asia/Seoul date +%H%M)
          if { [ "$EVENT" = "schedule" ] || [ "$TG_INPUT" = "on" ]; } && [ -z "$WEEK_END" ] && [ "$dow" = "6" ] && [ "$hm" -ge 900 ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "텔레그램 보내지 않음 (event=$EVENT telegram=$TG_INPUT week_end=$WEEK_END 요일=$dow 시각=$hm)"
          fi

      - name: 📝 텔레그램 메시지 만들기
        id: msg
        if: steps.tg.outputs.send == 'true'
        run: |
          python3 scripts/weekly_report.py --telegram-message
          end=$(python3 -c "import sys; sys.path.insert(0,'scripts'); import weekly_report as w; from datetime import datetime; print(w.week_of(datetime.now(w.KST).date()))")
          echo "end=$end" >> "$GITHUB_OUTPUT"
          cat data/telegram_message_weekly.txt

      # 페이지가 실제로 열리는지 본 뒤 보낸다(§17) — 배포는 보통 1~2분.
      - name: 🔎 리포트 페이지 라이브 확인
        if: steps.tg.outputs.send == 'true'
        timeout-minutes: 11
        run: |
          url="https://doubleshot.space/weekly/${{ steps.msg.outputs.end }}/"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then echo "✅ $url"; exit 0; fi
            echo "아직 $code ($i/60) — 10초 뒤 다시"; sleep 10
          done
          echo "::error::$url 이 10분 동안 열리지 않음 — 텔레그램을 보내지 않는다"; exit 1

      - name: 📤 텔레그램 발송
        if: steps.tg.outputs.send == 'true'
        run: python3 scripts/send_telegram.py --type weekly

      - name: 🧾 발송 기록 커밋
        if: steps.tg.outputs.send == 'true'
        continue-on-error: true
        run: bash .github/scripts/commit_sent_log.sh weekly

      - name: 🔔 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          python3 -c "import sys; sys.path.insert(0,'scripts'); from send_telegram import send_admin_alert; send_admin_alert('📅 주간 장기 리포트 생성 실패 — gh workflow run weekly-report.yml 로 다시 돌려 주세요.')" || true
