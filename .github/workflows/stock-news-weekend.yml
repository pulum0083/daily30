# 주말 종목 뉴스 수집 워크플로우
#
# 평일 수집은 kospi-news-live.yml(workers/cron 트리거)이 담당하고, 이 워크플로우는
# 주말(토·일)만 맡는다. 평일엔 절대 돌지 않는다 — 같은 파일을 두 워크플로우가
# 동시에 커밋해 rebase 충돌을 일으키는 사고(SERVICE_RULES §18)를 구조적으로 차단한다.
#
# ⚠️ 이 워크플로우는 fetch_stock_news.py만 실행한다. kospi-news-live.yml이 함께 돌리는
#    나머지 두 스크립트를 주말에 돌리면 안 되기 때문이다:
#      - fetch_news_live.py  : get_slot()이 시각만 보므로 토 12시에 "MARKET"을 반환해
#                              휴장일인데 "장중 이슈"를 발행한다.
#      - fetch_movers_why.py : 요일 게이팅이 없어 주말에 movers 데이터를 덮어쓴다.
#                              이 파일들의 소유자는 kospi-news-live.yml이다(§18).
#
# 트리거: workers/cron (Cloudflare Workers 스케줄러) → GitHub API dispatch
# GHA native schedule 제거(2026-07-25) — 신설 첫 주말(7/19·7/25) 모두 09:00 슬롯이
# 자동 발화하지 않고 다른 슬롯도 최대 1h45 지연되는 것을 실측 확인. cron-job.org는
# 2026-06-11에 이미 Cloudflare Workers로 전면 이전됐으므로(workers/cron/src/worker.js
# 주석 "cron-job.org 전체 이전") 같은 방식으로 맞춘다. cron-job.org는 신규 등록 대상이 아니다.
#
# 실제 스케줄은 workers/cron/wrangler.toml의 cron 트리거 + worker.js의 KST 09/12/15/18/21시·
# 토·일 판정 로직이 정의한다(3시간 간격, 하루 5회). 이 워크플로우 파일엔 스케줄을 두지 않는다 —
# 시각을 바꿀 땐 이 헤더가 아니라 workers/cron 쪽을 고치고 `wrangler deploy`로 재배포할 것.

name: 주말 종목 뉴스 수집

on:
  workflow_dispatch:   # workers/cron(Cloudflare Workers)이 호출. 수동 실행·테스트도 겸함

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # vercel-deploy.yml 명시적 dispatch (GITHUB_TOKEN 커밋은 push 트리거를 발동 안 시킴)

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

# kospi-news-live.yml과 다른 그룹 — 평일/주말로 실행 시점이 갈려 서로 겹치지 않는다.
concurrency:
  group: stock-news-weekend
  cancel-in-progress: false

jobs:
  run:
    name: "📰 주말 종목 뉴스 수집"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 세팅
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 의존성 설치
        run: pip install google-genai

      # 이미 요약한 기사는 재요약하지 않으므로 신규 기사가 없는 실행은 Gemini 호출 0회로 끝난다.
      - name: 📰 종목별 관련 뉴스 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_stock_news.py

      - name: 💾 JSON 커밋 & 푸시
        id: commit
        run: |
          git config user.name  "DailyB Bot"
          git config user.email "dailyb-bot@users.noreply.github.com"
          # 이 워크플로우가 소유한 파일만 커밋한다(§18 — 넓은 경로를 통째로 add 하지 않는다).
          git add web/data/stock-news.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 주말 종목 뉴스 갱신 $(TZ=Asia/Seoul date +'%H:%M') KST"
            pushed=false
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if git push; then pushed=true; break; fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "Push attempt $i failed, retrying in 15s..."
              sleep 15
            done
            echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
            # 5회 모두 실패하면 명시적으로 중단한다 — 무음 실패로 다음 스텝이 존재하지 않는
            # SHA로 배포를 트리거하던 사고(SERVICE_RULES §17) 방지.
            if [ "$pushed" != "true" ]; then
              echo "::error::push 5회 재시도 모두 실패 — 잡을 중단합니다."
              exit 1
            fi
          fi

      - name: 🚀 Vercel 배포 트리거 (GITHUB_TOKEN 커밋은 push 트리거를 발동 안 시켜 명시적 dispatch 필요)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            if gh workflow run vercel-deploy.yml --ref main -f sha="$sha"; then
              echo "✅ 배포 트리거 성공 (시도 $i/5)"
              exit 0
            fi
            echo "⚠️ 배포 트리거 실패 (시도 $i/5) — GitHub API 일시 오류로 추정, 10초 후 재시도"
            sleep 10
          done
          echo "::error::5회 시도 후에도 Vercel 배포 트리거 실패 — 데이터는 커밋됐지만 프로덕션에 반영 안 됨. 수동 조치: gh workflow run vercel-deploy.yml --ref main -f sha=$sha"
          exit 1
