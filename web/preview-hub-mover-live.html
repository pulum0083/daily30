<!-- [프리뷰] 홈 코스피 주도주 — 탭하면 인라인 라이브 곡선+뉴스 핀 (실시간 누적 시뮬레이션) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[프리뷰] 주도주 라이브 곡선</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/stocks.css">
<style>
  .demo-wrap{max-width:680px;margin:24px auto;padding:0 16px;}
  .lead{font-size:12px;color:var(--gold);background:var(--gold-bg);padding:3px 9px;border-radius:6px;display:inline-block;margin-bottom:12px;}
  .ldr{background:var(--canvas);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--s1);overflow:hidden;}
  .ldr__h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--hair);}
  .ldr__h .t{font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:7px;}
  .ldr__h .t::before{content:'';width:3px;height:14px;background:var(--up);border-radius:2px;}
  .live-dot{font-size:10px;font-weight:800;color:#E03131;display:inline-flex;align-items:center;gap:4px;}
  .live-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:#E03131;animation:blink 1.1s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .mv{padding:13px 16px;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .12s;}
  .mv:hover{background:#FAFBFC;}
  .mv__row{display:flex;align-items:center;justify-content:space-between;}
  .mv__l{display:flex;align-items:baseline;gap:8px;}
  .mv__nm{font-size:15px;font-weight:800;}
  .mv__sec{font-size:11px;color:var(--muted);}
  .mv__pct{font-size:15px;font-weight:800;}
  .mv__surge{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px;}
  .mv__hint{font-size:11.5px;color:var(--primary);margin-top:5px;display:flex;align-items:center;gap:4px;}
  .mv__hint .chev{transition:transform .2s;}
  .mv.open .mv__hint .chev{transform:rotate(90deg);}
  .panel-x{max-height:0;overflow:hidden;transition:max-height .35s ease;background:#FCFDFF;}
  .mv.open + .panel-x{max-height:520px;}
  .px-in{padding:6px 16px 14px;}
  .px-chart{position:relative;}
  .px-chart svg{width:100%;height:170px;display:block;overflow:visible;}
  .px-evts{margin-top:6px;}
  .px-evt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--hair);}
  .ie-num{width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .ie-num.why{background:var(--up);color:#fff;}
  .ie-num.rel{background:var(--soft);border:1px solid var(--hair);color:var(--muted);}
  .ie-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .ie-time{font-size:12px;color:var(--muted);}
  .ie-badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;}
  .ie-badge.why{background:#EAF7EC;color:#1B7A2E;}
  .ie-badge.rel{background:var(--inset);color:var(--muted);}
  .ie-h{font-size:13px;margin:5px 0 0;line-height:1.5;}
  .ie-src{font-size:12px;color:var(--primary);text-decoration:none;}
  .ie-fresh{font-size:11px;color:#1B7A2E;font-weight:700;margin-left:auto;}
</style>
</head>
<body>
<div class="demo-wrap">
  <span class="lead">프리뷰 · 실시간 누적 시뮬레이션 (목업 데이터)</span>

  <div class="ldr">
    <div class="ldr__h">
      <span class="t">코스피 주도주</span>
      <span class="live-dot">LIVE · 14:32:05</span>
    </div>

    <!-- 펼쳐진 주도주 -->
    <div class="mv open" id="mv-samsung" onclick="toggle(this)">
      <div class="mv__row">
        <div class="mv__l"><span class="mv__nm">삼성전자</span><span class="mv__sec">반도체</span></div>
        <div><span class="mv__pct up" id="px-pct">+5.9%</span><span class="mv__surge">×2.3</span></div>
      </div>
      <div class="mv__hint"><span class="chev">›</span> 오늘 곡선 + 뉴스 접기</div>
    </div>
    <div class="panel-x">
      <div class="px-in">
        <div class="px-chart">
          <svg id="chart" viewBox="0 0 640 180" role="img" aria-label="삼성전자 장중 실시간 누적 곡선과 뉴스 핀">
            <line x1="14" y1="150" x2="626" y2="150" stroke="#E5E7EB" stroke-width="1"/>
            <polyline id="line" fill="none" stroke="#E03131" stroke-width="2" stroke-linejoin="round" points=""/>
            <circle id="head" r="3.5" fill="#E03131" cx="14" cy="120"/>
            <g id="pins"></g>
            <text x="14" y="170" font-size="10" fill="#9CA3AF">09:00</text>
            <text x="595" y="170" font-size="10" fill="#9CA3AF">15:30</text>
          </svg>
        </div>
        <div class="px-evts" id="evts"></div>
      </div>
    </div>

    <!-- 닫힌 주도주 (탭하면 펼쳐짐 — 같은 동작) -->
    <div class="mv" onclick="toggle(this)">
      <div class="mv__row">
        <div class="mv__l"><span class="mv__nm">한화에어로스페이스</span><span class="mv__sec">방산</span></div>
        <div><span class="mv__pct up">+4.1%</span><span class="mv__surge">×3.0</span></div>
      </div>
      <div class="mv__hint"><span class="chev">›</span> 오늘 곡선 + 뉴스 펼치기</div>
    </div>
    <div class="panel-x"><div class="px-in" style="font-size:12px;color:var(--muted);padding:14px 16px;">폴란드 수출 계약 기대 · 09:48 한국경제 ↗ — (펼치면 곡선 로드)</div></div>

    <div class="mv" onclick="toggle(this)">
      <div class="mv__row">
        <div class="mv__l"><span class="mv__nm">SK하이닉스</span><span class="mv__sec">반도체</span></div>
        <div><span class="mv__pct dn">−3.1%</span><span class="mv__surge">×1.8</span></div>
      </div>
      <div class="mv__hint"><span class="chev">›</span> 오늘 곡선 + 뉴스 펼치기</div>
    </div>
    <div class="panel-x"><div class="px-in" style="font-size:12px;color:var(--muted);padding:14px 16px;">관련 뉴스 · 반도체 차익실현 (인과 단정 안 함)</div></div>
  </div>
</div>

<script>
function toggle(el){ el.classList.toggle('open'); }

// ── 실시간 누적 시뮬레이션 ──
const X0=14, X1=626, Y0=150, YT=20;
// 백필된 오전 곡선(09:00~14:00) + 라이브로 쌓이는 오후
const base = [120,118,82,84,80,78,74,76,70,72,73,68,64,66,60,62,58,55,52,50];
let pts = base.map((y,i)=>({ x: X0 + (X1-X0)*(i/49), y }));
const line = document.getElementById('line');
const head = document.getElementById('head');
const pinsG = document.getElementById('pins');
const evtsEl = document.getElementById('evts');

const NEWS = [
  { at: 2,  tier:'why', time:'09:32', badge:'▲ 왜 · 방향 일치', h:'HBM4 공급 확대 보도에 외국인 매수세 유입', src:'삼성전자, 엔비디아에 HBM4 공급 본격화 — 한국경제 ↗' },
  { at: 30, tier:'rel', time:'13:10', badge:'관련 뉴스', h:'시장 전반 외국인 순매수 전환 <span style="font-size:11px;color:#9CA3AF">(인과 단정 안 함)</span>', src:'코스피, 외국인 순매수에 2,800선 회복 — 연합뉴스 ↗' },
];
let shownNews = 0;

function draw(){
  line.setAttribute('points', pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '));
  const last = pts[pts.length-1];
  head.setAttribute('cx', last.x.toFixed(1)); head.setAttribute('cy', last.y.toFixed(1));
}
function renderPins(){
  pinsG.innerHTML=''; let html='';
  NEWS.slice(0,shownNews).forEach((n,i)=>{
    const p = pts[n.at]; if(!p) return;
    const col = n.tier==='why' ? '#E03131' : '#9CA3AF';
    const fill = n.tier==='why' ? '#E03131' : '#fff';
    const tcol = n.tier==='why' ? '#fff' : '#6B7280';
    pinsG.insertAdjacentHTML('beforeend',
      `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="22" stroke="${col}" stroke-width="1" stroke-dasharray="3 3"/>`+
      `<circle cx="${p.x.toFixed(1)}" cy="18" r="9" fill="${fill}" stroke="${col}" stroke-width="1"/>`+
      `<text x="${p.x.toFixed(1)}" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="${tcol}">${i+1}</text>`);
    html += `<div class="px-evt"><div class="ie-num ${n.tier}">${i+1}</div><div style="flex:1">`+
      `<div class="ie-top"><span class="ie-time">${n.time}</span><span class="ie-badge ${n.tier}">${n.badge}</span>`+
      (i===shownNews-1 && shownNews>0 ? `<span class="ie-fresh">방금 도착</span>`:``)+`</div>`+
      `<p class="ie-h"${n.tier==='rel'?' style="color:var(--muted)"':''}>${n.h}</p>`+
      `<a class="ie-src" href="#">${n.src}</a></div></div>`;
  });
  evtsEl.innerHTML = html;
}

// 초기: 백필 곡선 + 첫 뉴스
draw(); shownNews=1; renderPins();

// 라이브 누적: 1.1초마다 새 점 추가, 특정 지점에서 두 번째 뉴스 도착
let k = pts.length;
const tick = setInterval(()=>{
  if(k>=50){ clearInterval(tick); return; }
  const prev = pts[pts.length-1];
  const jitter = (Math.random()-0.45)*4;
  const drift = -0.9; // 완만한 상승
  const ny = Math.max(YT, Math.min(Y0, prev.y + drift + jitter));
  pts.push({ x: X0 + (X1-X0)*(k/49), y: ny });
  draw();
  if(k===31 && shownNews<2){ shownNews=2; renderPins(); }
  k++;
}, 1100);
</script>
</body>
</html>
