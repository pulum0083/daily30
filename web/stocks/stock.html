<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종목 분석 — 더블샷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
<style>
:root{--canvas:#FFF;--soft:#F9FAFB;--inset:#EEF1F5;--hair:#E5E7EB;--ink:#13151A;--muted:#6B7280;
  --primary:#006EFF;--primary-bg:#E8F4FF;--up:#E03131;--up-bg:#FFE8E8;--dn:#2775ED;--dn-bg:#DBE8FE;--gold:#B7791F;--gold-bg:#FEF3C7;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--gnb:#16181A;}
*{box-sizing:border-box;}html,body{margin:0;}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--soft);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;}
.num{font-variant-numeric:tabular-nums;}.up{color:var(--up);}.dn{color:var(--dn);}a{cursor:pointer;}

.gnb{position:sticky;top:0;z-index:10;background:var(--gnb);height:52px;display:flex;align-items:center;}
.gnb__in{max-width:1120px;margin:0 auto;width:100%;padding:0 28px;display:flex;align-items:center;gap:22px;}
.gnb__logo{font-size:15px;font-weight:800;color:#fff;cursor:pointer;}.gnb__logo b{color:#5AA2FF;}
.gnb a{color:#C9CCD1;font-size:13px;font-weight:600;text-decoration:none;}.gnb a.on{color:#fff;}
.gnb .right{margin-left:auto;}
.gnb .sbtn{display:flex;align-items:center;gap:6px;background:#26282B;border-radius:8px;padding:6px 11px;color:#9CA0A6;font-size:12px;cursor:pointer;}.gnb .sbtn svg{width:13px;height:13px;}

.wrap{max-width:1120px;margin:0 auto;padding:24px 28px 64px;}
.screen{display:none;}.screen.on{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.crumb{font-size:12px;color:var(--muted);margin:0 0 16px;}.crumb a{color:var(--muted);text-decoration:none;padding:0 2px;}.crumb a:hover{color:var(--primary);}
.back-btn{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:24px;height:24px;border-radius:7px;background:var(--canvas);border:1px solid var(--hair);color:var(--muted);font-size:14px;cursor:pointer;margin-right:10px;transition:background .12s,color .12s;padding:0;line-height:1;}
.back-btn:hover{background:var(--inset);color:var(--ink);}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:16px;flex-wrap:wrap;}
.hero h1{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0;}.hero h1 .a{color:var(--primary);}
.hero p{font-size:12px;color:var(--muted);margin:5px 0 0;}
.search{display:flex;align-items:center;gap:9px;background:var(--canvas);border:1.5px solid var(--hair);border-radius:10px;padding:9px 13px;box-shadow:var(--s1);min-width:320px;cursor:text;}
.search svg{width:15px;height:15px;color:var(--muted);}.search span{color:var(--muted);font-size:13px;}.search kbd{margin-left:auto;font-size:11px;color:var(--muted);background:var(--soft);border:1px solid var(--hair);border-radius:5px;padding:2px 7px;}

.strip{display:flex;align-items:center;background:var(--canvas);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--s1);padding:8px 14px;margin-bottom:10px;overflow-x:auto;}
.strip .m{display:inline-flex;align-items:baseline;gap:5px;padding-right:14px;margin-right:14px;border-right:1px solid var(--hair);flex-shrink:0;white-space:nowrap;}.strip .m:last-child{border-right:none;margin-right:0;padding-right:0;}
.strip .m .l{font-size:10.5px;font-weight:600;color:var(--muted);}.strip .m .v{font-size:13px;font-weight:800;}.strip .m .vc{font-size:11px;font-weight:700;}
/* ── AI 브리핑 스트립 ── */
.brief-strip{display:flex;align-items:center;gap:10px;background:var(--canvas);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--s1);padding:10px 14px;margin:10px 0;cursor:pointer;text-decoration:none;color:var(--ink);transition:border-color .14s,background .14s,padding .14s,border-color .14s;}
.brief-strip.is-hidden{padding:0;border-color:transparent;box-shadow:none;background:transparent;pointer-events:none;overflow:hidden;height:0;margin:0;}
.brief-strip:hover{border-color:var(--primary);background:#F8FAFF;}
.brief-strip.bs-kospi{background:var(--primary-bg);border-color:#BFDBFE;}.brief-strip.bs-kospi:hover{background:#DCEFFE;}
.brief-strip.bs-close{background:#F0FDF4;border-color:#BBF7D0;}.brief-strip.bs-close:hover{background:#DCFCE7;}
.brief-strip.bs-us{background:#FEFCE8;border-color:#FDE68A;}.brief-strip.bs-us:hover{background:#FEF9C3;}
.brief-strip.bs-live{background:#FEF2F2;border-color:#FECACA;}.brief-strip.bs-live:hover{background:#FEE2E2;}
.bs-icon{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.bs-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.bs-type{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px;}
.bs-kospi .bs-type{color:var(--primary);}.bs-close .bs-type{color:#16A34A;}.bs-us .bs-type{color:#CA8A04;}.bs-live .bs-type{color:#EF4444;}
.bs-text{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.4;word-break:keep-all;}
.bs-arr{font-size:16px;color:#C0C4CA;flex-shrink:0;transition:color .14s;}.brief-strip:hover .bs-arr{color:var(--primary);}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#EF4444;margin-right:3px;vertical-align:middle;animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
/* 갱신 배지 */
.upd-badge{display:inline-flex;align-items:center;gap:3px;background:var(--inset);color:var(--muted);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;vertical-align:middle;}
.upd-badge .dot{width:4px;height:4px;border-radius:50%;background:#EF4444;animation:blink 1.2s ease-in-out infinite;}
/* 실시간 포커스 카드 (칩보드 상단) */
.focus-card{background:var(--canvas);border:1.5px solid #FECACA;border-radius:14px;margin-bottom:14px;overflow:hidden;}
.focus-card__h{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#FEF2F2;border-bottom:1px solid #FECACA;font-size:12px;font-weight:700;color:#991B1B;}
.focus-stocks{display:grid;grid-template-columns:1fr 1fr;}
.focus-stock{padding:12px 14px;border-right:1px solid var(--hair);}
.focus-stock:last-child{border-right:none;}
.focus-stock .fn{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.focus-stock .fp{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.5px;}
.focus-stock .fc{font-size:13px;font-weight:700;margin-top:1px;}
.focus-stock .fs{font-size:10px;color:var(--muted);margin-top:5px;}
/* Hyperliquid 장후 카드 */
.hl-card{background:#F5F3FF;border:1.5px solid #DDD6FE;border-radius:14px;margin-bottom:14px;overflow:hidden;}
.hl-card__h{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#EDE9FE;border-bottom:1px solid #DDD6FE;font-size:12px;font-weight:700;color:#5B21B6;}
.hl-badge{background:#7C3AED;color:#fff;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:800;letter-spacing:.02em;}
.hl-note{font-size:10px;color:#7C3AED;font-weight:400;margin-left:auto;}
.hl-stocks{display:grid;grid-template-columns:1fr 1fr;}
.hl-stock{padding:12px 14px;border-right:1px solid #DDD6FE;}
.hl-stock:last-child{border-right:none;}
.hl-stock .hn{font-size:11px;color:#6D28D9;font-weight:600;margin-bottom:4px;}
.hl-stock .hp{font-size:20px;font-weight:800;color:#1E1B4B;line-height:1.1;letter-spacing:-.5px;}
.hl-stock .hc{font-size:13px;font-weight:700;}
.hl-stock .hf{font-size:10px;color:#7C3AED;margin-top:5px;}
/* 프로토타입 시간대 토글 */
.proto-toggle{display:flex;gap:4px;flex-shrink:0;align-items:center;}
.proto-toggle button{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--hair);background:var(--canvas);color:var(--muted);cursor:pointer;}
.proto-toggle button.on{background:var(--primary);border-color:var(--primary);color:#fff;}

.secwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.secwrap .t{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.etf-divider{border:none;border-top:2px dashed var(--hair);margin:18px 0 18px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips a{font-size:12px;font-weight:600;color:var(--ink);background:var(--canvas);border:1px solid var(--hair);border-radius:999px;padding:6px 13px;text-decoration:none;box-shadow:var(--s1);}
.chips a:hover{border-color:var(--primary);color:var(--primary);}
.legend{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--muted);margin:12px 2px;flex-wrap:wrap;}.legend .lg{display:inline-flex;align-items:center;gap:6px;}
.badge-info-btn{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-bg);border:1px solid #BFDBFE;border-radius:999px;padding:2px 9px;cursor:help;margin-left:6px;white-space:nowrap;}
.vol-surge-badge{display:inline-flex;align-items:center;background:#E8590C;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0;}

/* HOT 카드 줄 (랭킹 바로가기) */
.hotcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.hot{display:flex;align-items:center;gap:13px;background:var(--canvas);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--s1);padding:13px 16px;text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s,box-shadow .12s;}
.hot:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.08);}
.hot__ic{width:42px;height:42px;border-radius:11px;background:var(--inset);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hot__tx{display:flex;flex-direction:column;gap:2px;min-width:0;}
.hot__tx b{font-size:14px;font-weight:800;letter-spacing:-.3px;line-height:1.2;}
.hot__tx small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hot__arr{margin-left:auto;font-size:15px;color:#C0C4CA;flex-shrink:0;}.hot:hover .hot__arr{color:var(--primary);}
.hot--ai{background:var(--primary-bg);border-color:#BFDBFE;}.hot--ai .hot__ic{background:#fff;}.hot--ai .hot__tx b{color:var(--primary);}
.hot--etf .hot__tx b{color:#374151;}
@media(max-width:720px){.hotcards{grid-template-columns:1fr;}}

.block{background:var(--soft);border:1px solid var(--hair);border-radius:10px;overflow:hidden;margin-bottom:12px;box-shadow:var(--s1);}
.block__h{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--canvas);border-bottom:1px solid var(--hair);}
.block__t{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;}.block__t .ic{font-size:14px;}.block__t::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px;}
.block__s{font-size:11px;color:var(--muted);}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--hair);background:var(--canvas);text-decoration:none;color:var(--ink);}
.row:last-of-type{border-bottom:none;}.row:hover{background:var(--primary-bg);}
.rk{width:16px;text-align:center;font-size:13px;font-weight:800;color:var(--muted);flex-shrink:0;}.rk.t{color:var(--primary);}
.nm{width:148px;flex-shrink:0;}.nm b{font-size:13px;font-weight:700;display:block;line-height:1.3;}.nm small{font-size:10px;color:var(--muted);}
.barwrap{flex:1;height:19px;background:var(--inset);border-radius:5px;overflow:hidden;position:relative;}
.bar{height:100%;border-radius:5px;}.bar.up{background:linear-gradient(90deg,#FFD3D3,#E03131);}.bar.dn{background:linear-gradient(90deg,#CFE0FF,#2775ED);}.bar.vol{background:linear-gradient(90deg,#CFE0FF,#006EFF);}
.barval{position:absolute;right:10px;top:0;height:19px;display:flex;align-items:center;font-size:11px;font-weight:800;}
.ai{width:72px;text-align:right;flex-shrink:0;}
.aip{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--primary);color:#fff;}
.ais{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--canvas);border:1.5px solid #BFDBFE;color:var(--primary);}
.aid{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--canvas);border:1.5px solid #FBD0D0;color:var(--up);}
.ax{font-size:12px;color:#C0C4CA;}
.more{display:block;text-align:center;padding:10px;font-size:12px;font-weight:700;color:var(--primary);background:var(--canvas);border-top:1px solid var(--hair);text-decoration:none;}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cols2 .block{margin-bottom:0;}
.cols2 .nm{width:112px;}.cols2 .ai{width:62px;}.cols2 .nm small{font-size:9px;}
.block__t.etf::before{background:#6B7280;}.block__t.etf{color:#374151;}

/* detail 2-col */
.grid{display:grid;grid-template-columns:1fr 360px;column-gap:20px;align-items:start;}
/* chips 2-col: 좌=밤사이(과거) 우=한국종목(현재) */
.chip-layout{display:grid;grid-template-columns:336px 1fr;column-gap:16px;align-items:start;}
.chip-sb-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:0 2px 8px;display:flex;align-items:center;gap:6px;}
.chip-sb-label::after{content:'';flex:1;height:1px;background:var(--hair);}
.chip-arrow{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--hair);padding:8px 0;}
.hero2{background:var(--canvas);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--s1);margin-bottom:12px;overflow:hidden;}
.hero2 .top{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 0;}
.hero2 .hn{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;}
.chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--primary-bg);color:var(--primary);cursor:pointer;}
.hero2 .meta{font-size:12px;color:var(--muted);margin-top:5px;}
.hero2 .px{font-size:21px;font-weight:800;text-align:right;}.hero2 .cg{font-size:13px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--up-bg);color:var(--up);margin-top:5px;display:inline-block;}
/* chart tabs */
.ctabs{display:flex;gap:2px;padding:12px 16px 0;}
.ctabs a{font-size:11px;font-weight:700;padding:5px 11px;border-radius:6px;color:var(--muted);cursor:pointer;user-select:none;}
.ctabs a.on{background:var(--inset);color:var(--ink);}
.cpane{padding:0;}
.cpane.hidden{display:none;}
.chart-wrap{padding:8px 14px 12px;position:relative;}
.cmk-layer{position:absolute;left:14px;right:14px;top:8px;height:80px;pointer-events:none;}
.cmk{position:absolute;font-size:10px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.72);padding:0 2px;border-radius:3px;}
.cmk.hi{color:var(--up);}
.cmk.lo{color:var(--dn);}
.chart-svg{width:100%;height:80px;display:block;overflow:visible;}
.taxis{display:flex;justify-content:space-between;padding:4px 2px 0;font-size:10px;color:var(--muted);font-weight:600;}
.chart-tt{position:absolute;background:var(--canvas);border:1px solid var(--hair);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;box-shadow:var(--s1);pointer-events:none;white-space:nowrap;z-index:10;display:none;transform:translateX(-50%);top:6px;}
.chart-tt .ttd{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px;}
.chart-cross{position:absolute;width:1px;top:8px;bottom:24px;background:#9CA3AF;opacity:.5;pointer-events:none;display:none;}
.sc{background:var(--soft);border:1px solid var(--hair);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.sc__h{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--canvas);border-bottom:1px solid var(--hair);}
.sc__t{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;}.sc__t::before{content:'';width:3px;height:13px;background:var(--primary);border-radius:2px;}
.sc__s{font-size:11px;color:var(--muted);}.scb{padding:14px 16px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}.two .sc{margin-bottom:0;}
.pbadge{display:inline-flex;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--up-bg);color:var(--up);}
.pg{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,rgba(39,117,237,.38),var(--inset) 50%,rgba(224,49,49,.38));margin-top:14px;}
.pg .n{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--up);box-shadow:0 0 0 2px var(--canvas);transform:translateX(-50%);}
.pgs{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-top:9px;}
.ro{display:flex;align-items:baseline;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--hair);}
.ro b{font-size:26px;font-weight:800;color:var(--up);line-height:1;}.ro u{font-size:13px;font-weight:700;color:var(--up);text-decoration:none;}.ro .cf{margin-left:auto;font-size:12px;color:var(--muted);}.ro .cf b{color:var(--primary);font-size:14px;}
.scen{font-size:14px;color:var(--muted);line-height:1.85;margin:12px 0 0;}
.tiles{display:flex;gap:10px;}.tile{flex:1;background:var(--canvas);border:1px solid var(--hair);border-radius:8px;padding:12px 8px;text-align:center;}.tile .l{font-size:11px;color:var(--muted);margin-bottom:4px;}.tile .v{font-size:15px;font-weight:800;}
.ti-row{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--hair);}.ti-lbl{font-size:11px;font-weight:600;color:var(--muted);}.ti-desc{font-size:13px;color:var(--ink);line-height:1.5;}
.ti-signal{display:flex;align-items:flex-start;gap:10px;margin:12px 0;padding:12px;background:var(--surface, #F0FDF4);border:1px solid #BBF7D0;border-radius:8px;}.ti-sig-dot{flex-shrink:0;width:8px;height:8px;border-radius:50%;background:#16A34A;margin-top:4px;}.ti-sig-name{font-size:13px;font-weight:700;color:#15803D;display:block;margin-bottom:3px;}.ti-sig-sub{font-size:12px;color:#166534;line-height:1.55;}
.ti-stats{display:flex;gap:0;border-top:1px solid var(--hair);margin-top:4px;padding-top:12px;}.ti-stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}.ti-sv{font-size:15px;font-weight:800;}.ti-ss{font-size:10px;color:var(--muted);}
.panel{background:var(--canvas);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--s1);overflow:hidden;margin-bottom:16px;}
.panel__h{padding:12px 16px;border-bottom:1px solid var(--hair);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}.panel__h::before{content:'';width:3px;height:13px;background:var(--primary);border-radius:2px;}
.suprow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair);}
.supk{font-size:12px;color:var(--muted);margin-bottom:3px;}
.supv{font-size:19px;font-weight:800;line-height:1.1;}.supv.up{color:var(--up);}.supv.dn{color:var(--dn);}
.supt{font-size:11px;font-weight:600;color:var(--muted);margin-left:5px;}
.suphr{font-size:11px;color:var(--muted);margin-top:5px;}
.supR{flex-shrink:0;width:160px;}
.supr__head{display:flex;justify-content:flex-end;font-size:10px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.spark{display:flex;align-items:flex-end;justify-content:space-between;gap:5px;height:38px;}
.spark .sb{position:relative;flex:1;height:38px;}
.spark .sb::before{content:'';position:absolute;left:0;right:0;top:19px;height:1px;background:var(--hair);}
.spark .sb i{position:absolute;left:2px;right:2px;display:block;}
.spark .sb i.up{bottom:19px;background:var(--up);border-radius:2px 2px 0 0;}
.spark .sb i.dn{top:19px;background:var(--dn);border-radius:0 0 2px 2px;}
.spx{display:flex;justify-content:space-between;gap:5px;margin-top:5px;}.spx span{flex:1;text-align:center;font-size:9px;color:var(--muted);white-space:nowrap;}
.srow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--hair);text-decoration:none;color:var(--ink);}.srow:last-child{border-bottom:none;}.srow:hover{background:var(--primary-bg);}
.srow .n2{flex:1;font-size:13px;font-weight:600;}.srow .n2 small{color:var(--muted);font-weight:500;font-size:10px;margin-left:4px;}.srow .c{font-size:13px;font-weight:700;}
.phase{font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;margin-left:5px;background:var(--gold-bg);color:var(--gold);}
.note{font-size:11px;color:var(--gold);background:var(--gold-bg);padding:9px 16px;line-height:1.5;}

/* sector header */
.shead{background:var(--canvas);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--s1);padding:16px 18px;margin-bottom:12px;}
.shead .top{display:flex;justify-content:space-between;align-items:flex-start;}
.shead .st{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;}.shead .ss{font-size:12px;color:var(--muted);margin-top:5px;}
.shead .kpi{text-align:right;}.shead .kpi .l{font-size:11px;color:var(--muted);}.shead .kpi .v{font-size:17px;font-weight:800;}
.senti{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);}.senti .l{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px;}.senti .l b{color:var(--up);}
.gg{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,rgba(39,117,237,.35),var(--inset) 50%,rgba(224,49,49,.35));}.gg .n{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--up);box-shadow:0 0 0 2px var(--canvas);transform:translateX(-50%);}.gg__s{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:600;margin-top:8px;}
.lede{font-size:13px;color:var(--muted);line-height:1.85;background:var(--canvas);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;margin-bottom:16px;}.lede b{color:var(--ink);}
/* 섹터 시장폭 */
.breadth{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);}
.breadth .l{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px;}
.breadth .l b{color:var(--ink);}
.breadth .bbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--inset);}
.breadth .bbar i{display:block;height:100%;}.breadth .bbar .bu{background:var(--up);}.breadth .bbar .bd{background:var(--dn);}.breadth .bbar .bn{background:var(--hair);}
.breadth .bk{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted);font-weight:600;}
.breadth .bk i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.breadth .bk .iu{background:var(--up);}.breadth .bk .id{background:var(--dn);}.breadth .bk .in{background:var(--hair);}
.disc{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 2px 0;}

/* ranking page */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px;flex-wrap:wrap;}
.phead h1{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0;display:flex;align-items:center;gap:9px;}.phead h1 .ic{font-size:18px;}
.phead .psub{font-size:12px;color:var(--muted);margin-top:5px;}
.rtabs{display:inline-flex;background:var(--inset);border-radius:10px;padding:3px;gap:2px;}
.rtabs a{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:8px;}.rtabs a.on{background:var(--canvas);color:var(--primary);box-shadow:var(--s1);}
.fbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;}.fbar .lbl{font-size:12px;font-weight:700;color:var(--muted);}
.fchips{display:flex;flex-wrap:wrap;gap:7px;}.fchips a{font-size:12px;font-weight:600;color:var(--muted);background:var(--canvas);border:1px solid var(--hair);border-radius:999px;padding:6px 13px;text-decoration:none;}.fchips a.on{background:var(--primary-bg);border-color:#BFDBFE;color:var(--primary);}
.tbl{background:var(--soft);border:1px solid var(--hair);border-radius:10px;overflow:hidden;box-shadow:var(--s1);}
.trow{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--hair);text-decoration:none;color:var(--ink);background:var(--canvas);}.trow:last-child{border-bottom:none;}.trow:hover{background:var(--primary-bg);}
.tchg{width:68px;text-align:right;flex-shrink:0;font-size:13px;font-weight:800;}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;}
.pager a{min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--hair);background:var(--canvas);font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:0 6px;}.pager a.on{background:var(--primary);border-color:var(--primary);color:#fff;}

/* etf-detail donut + holdings */
.donutwrap{display:flex;gap:20px;align-items:center;padding:14px 16px;}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;position:relative;
  background:conic-gradient(#006EFF 0 111.6deg,#16A34A 0 151.2deg,#B7791F 0 183.6deg,#2775ED 0 212.4deg,#9333EA 0 234deg,#9CA3AF 0 360deg);}
.donut::after{content:'';position:absolute;inset:20px;background:var(--soft);border-radius:50%;}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;}
.donut .ctr b{font-size:16px;font-weight:800;}.donut .ctr span{font-size:10px;color:var(--muted);}
.sec-legend{display:flex;flex-direction:column;gap:8px;flex:1;}
.sec-legend .lg{display:flex;align-items:center;gap:8px;font-size:12px;}
.sec-legend .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.sec-legend .pc{margin-left:auto;font-weight:800;}
.hold{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hair);text-decoration:none;color:var(--ink);background:var(--canvas);}
.hold:last-child{border-bottom:none;}.hold:hover{background:var(--primary-bg);}
.hold .rk{font-size:11px;font-weight:700;color:var(--muted);width:16px;text-align:center;flex-shrink:0;}
.hold .nm{flex:1;font-size:13px;font-weight:600;}.hold .nm small{display:block;color:var(--muted);font-weight:500;font-size:10px;margin-top:1px;}
.hold .chg{font-size:12px;font-weight:700;width:50px;text-align:right;}
.wt{width:88px;text-align:right;}.wt b{font-size:13px;font-weight:800;}
.wt .bar2{height:4px;border-radius:999px;background:var(--inset);margin-top:4px;overflow:hidden;}.wt .bar2>i{display:block;height:100%;background:var(--primary);}
.spec-tbl{display:flex;flex-direction:column;}
.spec-tbl .it{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--hair);font-size:13px;}
.spec-tbl .it:last-child{border-bottom:none;}
.spec-tbl .k{color:var(--muted);}.spec-tbl .v{font-weight:700;}
.etf-pbadge{display:inline-flex;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--inset);color:var(--muted);}

/* overlay */
.ov{display:none;position:fixed;inset:0;z-index:50;background:rgba(19,21,26,.42);align-items:flex-start;justify-content:center;padding-top:80px;}.ov.on{display:flex;}
.pal{width:460px;max-width:92vw;background:var(--canvas);border:1px solid var(--hair);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden;}
.pal__in{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--hair);}.pal__in svg{width:18px;height:18px;color:var(--muted);}.pal__in input{border:none;outline:none;font-size:16px;font-weight:600;font-family:inherit;flex:1;color:var(--ink);background:transparent;}
.grp__t{font-size:11px;font-weight:700;color:var(--muted);padding:8px 17px 4px;}
.res{display:flex;align-items:center;gap:10px;padding:9px 17px;cursor:pointer;text-decoration:none;color:var(--ink);}.res:hover,.res.sel{background:var(--primary-bg);}
.res .ico{width:24px;height:24px;border-radius:6px;background:var(--inset);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted);}.res.sel .ico{background:var(--primary);color:#fff;}
.res .n3{flex:1;font-size:13px;font-weight:700;}.res .n3 small{font-size:10px;color:var(--muted);margin-left:5px;font-weight:500;}
.foot{display:flex;gap:14px;padding:9px 17px;border-top:1px solid var(--hair);font-size:11px;color:var(--muted);}.foot b{background:var(--soft);border:1px solid var(--hair);border-radius:4px;padding:1px 5px;color:var(--ink);}
.aip,.ais,.aid,.ax,.vol-surge-badge{cursor:help;}
#tip{position:fixed;z-index:100;display:none;max-width:268px;background:#fff;border:1px solid var(--hair);border-radius:11px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px 14px;pointer-events:none;}
#tip .tt{font-size:13px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
#tip .bd{font-size:12px;color:var(--muted);line-height:1.65;}
#tip .bd b{color:var(--ink);font-weight:700;}

/* ── 패시브 민감주 ── */
.block__t.pass::before{background:#0284C7;}
.block__t.pass{color:#0C4A6E;}
.bar.pbar{background:linear-gradient(90deg,#BAE6FD,#0284C7);}
.pbdg{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;cursor:help;}
.pbdg.high{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}
.pbdg.mid{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;}
.badge-pass-btn{font-size:11px;font-weight:600;color:#0284C7;background:#E0F2FE;border:1px solid #BAE6FD;border-radius:999px;padding:2px 9px;cursor:help;margin-left:6px;white-space:nowrap;}
/* 위젯 메트릭 타일 */
.pmet{display:flex;gap:8px;padding:12px 16px 0;}
.pmet .mc{flex:1;background:var(--soft);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;text-align:center;}
.pmet .mc .l{font-size:10px;color:var(--muted);margin-bottom:3px;}
.pmet .mc .v{font-size:15px;font-weight:800;}
.pmet .mc .sub{font-size:9px;color:var(--muted);margin-top:2px;}
/* 패시브 한줄 번역 */
.p1line{font-size:12px;color:var(--ink);padding:11px 16px 0;line-height:1.6;}
.p1line b{color:#0284C7;}
/* ETF 기여 행 */
.petf-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--hair);font-size:12px;}
.petf-row:last-child{border-bottom:none;}
.petf-row .en{flex:1;font-weight:600;}.petf-row .en small{display:block;font-size:10px;color:var(--muted);font-weight:400;}
.petf-row .wt{font-size:12px;font-weight:800;color:var(--primary);}
.petf-bar{height:3px;border-radius:999px;background:var(--inset);margin-top:3px;overflow:hidden;}
.petf-bar i{display:block;height:100%;background:#0284C7;border-radius:999px;}
/* 면책 띠 */
.pdisc{font-size:10px;color:var(--muted);padding:7px 16px;background:var(--soft);line-height:1.5;border-top:1px solid var(--hair);}
/* 패시브 랭킹 페이지 */
.prank-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--hair);background:var(--canvas);text-decoration:none;color:var(--ink);}
.prank-row:last-child{border-bottom:none;}
.prank-row:hover{background:#F0F9FF;}
.prank-row .rk2{width:20px;text-align:center;font-size:13px;font-weight:800;color:var(--muted);flex-shrink:0;}
.dov-bar{flex:1;height:18px;background:var(--inset);border-radius:5px;overflow:hidden;position:relative;}
.dov-bar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#BAE6FD,#0284C7);}
.dov-bar .val{position:absolute;right:8px;top:0;height:18px;display:flex;align-items:center;font-size:11px;font-weight:800;color:#0C4A6E;}
.conc-col{width:56px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;}
.score-col{width:44px;text-align:right;font-size:13px;font-weight:800;color:#0284C7;flex-shrink:0;}
/* 섹터 쏠림 배너 */
.sector-bias{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:11px 16px;margin-bottom:14px;font-size:12px;color:#0C4A6E;display:flex;align-items:center;gap:10px;}
.sector-bias .ic2{font-size:18px;flex-shrink:0;}
.sector-bias b{font-weight:800;}
/* 정렬 토글 */
.stabs{display:inline-flex;background:var(--inset);border-radius:8px;padding:3px;gap:2px;margin-bottom:12px;}
.stabs a{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:6px;cursor:pointer;}
.stabs a.on{background:var(--canvas);color:#0284C7;box-shadow:var(--s1);}

/* ── 배당 인컴 설계기 (ncai-design-system 토큰 정렬) ── */
/* 시맨틱: success #00ae1a/#ecfeea · warning #eb8e02/#fff9e3 · error #f33942/#fff5f7 */
/* 인컴 시뮬레이터 (보유 입력 → 계산) */
.sim{background:var(--canvas);border:1px solid var(--hair);border-radius:16px;box-shadow:0 4px 12px rgba(15,23,42,.08);overflow:hidden;margin-bottom:16px;}
.sim__h{padding:16px 20px;border-bottom:1px solid var(--hair);background:var(--soft);}
.sim__h .q{font-size:15px;font-weight:600;color:var(--ink);}
.sim__h .q small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px;}
.simrow{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--hair);}
.simrow .snm{flex:1;font-size:14px;font-weight:500;min-width:0;}
.simrow .snm .mk{font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:6px;background:var(--inset);color:var(--muted);}
.simrow .qty{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.simrow .qty input{width:88px;border:1px solid var(--hair);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;text-align:right;}
.simrow .qty span{font-size:12px;color:var(--muted);}
.simrow .sinc{width:104px;text-align:right;flex-shrink:0;}.simrow .sinc b{font-size:14px;font-weight:600;color:#4F46E5;}.simrow .sinc small{display:block;font-size:10px;color:var(--muted);}
.simrow .sx{width:18px;text-align:center;color:#C0C4CA;cursor:pointer;font-size:16px;flex-shrink:0;}.simrow .sx:hover{color:var(--up);}
.sim__add{display:flex;gap:8px;padding:14px 20px;background:var(--soft);border-bottom:1px solid var(--hair);align-items:flex-start;}
.combo{position:relative;flex:1;min-width:0;}
.combo input{width:100%;border:1px solid var(--hair);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;}
.combo input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,110,255,.12);}
.combo__list{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:var(--canvas);border:1px solid var(--hair);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);max-height:264px;overflow-y:auto;}
.combo__list.on{display:block;}
.combo__hd{font-size:11px;font-weight:600;color:var(--muted);padding:8px 12px 4px;letter-spacing:.4px;}
.combo__item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;}
.combo__item:hover,.combo__item.sel{background:var(--primary-bg);}
.combo__item .ci-nm{flex:1;font-weight:500;min-width:0;}
.combo__item .ci-nm small{color:var(--muted);font-weight:400;margin-left:5px;font-size:11px;}
.combo__item .ci-mk{font-size:9px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--inset);color:var(--muted);}
.combo__item .ci-y{font-size:12px;font-weight:600;color:#4F46E5;}
.combo__none{padding:12px;font-size:12px;color:var(--muted);text-align:center;}
.qty{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.qty input{width:78px;border:1px solid var(--hair);border-radius:6px;padding:8px 9px;font-size:13px;font-family:inherit;text-align:right;}
.qty span{font-size:13px;color:var(--muted);font-weight:500;}
.sim__add a{font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px;background:#4F46E5;color:#fff;cursor:pointer;white-space:nowrap;}
.sim__target{display:flex;flex-direction:column;gap:10px;padding:14px 20px;font-size:14px;font-weight:500;color:var(--ink);border-bottom:1px solid var(--hair);background:var(--canvas);}
.sim__target-row{display:flex;align-items:center;gap:8px;}
.sim__target input{width:84px;border:1px solid var(--hair);border-radius:6px;padding:7px 8px;font-size:14px;font-family:inherit;text-align:right;font-weight:600;}
.sim__presets{display:flex;gap:6px;flex-wrap:wrap;}
.sim__presets a{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--hair);background:var(--canvas);color:var(--muted);cursor:pointer;transition:all .15s;}
.sim__presets a:hover{border-color:#4F46E5;color:#4F46E5;}
.sim__presets a.on{background:#4F46E5;border-color:#4F46E5;color:#fff;}
.sim__out{padding:18px 20px;}
.sim-kpi{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.sim-kpi .k{flex:1;min-width:104px;background:var(--soft);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;}
.sim-kpi .k .l{font-size:11px;color:var(--muted);margin-bottom:3px;}
.sim-kpi .k .v{font-size:20px;font-weight:600;}
/* 리포트 카드 */
.sim-report-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:0 2px 8px;}
.sim-report{display:flex;flex-direction:column;gap:8px;}
.rc{background:var(--canvas);border:1px solid var(--hair);border-radius:12px;overflow:hidden;transition:box-shadow .15s;}
.rc:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.rc.open{border-color:#CBD5E1;}
.rc-head{display:flex;align-items:center;gap:8px;padding:13px 16px;background:var(--soft);cursor:pointer;user-select:none;transition:background .12s;}
.rc-head:hover{background:#ECEDEF;}
.rc.open .rc-head{border-bottom:1px solid var(--hair);}
.rc-head .rci{font-size:15px;line-height:1;}
.rc-head .rct{font-size:13px;font-weight:700;color:var(--ink);}
.rc-head .rcb{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.rcb.red{background:#FEE2E2;color:#f33942;}
.rcb.green{background:#D1FAE5;color:#059669;}
.rcb.amber{background:#FEF3C7;color:#B7791F;}
.rcb.blue{background:#DBEAFE;color:#2563EB;}
.rc-chev{margin-left:8px;font-size:10px;color:var(--muted);transition:transform .2s;flex-shrink:0;}
.rc.open .rc-chev{transform:rotate(180deg);}
.rc-body{display:none;padding:14px 16px;font-size:13px;line-height:1.75;color:var(--ink);}
.rc.open .rc-body{display:block;}
.rc-body b{font-weight:600;}
.rc-body .rc-flow{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 2px;margin-bottom:2px;}
.rc-body .rc-from{color:var(--muted);}
.rc-body .rc-arr{color:#00ae1a;font-weight:700;margin:0 4px;font-size:15px;}
.rc-body .rc-to{color:#4F46E5;font-weight:700;}
.rc-body .rc-dest{display:inline-flex;align-items:baseline;flex-shrink:0;}
.rc-body .rc-num{font-variant-numeric:tabular-nums;}
.rc-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);}
.rc-act{font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;transition:opacity .12s;}
.rc-act:hover{opacity:.8;}
.rc-act.pri{background:#4F46E5;color:#fff;}
.rc-act.sec{background:var(--soft);border:1px solid var(--hair);color:var(--ink);}

function fmt(n){return Number(n).toLocaleString();}
function pct(v){return (v>=0?'+':'−')+Math.abs(v).toFixed(2)+'%';}
function closes(px,chg){var f=chg>=0?[0.965,0.978,0.986,0.994,1]:[1.035,1.022,1.014,1.006,1];return f.map(function(k){return Math.round(px*k/100)*100;});}

function chartPane(c5){
  var lo=Math.min.apply(null,c5),hi=Math.max.apply(null,c5),span=(hi-lo)||1;
  var pts=c5.map(function(v,i){return [Math.round(i/4*740),+(64-(v-lo)/span*48).toFixed(1)];});
  var poly=pts.map(function(p){return p[0]+','+p[1];}).join(' ');
  var area='M'+pts.map(function(p){return p[0]+','+p[1];}).join(' L')+' L740,76 L0,76 Z';
  var hiI=c5.indexOf(hi),loI=c5.indexOf(lo);
  var axis=['06-15','06-16','06-17','06-18','06-19'];
  return '<div class="cpane chart-wrap" id="stock-5d" data-lo="'+lo+'" data-hi="'+hi+'">'
   +'<svg class="chart-svg" viewBox="0 0 740 80" preserveAspectRatio="none"><defs><linearGradient id="grad-up" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E03131" stop-opacity="0.18"/><stop offset="100%" stop-color="#E03131" stop-opacity="0"/></linearGradient></defs>'
   +'<path d="'+area+'" fill="url(#grad-up)"/><polyline fill="none" stroke="#E03131" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+poly+'"/>'
   +'<circle cx="'+pts[0][0]+'" cy="'+pts[0][1]+'" r="3.5" fill="#fff" stroke="#2775ED" stroke-width="2"/><circle cx="'+pts[4][0]+'" cy="'+pts[4][1]+'" r="3.5" fill="#fff" stroke="#E03131" stroke-width="2"/></svg>'
   +'<div class="cmk-layer"><span class="cmk hi" style="left:'+(hiI/4*100)+'%;top:'+pts[hiI][1]+'px;transform:translate(-50%,-130%);">고점 '+fmt(hi)+'</span>'
   +'<span class="cmk lo" style="left:'+(loI/4*100)+'%;top:'+pts[loI][1]+'px;transform:translate(-50%,45%);">저점 '+fmt(lo)+'</span></div>'

  var iss=s.iss?'<div class="sc" style="border-color:#FDE68A;background:#FFFBEB;"><div class="scb" style="display:flex;gap:11px;align-items:flex-start;padding:13px 16px;"><span style="font-size:15px;flex-shrink:0;line-height:1.5;">📰</span><div style="font-size:13px;line-height:1.65;color:#92400E;"><b style="display:block;margin-bottom:3px;">오늘 왜 움직였나</b>'+s.iss+'<span style="display:block;margin-top:5px;font-size:11px;color:#B7791F;font-weight:600;">06-19 18:20 · 더블샷 이슈 수집</span></div></div></div>':'';
  app.innerHTML='<div class="crumb">'+BACK+'<a onclick="goHub()">홈</a> › <a onclick="goHub()">종목</a> › <a onclick="goHub(\'sector\')">'+s.sec+'</a> › <span style="color:var(--ink)">'+s.n+'</span></div>'
   +'<div class="grid"><div>'

}

function goHub(screen){location.href='/stocks/'+(screen?'#'+screen:'');}

// 차트 호버 — 가장 가까운 일봉 꼭짓점에 크로스헤어·종가·일자 툴팁 표시
(function(){
  function initChart(wrap){
    var poly=wrap.querySelector('polyline'),svg=wrap.querySelector('svg');
    if(!poly||!svg)return;
    var vbH=svg.viewBox.baseVal.height,svgH=80,PAD=14;
    var pts=poly.getAttribute('points').trim().split(/\s+/).map(function(p){var a=p.split(',');return{x:+a[0],y:+a[1]};});
    var ys=pts.map(function(p){return p.y;}),yMin=Math.min.apply(null,ys),yMax=Math.max.apply(null,ys);
    var lo=+wrap.dataset.lo,hi=+wrap.dataset.hi;
    var labels=[].map.call(wrap.querySelectorAll('.taxis span'),function(s){return s.textContent;});
    var cross=document.createElement('div');cross.className='chart-cross';
    var dot=document.createElement('div');dot.style.cssText='position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid var(--up);transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:11;';
    var tt=document.createElement('div');tt.className='chart-tt';
    wrap.appendChild(cross);wrap.appendChild(dot);wrap.appendChild(tt);
    wrap.addEventListener('mousemove',function(e){
      var r=wrap.getBoundingClientRect(),plotW=r.width-PAD*2;if(plotW<=0)return;
      var cx=Math.max(0,Math.min(plotW,e.clientX-r.left-PAD)),vx=cx/plotW*740;
      var best=pts[0],bd=1e9;pts.forEach(function(p){var d=Math.abs(p.x-vx);if(d<bd){bd=d;best=p;}});
      var sx=PAD+best.x/740*plotW,sy=8+best.y/vbH*svgH;
      var price=Math.round((hi-(best.y-yMin)/((yMax-yMin)||1)*(hi-lo))/100)*100;
      var li=Math.round(best.x/740*(labels.length-1)),dl=labels[Math.max(0,Math.min(labels.length-1,li))]||'';
      cross.style.left=sx+'px';cross.style.display='block';
      dot.style.left=sx+'px';dot.style.top=sy+'px';dot.style.display='block';
      tt.innerHTML=price.toLocaleString()+'<span style="font-size:11px;font-weight:600;color:var(--muted);margin-left:2px;">원</span>';
      tt.style.left=Math.max(44,Math.min(r.width-44,sx))+'px';tt.style.display='block';
    });
    wrap.addEventListener('mouseleave',function(){cross.style.display='none';dot.style.display='none';tt.style.display='none';});
  }
  document.querySelectorAll('.chart-wrap[data-lo]').forEach(initChart);
})();

// 차트 색상 — 당일 등락(.cg ▲/▼) 기준: 상승 빨강, 하락 파랑
(function applyChartColors() {
  const cg = document.querySelector('.cg');
  const color = (cg && cg.textContent.includes('▲')) ? '#E03131' : '#2775ED';
  document.querySelectorAll('.chart-wrap').forEach(function(pane) {
    const polyline = pane.querySelector('polyline');
    if (!polyline) return;
    polyline.setAttribute('stroke', color);
    pane.querySelectorAll('linearGradient stop').forEach(function(s) {
      s.setAttribute('stop-color', color);
    });
    const circles = pane.querySelectorAll('circle');
    if (circles.length) circles[circles.length - 1].setAttribute('stroke', color);
  });
})();
</script>
