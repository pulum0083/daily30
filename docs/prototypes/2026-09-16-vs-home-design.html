.pt-tag.exist{color:var(--muted);background:#EEF1F5;border:1px solid var(--hair)}
.pt-tag.newc{color:#fff;background:var(--primary,#006EFF)}

/* ── 새로 덧댄 것만 vsx- (기존 vs- 클래스는 건드리지 않는다) ── */
.vs-card .vsx-sec{margin-top:24px;padding-top:16px;border-top:1px solid #F1F5F9}
.vs-card .vsx-sec + .vs-lbl-s{margin:2px 0 12px}
.vsx-why{list-style:none;margin:11px 0 0;padding:0}
.vsx-why li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 0;
  border-top:1px solid #F1F5F9;font-size:13px;line-height:1.6;color:var(--muted)}
.vsx-why li:first-child{border-top:0}
.vsx-why .k{font-size:11px;font-weight:700;color:#0F172A}
.vsx-why b{color:#0F172A;font-weight:700;font-variant-numeric:tabular-nums}
/* 0축을 가운데 둔 세로 막대 — 어제 옅게 · 오늘 진하게 (브리핑 flow-chart 문법) */
.vsx-mini{margin-top:9px}
.vsx-bars{height:40px;display:grid;grid-template-columns:repeat(2,26px);gap:8px;
  justify-content:center;position:relative}
.vsx-bars.zero::before,.vsx-bars.base::before{content:'';position:absolute;left:0;right:0;height:1px;background:var(--hair)}
.vsx-bars.zero::before{top:50%} .vsx-bars.base::before{bottom:0}
.vsx-bar{position:relative}
.vsx-bar i{position:absolute;left:0;right:0;border-radius:3px;display:block}
.vsx-bar i.up{background:var(--up)} .vsx-bar i.dn{background:var(--dn)}
.vsx-bar i.mag{background:#0F172A;opacity:.6}   /* 방향 없는 양 — 상승/하락 색을 쓰지 않는다 */
.vsx-bar.prev i{opacity:.32}
.vsx-ax{display:grid;grid-template-columns:repeat(2,26px);gap:8px;justify-content:center;
  font-size:9px;color:var(--muted);text-align:center;margin-top:4px}
.vsx-ax .t{color:#0F172A;font-weight:700}
.vsx-pairs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:4px}
.vsx-pbars{height:76px;display:grid;grid-template-columns:repeat(2,20px);gap:5px;
  justify-content:center;position:relative}
.vsx-pbars::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--hair)}
.vsx-pv{font-size:10px;font-weight:800;text-align:center;margin-top:5px;font-variant-numeric:tabular-nums}
.vsx-pp{font-size:9px;color:var(--muted);text-align:center;margin-top:1px;font-variant-numeric:tabular-nums}
.vsx-pl{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.vsx-tbl{width:100%;border-collapse:collapse;margin-top:8px}
.vsx-tbl th{padding:7px 8px;background:#FAFBFC;font-size:11px;font-weight:800;color:var(--muted);
  text-align:right;border-bottom:1px solid #EEF2F6;white-space:nowrap}
.vsx-tbl td{padding:8px;border-bottom:1px solid #EEF2F6;text-align:right;white-space:nowrap;
  font-size:12.5px;color:#0F172A;font-variant-numeric:tabular-nums}
.vsx-tbl tr:last-child td{border-bottom:none}
.vsx-tbl th:first-child,.vsx-tbl td:first-child{text-align:left}
.vsx-tbl td.nm{font-weight:700;white-space:normal}
.vsx-tbl td.nm small{display:block;font-size:10px;font-weight:400;color:#94A3B8;margin-top:2px}
.vsx-rk{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;
  background:#F1F5F9;font-size:10px;font-weight:800;color:var(--muted);margin-right:7px;vertical-align:1px}
.vsx-rk.top{background:#0F172A;color:#fff}
.up{color:var(--up)} .dn{color:var(--dn)} .mu{color:var(--muted)}
/* 곡선 — 프로덕션 .vs-chart/.vs-line-*/.vs-band/.vs-zero/.vs-rest/.vs-now 를 그대로 쓴다 */
.vsx-spark{display:block;width:100%;height:100%}
.ksp{display:inline-block;width:52px;height:16px;vertical-align:middle;margin:0 6px}

/* ── 코스피 곡선 — 프로덕션 .vs-chart 문법 그대로(오늘 실선·어제 점선·차이 색 띠) ──
   실측 1분봉에서 만든다. 세로축은 두 곡선을 같은 축에 두고, 장중이면 남은 장을 음영으로 둔다. */
function kospiCurve(key,endMin,nowLbl){
  const C=window.VSDATA.curve[key], W=600, H=180, PT=10, PB=16;
  const vals=[...C.t,...C.y].map(p=>p[1]);
  const lo=Math.min(...vals), hi=Math.max(...vals), pad=(hi-lo)*0.12||0.2;
  const y0=lo-pad, y1=hi+pad;
  const X=m=>m/endMin*W, Y=v=>PT+(y1-v)/(y1-y0)*(H-PT-PB);
  const path=a=>a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  // 차이 띠 — 구간마다 부호로 색을 나눈다(오늘이 위면 up, 아래면 dn)
  const n=Math.min(C.t.length,C.y.length), bands=[];
  for(let i=0;i<n-1;i++){
    const a=C.t[i],b=C.t[i+1],c=C.y[i],d=C.y[i+1];
    const cls=((a[1]-c[1])+(b[1]-d[1]))>=0?'up':'dn';
    bands.push(`<polygon class="vs-band ${cls}" points="${X(a[0]).toFixed(1)},${Y(a[1]).toFixed(1)} ${X(b[0]).toFixed(1)},${Y(b[1]).toFixed(1)} ${X(d[0]).toFixed(1)},${Y(d[1]).toFixed(1)} ${X(c[0]).toFixed(1)},${Y(c[1]).toFixed(1)}"/>`);
  }
  const lastT=C.t[C.t.length-1], lastY=C.y[C.y.length-1];
  const ticks=[];
  for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;
    ticks.push({v,y:Y(v)});}
  const restX=X(lastT[0]);
  const xs=[[0,'09:00'],[120,'11:00'],[240,'13:00'],[390,'15:30']];
  return `<div class="vs-legend"><span><i></i>오늘</span><span><i class="y"></i>어제 같은 시각</span>
      <span><i class="a"></i>차이</span><span class="r">${nowLbl}</span></div>
    <div class="vs-chartbox"><div class="vs-plot">
      <svg class="vs-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        ${restX<W?`<rect class="vs-rest" x="${restX.toFixed(1)}" y="0" width="${(W-restX).toFixed(1)}" height="${H}"/>`:''}
        ${ticks.map(t=>`<line class="vs-grid" x1="0" y1="${t.y.toFixed(1)}" x2="${W}" y2="${t.y.toFixed(1)}" vector-effect="non-scaling-stroke"/>`).join('')}
        <line class="vs-zero" x1="0" y1="${Y(0).toFixed(1)}" x2="${W}" y2="${Y(0).toFixed(1)}" vector-effect="non-scaling-stroke"/>
        ${bands.join('')}
        <path class="vs-line-y" d="${path(C.y)}" vector-effect="non-scaling-stroke"/>
        <path class="vs-line-t" d="${path(C.t)}" vector-effect="non-scaling-stroke"/>
        ${restX<W?`<line class="vs-now" x1="${restX.toFixed(1)}" y1="0" x2="${restX.toFixed(1)}" y2="${H}" vector-effect="non-scaling-stroke"/>`:''}
      </svg>
      ${ticks.map(t=>`<span class="vs-ytick" style="top:${(t.y/H*100).toFixed(2)}%">${(t.v>0?'+':'')+t.v.toFixed(1)}%</span>`).join('')}
      <span class="vs-end" style="top:${(Y(lastT[1])/H*100).toFixed(2)}%">오늘<b class="${cl(lastT[1])}">${sp(lastT[1])}%</b></span>
      <span class="vs-end" style="top:${(Y(lastY[1])/H*100).toFixed(2)}%">어제<b class="mu">${sp(lastY[1])}%</b></span>
    </div>
    <div class="vs-axis">${xs.map(([m,l])=>`<span style="left:${(X(m)/W*100).toFixed(2)}%;transform:translateX(-50%)">${l}</span>`).join('')}</div></div>`;
}

/* 섹터 카드 장중 스파크 — 실측 1분봉(오늘) */
function sparkSvg(pts,color){
  if(!pts||pts.length<2) return '';
  const lo=Math.min(...pts),hi=Math.max(...pts),r=(hi-lo)||1;
  const d=pts.map((v,i)=>(i?'L':'M')+(i/(pts.length-1)*240).toFixed(1)+' '+(30-(v-lo)/r*26).toFixed(1)).join(' ');
  return `<svg class="vsx-spark" viewBox="0 0 240 34" preserveAspectRatio="none" aria-label="오늘 장중 추이">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
}
function kospiSparkSvg(){
  const a=window.VSDATA.kospiSpark.map(x=>x[1]);
  const lo=Math.min(...a),hi=Math.max(...a),r=(hi-lo)||1;
  const d=a.map((v,i)=>(i?'L':'M')+(i/(a.length-1)*52).toFixed(1)+' '+(14-(v-lo)/r*12).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 52 16" preserveAspectRatio="none" style="width:52px;height:16px">
    <path d="${d}" fill="none" stroke="#94A3B8" stroke-width="1.3" vector-effect="non-scaling-stroke"/></svg>`;
}

function mini(prev,now,zero=true){
  const M=Math.max(Math.abs(prev),Math.abs(now))||1;
  const bar=(v,isNow)=>{const h=Math.max(Math.abs(v)/M*(zero?18:36),2);
    const st=zero?(v>=0?`bottom:50%;height:${h}px`:`top:50%;height:${h}px`):`bottom:0;height:${h}px`;
    return `<span class="vsx-bar ${isNow?'':'prev'}"><i class="${zero?(v>=0?'up':'dn'):'mag'}" style="${st}"></i></span>`;};
  return `<div class="vsx-mini"><div class="vsx-bars ${zero?'zero':'base'}">${bar(prev,0)}${bar(now,1)}</div>
    <div class="vsx-ax"><span>어제</span><span class="t">오늘</span></div></div>`;}
function stat(lbl,pl,nowLbl,nowVal,nowCls,prevVal,diff,chart){
  return `<div class="vs-stat"><div class="vs-stat-h">${lbl}${pl}</div>
    <div class="vs-stat-r"><span>${nowLbl}</span><b class="vs-big ${nowCls}">${nowVal}</b></div>
    <div class="vs-stat-r"><span>어제</span><b class="mu">${prevVal}</b></div>
    ${diff?`<p class="vs-diff">${diff}</p>`:''}${chart||''}</div>`;}
