<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방향 예측 검증 — NCAI DS v4</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --color-canvas:              #ffffff;
  --color-surface-soft:        #f9fafb;
  --color-surface-inset:       #eef1f5;
  --color-hairline:            #e5e7eb;
  --color-ink:                 #13151a;
  --color-body-muted:          #6b7280;
  --color-primary:             #006eff;
  --color-semantic-success:    #059669;
  --color-semantic-success-bg: #eefbec;
  --color-semantic-error:      #f33942;
  --color-semantic-error-bg:   #fef1f1;

  --font-text: "Pretendard Variable", "Pretendard", system-ui, -apple-system, sans-serif;
  --radius-md:  10px;
  --radius-lg:  16px;
  --radius-pill: 9999px;
  --fw-regular: 400;
  --fw-label:   500;
  --fw-heading: 600;

  --up:   #e53935;
  --down: #1565c0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-text);
  background: var(--color-surface-soft);
  color: var(--color-ink);
  word-break: keep-all;
  text-wrap: pretty;
  display: flex;
  justify-content: center;
  padding: 48px 16px;
  min-height: 100dvh;
}

.wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 28px; }

/* 카드 */
.card {
  background: var(--color-canvas);
  border: 1px solid var(--color-hairline);
  border-radius: var(--radius-lg);
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.card__head { display: flex; align-items: center; justify-content: space-between; }
.card__title {
  font-size: 13px;
  font-weight: var(--fw-label);
  color: var(--color-body-muted);
  letter-spacing: .3px;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 7px;
}
.card__title::before {
  content: '';
  width: 3px; height: 13px;
  background: var(--color-primary);
  border-radius: var(--radius-pill);
  flex-shrink: 0;
}
.card__sub { font-size: 11px; color: var(--color-body-muted); }

/* ── 예측 → [판정칩] → 실제 ── */
.flow {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 0;
}

.flow__box {
  background: var(--color-surface-soft);
  border: 1px solid var(--color-hairline);
  border-radius: var(--radius-md);
  padding: 13px 14px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.flow__lbl {
  font-size: 11px;
  font-weight: var(--fw-label);
  color: var(--color-body-muted);
  letter-spacing: .4px;
  text-transform: uppercase;
  line-height: 1.3;
}
.flow__dir {
  font-size: 17px;
  font-weight: var(--fw-heading);
  line-height: 1.2;
  letter-spacing: -.3px;
}
.flow__dir.up   { color: var(--up); }
.flow__dir.down { color: var(--down); }

/* 신뢰도 미니 게이지 */
.gauge { display: flex; flex-direction: column; gap: 4px; }
.gauge__track {
  height: 5px;
  border-radius: var(--radius-pill);
  background: var(--color-surface-inset);
  overflow: hidden;
}
.gauge__fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--up);
}
.gauge__fill.down { background: var(--down); }
.gauge__cap {
  font-size: 11px;
  color: var(--color-body-muted);
  line-height: 1.3;
}
.gauge__cap b { font-weight: var(--fw-label); color: var(--color-ink); }

/* 실제 박스 — 값 + 보조 */
.flow__val {
  font-size: 17px;
  font-weight: var(--fw-heading);
  line-height: 1.2;
  letter-spacing: -.3px;
}
.flow__val.up   { color: var(--up); }
.flow__val.down { color: var(--down); }
.flow__meta { font-size: 11px; color: var(--color-body-muted); line-height: 1.3; }

/* 중앙 판정칩 + 흐름 커넥터 */
.verdict {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 76px;
  align-self: stretch;
}
/* 좌우 연결선 (흐름) */
.verdict::before, .verdict::after {
  content: '';
  position: absolute;
  top: calc(50% - 9px);
  width: 14px;
  height: 1.5px;
  background: var(--color-hairline);
}
.verdict::before { left: -1px; }
.verdict::after  { right: -1px; }
/* 오른쪽 화살촉 */
.verdict__arrow {
  position: absolute;
  right: 10px;
  top: calc(50% - 9px - 3px);
  width: 6px; height: 6px;
  border-top: 1.5px solid var(--color-hairline);
  border-right: 1.5px solid var(--color-hairline);
  transform: rotate(45deg);
}

.verdict__chip {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px; height: 46px;
  border-radius: 50%;
  font-size: 20px;
  line-height: 1;
  z-index: 1;
}
.verdict__chip--hit  { background: var(--color-semantic-success-bg); color: var(--color-semantic-success); }
.verdict__chip--miss { background: var(--color-semantic-error-bg);   color: var(--color-semantic-error); }

.verdict__text { font-size: 11px; font-weight: var(--fw-label); letter-spacing: .2px; line-height: 1.2; }
.verdict__text--hit  { color: var(--color-semantic-success); }
.verdict__text--miss { color: var(--color-semantic-error); }

/* 하단 메타 — 누적 적중률 */
.card__foot {
  border-top: 1px solid var(--color-hairline);
  padding-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--color-body-muted);
}
.card__foot b { font-weight: var(--fw-label); color: var(--color-ink); }
.streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.streak__dots { display: inline-flex; gap: 3px; }
.streak__dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--color-hairline);
}
.streak__dot.hit  { background: var(--color-semantic-success); }
.streak__dot.miss { background: var(--color-semantic-error); }

/* 구분선 레이블 */
.scene-label {
  font-size: 12px;
  font-weight: var(--fw-label);
  color: var(--color-body-muted);
  letter-spacing: .3px;
  text-align: center;
  position: relative;
}
.scene-label::before, .scene-label::after {
  content: '';
  position: absolute;
  top: 50%;
  width: calc(50% - 56px);
  height: 1px;
  background: var(--color-hairline);
}
.scene-label::before { left: 0; }
.scene-label::after  { right: 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ── 적중 케이스 ── -->
  <div class="card">
    <div class="card__head">
      <span class="card__title">방향 예측 검증</span>
      <span class="card__sub">아침 예측 · 당일 종가 기준</span>
    </div>

    <div class="flow">
      <div class="flow__box">
        <span class="flow__lbl">예측</span>
        <span class="flow__dir up">▲ 상승 우위</span>
        <div class="gauge">
          <div class="gauge__track"><div class="gauge__fill up" style="width:78%"></div></div>
          <span class="gauge__cap">상승 확률 <b>78%</b> · 신뢰 <b>82</b></span>
        </div>
      </div>

      <div class="verdict">
        <span class="verdict__chip verdict__chip--hit">✓</span>
        <span class="verdict__text verdict__text--hit">적중</span>
        <span class="verdict__arrow"></span>
      </div>

      <div class="flow__box">
        <span class="flow__lbl">실제</span>
        <span class="flow__val up">▲ +0.15%</span>
        <span class="flow__meta">코스피 종가 8,801.49</span>
      </div>
    </div>

    <div class="card__foot">
      <span>코스피 종가 <b>8,801.49</b></span>
      <span class="streak">이번 달 <b>3/4 적중</b></span>
    </div>
  </div>

  <!-- ── 미스 케이스 ── -->
  <p class="scene-label">미스 케이스 예시</p>

  <div class="card">
    <div class="card__head">
      <span class="card__title">방향 예측 검증</span>
      <span class="card__sub">아침 예측 · 당일 종가 기준</span>
    </div>

    <div class="flow">
      <div class="flow__box">
        <span class="flow__lbl">예측</span>
        <span class="flow__dir up">▲ 상승 우위</span>
        <div class="gauge">
          <div class="gauge__track"><div class="gauge__fill up" style="width:65%"></div></div>
          <span class="gauge__cap">상승 확률 <b>65%</b> · 신뢰 <b>70</b></span>
        </div>
      </div>

      <div class="verdict">
        <span class="verdict__chip verdict__chip--miss">✗</span>
        <span class="verdict__text verdict__text--miss">미스</span>
        <span class="verdict__arrow"></span>
      </div>

      <div class="flow__box">
        <span class="flow__lbl">실제</span>
        <span class="flow__val down">▼ −0.82%</span>
        <span class="flow__meta">코스피 종가 2,488.31</span>
      </div>
    </div>

    <div class="card__foot">
      <span>코스피 종가 <b>2,488.31</b></span>
      <span class="streak">이번 달 <b>2/5 적중</b></span>
    </div>
  </div>

</div>
</body>
</html>
