<!-- 코스피 주도주 위젯 재구성 v3 — 장중지표 2종 축소·증권사 확대·뉴스 요약 추가·목표주가 강조 하향. 장중/마감후(HL 24h) 토글 포함. 더미 데이터 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

  :root{
    --canvas:#fff; --page:#f4f5f7; --ink:#0F172A; --ink2:#334155; --muted:#94A3B8;
    --hairline:#E5E7EB; --soft:#F7F9FC; --soft2:#F1F5F9; --primary:#2775ED;
    --up:#E03131; --up-bg:#FEF2F2; --dn:#2775ED;
    --r:14px; --s1:0 1px 2px rgba(20,22,26,.06); --gold:#B45309; --gold-bg:#FEF3C7;
    --buy:#16A34A; --buy-bg:#ECFDF3; --night:#6D28D9; --night-bg:#EDE9FE;
  }
  @media (prefers-color-scheme: dark){
    :root{ --canvas:#16181c; --page:#0e0f12; --ink:#eceef1; --ink2:#c3c8cf; --muted:#8b919a;
      --hairline:#282b31; --soft:#1c1f24; --soft2:#22262c; --primary:#5b9dff;
      --up:#ff6b6b; --up-bg:#3a1f22; --dn:#5b9dff;
      --gold:#f0b850; --gold-bg:#3a2f1a; --buy:#4ade80; --buy-bg:#16301f;
      --night:#c4b5fd; --night-bg:#2e2545; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);padding:28px 16px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;}
  .stage{max-width:860px;margin:0 auto}
  .stage>h4{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 12px;text-align:center}

  .widget{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r);
    box-shadow:var(--s1);padding:15px 16px}
  .w-head{display:flex;align-items:center;margin-bottom:11px;gap:8px;flex-wrap:wrap}
  .w-title{font-size:15px;font-weight:800}
  .w-sub{margin-left:auto;font-size:11px;color:var(--muted)}

  /* 탭 타일 — 실시간 가격이 페이지 최상위 강조 */
  .tiles{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
  .tiles::-webkit-scrollbar{display:none}
  .tile{flex:1 0 auto;cursor:pointer;background:var(--soft);border:1.5px solid var(--hairline);
    border-radius:12px;padding:12px 14px;transition:.12s}
  .tile.on{background:var(--canvas);border-color:var(--primary);box-shadow:0 3px 10px rgba(37,117,237,.12)}
  .t-mkt{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .t-pill{font-size:9px;font-weight:700;border-radius:999px;padding:1px 6px;margin-left:4px;
    color:var(--buy);background:var(--buy-bg)}
  .t-pill.night{color:var(--night);background:var(--night-bg)}
  .t-name{font-size:13px;font-weight:800}
  .t-px{font-size:22px;font-weight:900;margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .t-chg{font-size:12px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .t-chg.up{color:var(--up)} .t-chg.dn{color:var(--dn)}

  .body{margin-top:18px;padding-top:15px;border-top:1px solid var(--soft2)}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  .row + .row{margin-top:16px;padding-top:16px;border-top:1px solid var(--soft2)}
  .cL{flex:1.55 1 330px;min-width:0}
  .cR{flex:1 1 240px;min-width:0;border-left:1px solid var(--soft2);padding-left:18px}
  @media(max-width:680px){ .cR{flex:0 0 100%;border-left:none;padding-left:0;
    border-top:1px solid var(--soft2);padding-top:14px} }

  .ch{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .ch .note{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted)}
  .ch .live{font-size:10px;font-weight:800;color:var(--up);background:var(--up-bg);border-radius:999px;padding:2px 7px}
  .ch .live.night{color:var(--night);background:var(--night-bg)}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .ax{font-size:10px;fill:var(--muted);font-weight:600}

  /* 목표주가 — 강조 낮춤: 실시간가(22px/900)보다 확실히 아래 단계 */
  .tp-hero{display:flex;align-items:baseline;gap:7px}
  .tp-hero .lbl{font-size:11px;font-weight:700;color:var(--muted)}
  .tp-hero .val{font-size:16px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .tp-up{font-size:11.5px;font-weight:800;color:var(--up)}
  .tp-meta{font-size:10.5px;color:var(--muted);margin-top:3px}
  .tp-gauge{position:relative;height:5px;border-radius:4px;background:var(--soft2);margin:10px 0 11px;overflow:hidden}
  .tp-gauge .cur{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:#94A3B8}
  .brk{display:flex;align-items:center;gap:8px;padding:6.5px 0;border-top:1px solid var(--soft2)}
  .brk:first-of-type{border-top:none}
  .b-firm{font-size:12px;font-weight:700;min-width:62px;color:var(--ink2)}
  .b-op{font-size:9.5px;font-weight:800;color:var(--buy);background:var(--buy-bg);border-radius:5px;padding:1px 6px}
  .b-tp{margin-left:auto;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .b-date{font-size:10px;color:var(--muted);min-width:34px;text-align:right}

  /* 뉴스 — 제목 + 한 문장 요약 */
  .news a{display:block;text-decoration:none;color:inherit;padding:10px 0;border-top:1px solid var(--soft2)}
  .news a:first-child{border-top:none}
  .news a:hover .n-title{color:var(--primary)}
  .n-time{font-size:10.5px;font-weight:700;color:var(--muted)}
  .n-title{font-size:12.5px;font-weight:800;line-height:1.4;margin:3px 0 4px}
  .n-sum{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-bottom:4px}
  .n-src{font-size:10.5px;color:var(--muted)}

  /* 장중 지표 — 2종만, 세로 스택 */
  .m-blk{background:var(--soft);border:1px solid var(--hairline);border-radius:11px;padding:11px 13px}
  .m-blk + .m-blk{margin-top:9px}
  .m-h{display:flex;align-items:center;font-size:11.5px;font-weight:800;color:var(--ink2)}
  .m-h .v{margin-left:auto;font-size:16px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
  .m-bar{position:relative;height:7px;border-radius:5px;background:var(--soft2);margin:8px 0 5px;overflow:hidden}
  .m-bar .f{position:absolute;left:0;top:0;height:100%;border-radius:5px;background:#94A3B8}
  .m-bar .base{position:absolute;left:50%;top:0;width:1.5px;height:100%;background:#CBD5E1}
  .m-rng{position:relative;height:7px;border-radius:5px;margin:8px 0 5px;
    background:linear-gradient(90deg,#EFF4FE,#FEE9E9)}
  .m-rng .dot{position:absolute;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
  .m-cap{font-size:10.5px;color:var(--muted);line-height:1.45}
  .m-cap.sp{display:flex;justify-content:space-between}
  .m-moved{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.5;
    padding-top:9px;border-top:1px dashed var(--hairline)}
  .m-moved a{color:var(--primary);font-weight:700;text-decoration:none}

  .switcher{max-width:860px;margin:14px auto 0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .switcher span{font-size:11.5px;color:var(--muted);font-weight:700}
  .sw-btn{font-size:11.5px;font-weight:800;padding:6px 13px;border-radius:999px;cursor:pointer;

  .sw-btn.on{border-color:var(--primary);color:var(--primary);background:rgba(39,117,237,.07)}

  .foot{max-width:860px;margin:18px auto 0;font-size:11.5px;color:var(--muted);line-height:1.75;

  .foot ul{margin:6px 0 0;padding-left:17px} .foot li{margin-bottom:5px}
  .hier{display:flex;gap:8px;align-items:baseline;margin:8px 0 2px;flex-wrap:wrap}
  .hier i{font-style:normal;background:var(--soft);border:1px solid var(--hairline);border-radius:7px;padding:3px 9px;color:var(--ink2)}

        </div>
      </div>
    </div>
  </div>

  <div class="switcher">
    <span>시간대 미리보기:</span>
    <button class="sw-btn on" id="sw-day" onclick="setPhase('day')">장중 (09:00~15:30) · 실시간</button>
    <button class="sw-btn" id="sw-night" onclick="setPhase('night')">마감 후 · 하이퍼리퀴드 24h</button>
  </div>

  <div class="foot" id="foot"></div>
</div>

let PHASE='day', CUR='005930';

function series(seed,n){
  let v=100,out=[],s=seed;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=0;i<n;i++){ v+=(rnd()-0.47)*2.2; out.push(v); }
  return out;
}
function drawChart(d){
  const pts=series(PHASE==='day'?d.seed:d.seed+5,78), W=640,H=210,P={t:22,b:34,l:14,r:14};
  const mn=Math.min(...pts),mx=Math.max(...pts),span=(mx-mn)||1;
  const X=i=>P.l+(W-P.l-P.r)*(i/(pts.length-1));
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/span);
  const line=pts.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const base=H-P.b, iMax=pts.indexOf(mx), iMin=pts.indexOf(mn);
  const up=pts[pts.length-1]>=pts[0];
  const col=up?'#E03131':'#2775ED', fill=up?'rgba(224,49,49,.14)':'rgba(39,117,237,.14)';
  const t0=PHASE==='day'?'09:00':'15:40', t1=PHASE==='day'?'15:30':'익일 08:50';
  document.getElementById('svg').innerHTML=`
    <line x1="${P.l}" y1="${base}" x2="${W-P.r}" y2="${base}" stroke="var(--hairline)" stroke-width="1"/>
    <polygon points="${X(0)},${base} ${line} ${X(pts.length-1)},${base}" fill="${fill}"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(iMax)}" cy="${Y(mx)}" r="3" fill="${col}"/>
    <text class="ax" x="${Math.min(X(iMax)+6,W-90)}" y="${Y(mx)-7}" font-weight="700" fill="${col}">고점</text>
    <circle cx="${X(iMin)}" cy="${Y(mn)}" r="3" fill="var(--muted)"/>
    <text class="ax" x="${Math.min(X(iMin)+6,W-90)}" y="${Y(mn)+15}" font-weight="700">저점</text>
    <circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1])}" r="3.5" fill="${col}"/>
    <text class="ax" x="${P.l}" y="${base+16}">${t0}</text>
    <text class="ax" x="${W-P.r}" y="${base+16}" text-anchor="end">${t1}</text>`;
}
function renderTiles(){
  const night = PHASE==='night';
  document.getElementById('tiles').innerHTML = Object.keys(DATA).map(code=>{
    const d=DATA[code], px=night?d.pxN:d.px, chg=night?d.chgN:d.chg, u=night?d.upN:d.up;
    return `<div class="tile ${code===CUR?'on':''}" data-code="${code}" onclick="sel('${code}')">
      <div class="t-mkt">🇰🇷 KOSPI <span class="t-pill ${night?'night':''}">${night?'🌙 HL 24h':'●실시간'}</span></div>
      <div class="t-name">${d.name}</div>
      <div class="t-px">${px}</div>
      <div class="t-chg ${u?'up':'dn'}">${chg}</div></div>`;
  }).join('');
}
function sel(code){
  CUR=code; const d=DATA[code];
  renderTiles();
  document.getElementById('c-name').textContent=d.name;
  drawChart(d);
  document.getElementById('tp-cnt').textContent=d.cnt;
  document.getElementById('tp-val').textContent=d.consensus;
  document.getElementById('tp-up').textContent=d.upside;
  document.getElementById('tp-meta').textContent=d.meta;
  document.getElementById('tp-cur').style.width=d.cur+'%';
  document.getElementById('brk').innerHTML=d.brokers.map(b=>
    `<div class="brk"><span class="b-firm">${b.f}</span>`+
    `<span class="b-op" style="${b.o==='중립'?'color:var(--muted);background:var(--soft2)':''}">${b.o}</span>`+
    `<span class="b-tp">${b.tp}</span><span class="b-date">${b.d}</span></div>`).join('');
  document.getElementById('news').innerHTML=d.news.map(n=>
    `<a href="#"><div class="n-time">${n.t}</div><div class="n-title">${n.ti}</div>`+
    `<div class="n-sum">${n.su}</div><div class="n-src">${n.s}</div></a>`).join('');
  const m=d.m;
  document.getElementById('metrics').innerHTML=`
    <div class="m-blk"><div class="m-h">🔥 거래량<span class="v">${m.vol}</span></div>
      <div class="m-bar"><div class="f" style="width:${m.volPct}%"></div><div class="base"></div></div>
      <div class="m-cap" style="text-align:right">${m.volCap}</div></div>
    <div class="m-blk"><div class="m-h">📊 당일 레인지 위치<span class="v">${m.rng}</span></div>
      <div class="m-rng"><div class="dot" style="left:${parseInt(m.rng)}%"></div></div>
      <div class="m-cap sp"><span>${m.rngLo}</span><span>${m.rngHi}</span></div>
      <div class="m-cap" style="margin-top:3px">${m.rngCap}</div></div>`;
}
function setPhase(p){
  PHASE=p;
  document.getElementById('sw-day').classList.toggle('on',p==='day');
  document.getElementById('sw-night').classList.toggle('on',p==='night');
  const night=p==='night';
  document.getElementById('w-title').textContent = night?'📈 지금 이시각 추정가':'📈 코스피 주도주';
  document.getElementById('w-sub').textContent = night
    ? '하이퍼리퀴드 24h 무기한선물 환산 · 실제 체결가 아님'
    : '코스피 시총 상위 3 · 실시간';
  document.getElementById('c-date').textContent = night?'마감 후 24h':'7/18(토) 장중';
  const live=document.getElementById('c-live');
  live.textContent = night?'🌙 HL 24h 환산':'● 실측 1분봉';
  live.classList.toggle('night',night);
  sel(CUR);
}
