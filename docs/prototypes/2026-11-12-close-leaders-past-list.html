const LA=()=>`<div class="LA">`+byMonth({month:d=>`<div class="mon">${d.slice(0,4)}년 ${+d.slice(5,7)}월</div>`,row:r=>`<div class="day"><div class="dh"><b>${+r.d.slice(5,7)}월 ${+r.d.slice(8)}일</b><span>${DAYS[dow(r.d)]}요일</span><span class="kc ${cls(r.kc)}">코스피 ${fmt(r.kc)}</span></div>
 ${r.kospi?`<a href="${url(r.d,'kospi')}"><span class="tg">코스피 예측</span><span class="hl">${r.kospi.h}</span><span class="rs"><span class="${r.kospi.p}">${arrow(r.kospi.p)}</span> ${hitS(r.kospi.hit)}</span></a>`:''}
 ${r.close?`<a href="${url(r.d,'close')}"><span class="tg">코스피 마감</span><span class="hl">${r.close.h}</span><span class="rs mu">${r.close.price}</span></a>`:''}
 ${r.us?`<a href="${url(r.d,'us')}"><span class="tg">미국 시장</span><span class="hl">${r.us.h}</span><span class="rs"><span class="${r.us.p}">${arrow(r.us.p)}</span> ${hitS(r.us.hit)}</span></a>`:''}</div>`})+`</div>`;
// B
const LB=()=>`<div class="LB"><table><thead><tr><th>날짜</th><th>코스피 예측</th><th>코스피 마감</th><th>미국 예측</th></tr></thead><tbody>`+
 byMonth({month:d=>`<tr class="m"><td colspan="4">${d.slice(0,4)}년 ${+d.slice(5,7)}월</td></tr>`,row:r=>`<tr>
 <td class="d"><b>${r.d.slice(5).replace('-','/')}</b><span>${DAYS[dow(r.d)]}</span></td>
 <td>${r.kospi?`<a href="${url(r.d,'kospi')}"><span class="${r.kospi.p}">${arrow(r.kospi.p)}</span> ${hitS(r.kospi.hit)}</a>`:'—'}</td>
 <td>${r.close?`<a href="${url(r.d,'close')}"><span class="kc ${cls(r.kc)}">${fmt(r.kc)}</span><span class="kp">${r.close.price}</span></a>`:'—'}</td>
 <td>${r.us?`<a href="${url(r.d,'us')}"><span class="${r.us.p}">${arrow(r.us.p)}</span> ${hitS(r.us.hit)}</a>`:'—'}</td></tr>`})+`</tbody></table></div>`;
// C 달력
function LC(){const asc=rowsP.slice().reverse();const weeks=[];asc.forEach(r=>{const d=new Date(r.d+'T00:00:00Z');const mon=new Date(d-((dow(r.d)+6)%7)*864e5).toISOString().slice(0,10);
 let w=weeks.find(x=>x.k===mon);if(!w){w={k:mon,days:{}};weeks.push(w)}w.days[dow(r.d)]=r});
 let o=`<div class="LC"><div class="wk">${['월','화','수','목','금'].map(x=>`<div class="hd">${x}</div>`).join('')}</div>`;
 weeks.reverse().forEach(w=>{o+=`<div class="wk">`;for(let i=1;i<=5;i++){const r=w.days[i];if(!r){const dd=new Date(Date.parse(w.k+'T00:00:00Z')+(i-1)*864e5).toISOString().slice(5,10);o+=`<div class="c x" style="visibility:hidden"></div>`;continue}
  o+=`<a class="c ${cls(r.kc)==='mu'?'':cls(r.kc)}" href="${url(r.d,'close')}" data-d="${r.d}"><div class="dd">${+r.d.slice(5,7)}/${+r.d.slice(8)}</div><div class="v ${cls(r.kc)}">${fmt(r.kc)}</div>
  <div class="pr"><span>예 <span class="${r.kospi?.p}">${arrow(r.kospi?.p)}</span>${hitS(r.kospi?.hit)}</span><span>美 <span class="${r.us?.p}">${arrow(r.us?.p)}</span>${hitS(r.us?.hit)}</span></div></a>`}o+=`</div>`});
 const r0=rowsP[0];
 o+=`<div class="leg">칸 색 = 코스피 마감 등락 · 예 = 코스피 시초가 예측 · 美 = 미국 예측 · ✓ 적중 ✗ 빗나감</div>
 <div class="sel">${selHtml(r0)}</div></div>`;return o}
function selHtml(r){return `<b>${+r.d.slice(5,7)}/${+r.d.slice(8)} 브리핑</b><a href="${url(r.d,'kospi')}"><span>코스피 예측</span>${r.kospi?.h||'—'}</a><a href="${url(r.d,'close')}"><span>코스피 마감</span>${r.close?.h||'—'}</a><a href="${url(r.d,'us')}"><span>미국 시장</span>${r.us?.h||'—'}</a>`}
document.addEventListener('click',e=>{const c=e.target.closest('.LC a.c');if(!c)return;e.preventDefault();const r=rowsP.find(x=>x.d===c.dataset.d);const box=c.closest('.LC');box.querySelectorAll('.c.on').forEach(x=>x.classList.remove('on'));c.classList.add('on');box.querySelector('.sel').innerHTML=selHtml(r)});
function pairL(f){return `<div class="pair"><div class="frame pc"><div class="lab">PC</div>${f()}</div><div class="frame mo"><div class="lab">폰</div>${f()}</div></div>`}
document.getElementById('past').innerHTML=
 `<div class="opt">지금</div>`+pairL(L0)+
 `<div class="opt">A안 · 헤드라인 목록<small>날짜마다 카드 하나, 세 브리핑의 헤드라인을 그대로 보여주고 오른쪽에 예측 방향·채점</small></div>`+pairL(LA)+
 `<div class="opt">B안 · 성적 표<small>한 줄 한 날. 예측 방향과 맞았는지, 그날 코스피가 얼마나 움직였는지만</small></div>`+pairL(LB)+
 `<div class="opt">C안 · 달력<small>주 단위 5칸, 칸 색이 그날 코스피 등락. 칸을 누르면 아래에 그날 헤드라인 세 개(눌러 보세요)</small></div>`+pairL(LC);
</script></body></html>
