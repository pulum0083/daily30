<!DOCTYPE html>
<!-- 예측 게이지 트랙 컬러 채도 단계별 비교 시안 -->
<html lang="ko" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예측 게이지 — 채도 비교</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --canvas:#FFFFFF;--surface-soft:#F9FAFB;--surface-inset:#EEF1F5;
  --hairline:#E5E7EB;--ink:#13151A;--muted:#6B7280;
  --primary:#006EFF;--primary-bg:#E8F4FF;
  --up:#E03131;--up-bg:#FFE8E8;--dn:#2775ED;--dn-bg:#DBE8FE;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --s2:0 4px 8px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --r-sm:6px;--r-md:10px;--r-lg:16px;
}
html.dark{
  --canvas:#1C1D1F;--surface-soft:#242628;--surface-inset:#2A2B2D;
  --hairline:#3C3E40;--ink:#F3F5F7;--muted:#888B90;
  --primary:#3B8BFF;--primary-bg:rgba(59,139,255,.12);
  --up-bg:rgba(224,49,49,.14);--dn:#4A8FF5;--dn-bg:rgba(39,117,237,.14);
  --s1:0 1px 4px rgba(0,0,0,.35);--s2:0 4px 12px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;-webkit-font-smoothing:antialiased;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;word-break:keep-all;padding:32px 20px 80px;}
button{cursor:pointer;border:none;background:none;font:inherit;}

.page-head{max-width:760px;margin:0 auto 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
.page-head h1{font-size:20px;font-weight:800;letter-spacing:-0.4px;margin-bottom:8px;}
.page-head p{font-size:13px;color:var(--muted);line-height:1.7;max-width:560px;}
.theme-btn{flex-shrink:0;width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-inset);color:var(--muted);display:flex;align-items:center;justify-content:center;}
.icon-sun,.icon-moon{display:none;}
html.dark .icon-sun{display:block;}html.light .icon-moon{display:block;}

.cands{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px;}
.cand__head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.cand__tag{font-size:11px;font-weight:800;letter-spacing:0.06em;color:#fff;background:var(--ink);border-radius:5px;padding:3px 9px;flex-shrink:0;}
.cand__tag.cur{background:var(--muted);}
.cand__name{font-size:14px;font-weight:700;}
.cand__spec{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}

.prediction-card{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-md);padding:16px;}
.pred-top{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.pred-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--up-bg);color:var(--up);}
.pred-gauge__track{position:relative;height:14px;border-radius:999px;}
.pred-gauge__mid{position:absolute;left:50%;top:-5px;bottom:-5px;width:1.5px;background:var(--hairline);transform:translateX(-50%);}
.pred-gauge__band{position:absolute;top:0;bottom:0;border-radius:999px;left:58%;width:14%;}
.pred-gauge__needle{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:var(--up);box-shadow:0 0 0 2px var(--canvas);transform:translateX(-50%);left:65%;}
.pred-gauge__scale{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--muted);font-weight:600;}
.pred-readout{display:flex;align-items:baseline;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hairline);}
.pred-readout__big{font-size:30px;font-weight:800;color:var(--up);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1;}
.pred-readout__unit{font-size:14px;font-weight:700;color:var(--up);}
.pred-readout__strength{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
.strength-dots{display:flex;gap:3px;}
.strength-dots i{width:7px;height:7px;border-radius:50%;background:var(--hairline);}
.strength-dots i.on{background:var(--up);}

/* ── 채도 단계: 트랙 그라데이션 + 밴드 ── */
/* 0 현행 */
.sat0 .pred-gauge__track{background:linear-gradient(90deg,var(--dn-bg),var(--surface-inset) 50%,var(--up-bg));}
.sat0 .pred-gauge__band{background:rgba(224,49,49,.16);}
/* 1 약 */
.sat1 .pred-gauge__track{background:linear-gradient(90deg,rgba(39,117,237,.22),var(--surface-inset) 50%,rgba(224,49,49,.22));}
.sat1 .pred-gauge__band{background:rgba(224,49,49,.26);}
/* 2 중 */
.sat2 .pred-gauge__track{background:linear-gradient(90deg,rgba(39,117,237,.38),var(--surface-inset) 50%,rgba(224,49,49,.38));}
.sat2 .pred-gauge__band{background:rgba(224,49,49,.42);}
/* 3 강 */
.sat3 .pred-gauge__track{background:linear-gradient(90deg,rgba(39,117,237,.58),var(--surface-inset) 48%,var(--surface-inset) 52%,rgba(224,49,49,.58));}
.sat3 .pred-gauge__band{background:rgba(224,49,49,.62);}
</style>
</head>
<body>

<div class="page-head">
  <div>
    <h1>예측 게이지 — 트랙 채도 단계 비교</h1>
    <p>트랙 양끝(하락=파랑/상승=빨강) 그라데이션과 바늘 주변 음영 밴드의 채도를 4단계로. 바늘·숫자·뱃지는 동일해요.</p>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">
    <svg class="icon-sun" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icon-moon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>
</div>

<div class="cands" id="cands"></div>

<script>
const STEPS=[
  {cls:'sat0',tag:'현행',tagcls:'cur',name:'현재 — 매우 연함',spec:'양끝 ~.10 · 밴드 .16'},
  {cls:'sat1',tag:'1',tagcls:'',name:'약 — 살짝 또렷',spec:'양끝 .22 · 밴드 .26'},
  {cls:'sat2',tag:'2',tagcls:'',name:'중 — 또렷 (추천 후보)',spec:'양끝 .38 · 밴드 .42'},
  {cls:'sat3',tag:'3',tagcls:'',name:'강 — 선명',spec:'양끝 .58 · 밴드 .62'},
];
const cardHTML = `
  <div class="pred-top"><span class="pred-badge">▲ 상승 우위</span></div>
  <div class="pred-gauge__track">
    <div class="pred-gauge__mid"></div>
    <div class="pred-gauge__band"></div>
    <div class="pred-gauge__needle"></div>
  </div>
  <div class="pred-gauge__scale"><span>하락</span><span>중립 50</span><span>상승</span></div>
  <div class="pred-readout">
    <span class="pred-readout__big">65</span><span class="pred-readout__unit">% 상승</span>
    <span class="pred-readout__strength">신호 강도 <span class="strength-dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span> 강함</span>
  </div>`;
document.getElementById('cands').innerHTML = STEPS.map(s => `
  <div class="cand">
    <div class="cand__head"><span class="cand__tag ${s.tagcls}">${s.tag}</span><span class="cand__name">${s.name}</span><span class="cand__spec">${s.spec}</span></div>
    <div class="prediction-card ${s.cls}">${cardHTML}</div>
  </div>`).join('');
function toggleTheme(){const h=document.documentElement;h.classList.toggle('dark');h.classList.toggle('light');}
(function(){if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.remove('light');document.documentElement.classList.add('dark');}})();
</script>
</body>
</html>
