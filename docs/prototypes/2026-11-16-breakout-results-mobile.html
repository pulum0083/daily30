<!doctype html>
<!-- 미국 브리핑 '돌파 관찰 목록' 3번(돌파한 뒤 어떻게 됐나) 모바일 목록 시안 (2026-11-16) — 숫자는 11/16 발행본(S&P 500 11/13 종가) 그대로 -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>돌파 결과 목록 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--canvas:#fff;--soft:#F9FAFB;--inset:#EEF1F5;--hair:#E5E7EB;--ink:#13151A;--muted:#6B7280;--primary:#006EFF;
  --up:#F33942;--up-bg:#FFF5F7;--dn:#006EFF;--dn-bg:#EFF6FF;--gold:#B7791F;--gold-bg:#FEF3C7}
*{box-sizing:border-box}body{margin:0;background:#F3F4F6;font-family:Pretendard,system-ui,sans-serif;color:var(--ink);padding:24px 16px 80px;word-break:keep-all}
h1{font-size:22px;margin:0 0 6px}.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px;max-width:900px}
.grid{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.frame>.lab{font-size:13px;font-weight:800;margin-bottom:4px}.frame>.why{font-size:12px;color:var(--muted);margin:0 0 8px;max-width:343px;line-height:1.5}
.phone{width:343px;background:var(--canvas);border:1px solid var(--hair);border-radius:16px;padding:16px}
.up{color:var(--up)}.dn{color:var(--dn)}
/* 공통 — 제목(아이콘) */
.t{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.t::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}
.t small{font-size:12px;font-weight:500}
.gh{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;margin:4px 0 8px}
.gh .num{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.score{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.chip{border-radius:999px;padding:3px 9px;font-weight:700;font-size:12px}
.chip.win{background:var(--up-bg);color:var(--up)}.chip.lose{background:var(--dn-bg);color:var(--dn)}.chip.live{background:var(--inset)}
/* 공통 — 접힌 근거 */
.fold{margin-top:12px;border-top:1px solid var(--hair);padding-top:10px;font-size:12.5px;color:var(--muted)}
.fold summary{cursor:pointer;font-weight:600}
.fold .honest{margin-top:8px;background:var(--gold-bg);color:var(--gold);border-radius:10px;padding:10px 12px;line-height:1.6}
.fold p{line-height:1.7;margin:8px 0 0}
/* A 왼쪽 두 줄 */
.a li{list-style:none;padding:10px 0;border-bottom:1px solid var(--hair)}.a ul{margin:0;padding:0}.a li:last-child{border:0}
.a .l1{display:flex;align-items:baseline;gap:8px}.a .l1 b{font-size:14.5px}.a .l1 .v{font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
.a .l2{font-size:12px;color:var(--muted);margin-top:2px}.a .l2 .st{font-weight:700;color:var(--ink)}.a .l2 .st.stop{color:var(--dn)}
/* B 상태별 묶음 */
.b .grp{margin-top:10px}.b .gl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.b ul{margin:0;padding:0;background:var(--soft);border-radius:10px}.b li{list-style:none;display:flex;align-items:baseline;gap:6px;padding:9px 12px;border-bottom:1px solid var(--hair);font-size:14px}
.b li:last-child{border:0}.b li b{font-weight:700}.b li .v{font-weight:800;font-variant-numeric:tabular-nums}.b li small{font-size:12px;color:var(--muted)}
/* C 가운데 막대 */
.c ul{margin:0;padding:0}.c li{list-style:none;padding:8px 0;border-bottom:1px solid var(--hair)}.c li:last-child{border:0}
.c .nm{display:flex;align-items:baseline;gap:6px;font-size:13.5px}.c .nm b{font-weight:700}.c .nm small{font-size:11.5px;color:var(--muted)}
.c .bar{position:relative;height:18px;margin-top:4px}
.c .bar .ax{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--hair)}
.c .bar .f{position:absolute;top:4px;height:10px;border-radius:2px}.c .bar .f.up{background:#E86464}.c .bar .f.dn{background:#5D97F1}
.c .bar .f.ended{opacity:.45}
.c .bar .v{position:absolute;top:0;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;line-height:18px}
.c .axl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
/* D 2열 타일 */
.d .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d .tile{border:1px solid var(--hair);border-radius:10px;padding:10px 11px;background:var(--canvas)}
.d .tile.stop{background:var(--soft)}
.d .tile b{display:block;font-size:13.5px;line-height:1.3}
.d .tile .v{display:block;font-size:20px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.d .tile small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.d .tile .st{font-weight:700;color:var(--ink)}.d .tile.stop .st{color:var(--dn)}
.note{font-size:11.5px;color:var(--muted);margin:8px 0 0}
</style></head><body>
<h1>돌파 관찰 목록 — '돌파한 뒤 어떻게 됐나' 모바일 시안</h1>
<p class="lead">11/16 미국 브리핑 실데이터(11/13 종가, 7건)로 그렸어요. 네 시안 모두 제목 앞에 🔭 아이콘을 붙였고, 과거 성적·계산 방법은 맨 아래 <b>근거와 면책 고지</b> 하나로 접었어요(나스닥 체크·월봉 5개월선과 같은 방식). 지금 화면은 이름이 왼쪽 끝, 상태·%가 오른쪽 끝으로 갈라져 눈이 좌우로 오가요.</p>
<div class="grid" id="g"></div>
<script>
const T=[
 {n:'해즈브로',t:'HAS',f:'11/11',s:'live',d:2,p:-2.8},
 {n:'에스티 로더',t:'EL',f:'11/5',s:'stop',d:1,p:-7.1},
 {n:'CDW',t:'CDW',f:'11/4',s:'stop',d:2,p:-7.5},
 {n:'에퀴팩스',t:'EFX',f:'11/4',s:'live',d:7,p:-3.0},
 {n:'액센추어',t:'ACN',f:'10/30',s:'live',d:10,p:-3.4},
 {n:'젠 디지털',t:'GEN',f:'10/30',s:'live',d:10,p:6.2},
 {n:'메틀러 톨레도 인터내셔널',t:'MTD',f:'10/14',s:'live',d:22,p:8.4}];
const pct=p=>(p>0?'+':p<0?'−':'')+Math.abs(p).toFixed(1)+'%', cls=p=>p>0?'up':p<0?'dn':'';
const st=r=>r.s==='live'?`진행 중 ${r.d}거래일째`:`손절로 끝 · ${r.d}거래일`;
const head=`<div class="t">🔭 돌파 관찰 목록 <small>S&amp;P 500 · 11/13(금) 종가 기준</small></div>
<div class="gh"><span class="num">3</span>돌파한 뒤 어떻게 됐나</div>
<div class="score">최근 돌파 7번 <span class="chip win">이김 0</span><span class="chip lose">짐 2</span><span class="chip live">진행 중 5</span></div>`;
const fold=`<details class="fold"><summary>근거와 면책 고지</summary>
<div class="honest"><b>이 규칙의 과거 성적</b> — 2016년부터 S&amp;P 500 현재 구성 종목에서 돌파 때 샀다면, 2025년 한 해를 빼면 한 번 평균 +0.22R로 아무 날에나 산 경우(+0.16R)와 거의 같았어요. 이긴 비율은 31%예요. 종목을 고르는 힘이 확인된 목록이 아니에요.</div>
<p>고르는 조건 — 1·3·6달 상승률 상위 2%, 6달 저점에서 30% 넘게 오름 … (지금 '고르는 조건과 계산 방법' 문단 그대로)</p></details>`;
// 진행 중 먼저, 같은 상태 안에서는 돌파 최신 순 — 지금 순서(돌파일 최신 순)를 지키되 끝난 것을 뒤로
const live=T.filter(r=>r.s==='live'), done=T.filter(r=>r.s!=='live');
const A=`<ul class="a">${T.map(r=>`<li><div class="l1"><b>${r.n}</b><span class="v ${cls(r.p)}">${pct(r.p)}</span></div>
<div class="l2">${r.f} 돌파 · <span class="st ${r.s}">${st(r)}</span></div></li>`).join('')}</ul>`;
const grp=(lab,rows)=>`<div class="grp"><div class="gl">${lab}</div><ul>${rows.map(r=>`<li><b>${r.n}</b><span class="v ${cls(r.p)}">${pct(r.p)}</span><small>· ${r.f} 돌파${r.s==='live'?` · ${r.d}거래일째`:` · ${r.d}거래일 만에`}</small></li>`).join('')}</ul></div>`;
const B=grp(`진행 중 ${live.length} — 아직 손절선 위`,live)+grp(`손절로 끝 ${done.length}`,done);
const M=10, C=`<ul class="c">${[...live,...done].map(r=>{const w=Math.abs(r.p)/M*50, l=r.p<0?50-w:50;
 const vx=r.p<0?`right:calc(${50+w}% + 4px)`:`left:calc(${50+w}% + 4px)`;
 return `<li><div class="nm"><b>${r.n}</b><small>${r.f} 돌파 · ${st(r)}</small></div>
 <div class="bar"><i class="ax"></i><i class="f ${cls(r.p)} ${r.s!=='live'?'ended':''}" style="left:${l}%;width:${w}%"></i><span class="v ${cls(r.p)}" style="${vx}">${pct(r.p)}</span></div></li>`}).join('')}</ul>
<div class="axl"><span>−10%</span><span>돌파한 가격</span><span>+10%</span></div>`;
const D=`<div class="tiles">${[...live,...done].map(r=>`<div class="tile ${r.s}"><b>${r.n}</b><span class="v ${cls(r.p)}">${pct(r.p)}</span><small><span class="st">${r.s==='live'?'진행 중':'손절로 끝'}</span> · ${r.s==='live'?r.d+'거래일째':r.d+'거래일'}<br>${r.f} 돌파</small></div>`).join('')}</div>`;
const V=[
 ['A · 왼쪽 두 줄','이름 바로 옆에 %, 아래 줄에 돌파일·상태. 오른쪽 끝을 비워 눈이 한 줄로만 움직여요. 가장 적게 바뀌는 안.',A],
 ['B · 상태별 묶음','진행 중 / 손절로 끝을 먼저 나누고, 줄마다 이름 → % → 날짜를 이어 써요. 상태 글자가 줄마다 반복되지 않아요.',B],
 ['C · 가운데 막대','돌파한 가격을 가운데 0으로 두고 오르내린 만큼 막대. 숫자가 막대 끝에 붙어 화면 가운데로 모여요. 끝난 건 옅게.',C],
 ['D · 2열 타일','종목마다 작은 칸 하나, 큰 % 하나. 7개가 짧게 끝나고 한눈에 이김·짐이 보여요. 긴 이름은 두 줄로 접혀요.',D]];
document.getElementById('g').innerHTML=V.map(([lab,why,body])=>`<div class="frame"><div class="lab">${lab}</div><p class="why">${why}</p><div class="phone ${lab[0].toLowerCase()}">${head}${body}${lab[0]==='C'?'':'<p class="note">% = 돌파한 가격에서 지금(끝난 건 끝난 날)까지</p>'}${fold}</div></div>`).join('');
</script>
</body></html>
