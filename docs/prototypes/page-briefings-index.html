<!DOCTYPE html>
<html lang="ko" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double-Shot — /briefings (최신 브리핑 + 목록)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root {
  --canvas:#FFFFFF;--surface-soft:#F9FAFB;--surface-inset:#EEF1F5;
  --hairline:#E5E7EB;--ink:#13151A;--muted:#6B7280;
  --primary:#006EFF;--primary-bg:#E8F4FF;
  --up:#E03131;--up-bg:#FFE8E8;--dn:#2775ED;--dn-bg:#DBE8FE;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --s2:0 4px 8px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --r-sm:6px;--r-md:10px;--r-lg:16px;
  --gnb-bg:#16181A;--gnb-h:52px;
}
html.dark{
  --canvas:#1C1D1F;--surface-soft:#242628;--surface-inset:#2A2B2D;
  --hairline:#3C3E40;--ink:#F3F5F7;--muted:#888B90;
  --primary:#3B8BFF;--primary-bg:rgba(59,139,255,.12);
  --up-bg:rgba(224,49,49,.14);--dn:#4A8FF5;--dn-bg:rgba(39,117,237,.14);
  --s1:0 1px 4px rgba(0,0,0,.35);--s2:0 4px 12px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;-webkit-font-smoothing:antialiased;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;word-break:keep-all;}
a{color:inherit;text-decoration:none;}button{cursor:pointer;border:none;background:none;font:inherit;}

/* GNB */
.gnb{position:sticky;top:0;z-index:200;height:var(--gnb-h);background:var(--gnb-bg);border-bottom:1px solid rgba(255,255,255,.06);padding:0 32px;display:flex;align-items:center;}
.gnb__inner{width:100%;display:flex;align-items:center;justify-content:space-between;}
.gnb__left{display:flex;align-items:center;gap:0;}
.gnb__logo{display:flex;align-items:center;gap:8px;}
.gnb__logo-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#E03131,#FF6A6A);display:flex;align-items:center;justify-content:center;}
.gnb__logo-mark svg{width:18px;height:18px;}
.gnb__title{font-size:16px;font-weight:700;color:#fff;letter-spacing:-0.01em;}
.gnb__title span{color:var(--primary);}
.gnb__divider{width:1px;height:14px;background:rgba(255,255,255,.18);margin:0 10px;}
.gnb__link{font-size:12px;font-weight:600;color:rgba(255,255,255,.5);}
.gnb__link.active{color:#fff;}
.gnb__link:hover{color:rgba(255,255,255,.9);}
.gnb__chips-link{font-size:12px;font-weight:600;color:rgba(255,255,255,.5);padding-left:12px;margin-left:10px;border-left:1px solid rgba(255,255,255,.18);}
.gnb__chips-link:hover{color:rgba(255,255,255,.9);}
.gnb__meta{display:flex;align-items:center;gap:14px;}
.gnb__date{font-size:12px;color:rgba(255,255,255,.42);}
.gnb__theme-toggle{width:30px;height:30px;border-radius:var(--r-sm);background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;}
.gnb__theme-toggle:hover{background:rgba(255,255,255,.16);}
.icon-sun,.icon-moon{display:none;}
html.dark .icon-sun{display:block;}html.light .icon-moon{display:block;}

/* 최신 브리핑 영역 */
.briefing-section{background:var(--surface-soft);padding-top:8px;}
.briefing-topbar{max-width:1264px;margin:0 auto;padding:16px 32px 10px;display:flex;align-items:center;justify-content:space-between;}
.briefing-topbar__left{display:flex;align-items:center;gap:8px;}
.latest-chip{font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-bg);padding:3px 9px;border-radius:999px;letter-spacing:.04em;}
.briefing-topbar__title{font-size:13px;font-weight:600;color:var(--muted);}
.copy-url-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:5px 10px;transition:all .15s;}
.copy-url-btn:hover{color:var(--ink);border-color:var(--ink);}
.copy-url-btn svg{flex-shrink:0;}

/* iframe 래퍼 — 브리핑 자체 레이아웃 그대로 표시 */
.briefing-frame-wrap{width:100%;overflow:hidden;}
.briefing-frame-wrap iframe{width:100%;border:none;display:block;}

/* 목록 섹션 구분선 */
.list-divider{max-width:1264px;margin:0 auto;padding:0 32px;}
.list-divider__inner{display:flex;align-items:center;gap:12px;padding:16px 0 16px;border-top:2px solid var(--hairline);}
.list-divider__label{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;}
.list-divider__line{flex:1;height:1px;background:var(--hairline);}

/* List 영역 */
.list-section{max-width:1264px;margin:0 auto;padding:0 32px 72px;}

/* Today card */
.today-card{background:var(--canvas);border:1.5px solid rgba(0,110,255,.3);border-radius:var(--r-lg);box-shadow:var(--s2);margin-bottom:12px;overflow:hidden;}
.today-card__header{padding:14px 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hairline);}
.today-badge{font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-bg);padding:2px 8px;border-radius:999px;letter-spacing:0.04em;}
.today-date{font-size:15px;font-weight:700;letter-spacing:-0.3px;}
.today-day{font-size:13px;color:var(--muted);font-weight:500;}
.today-card__body{display:grid;grid-template-columns:1fr 1fr 1fr;}
.today-slot{padding:14px 20px;border-right:1px solid var(--hairline);display:flex;flex-direction:column;gap:5px;transition:background .15s;}
.today-slot:last-child{border-right:none;}
.today-slot.is-ready{cursor:pointer;}
.today-slot.is-ready:hover{background:var(--surface-soft);}
.today-slot.is-pending{opacity:.5;}
.today-slot__label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;}
.today-slot__title{font-size:14px;font-weight:700;letter-spacing:-0.2px;}
.today-slot__meta{display:flex;align-items:center;gap:6px;}
.today-slot__time{font-size:12px;color:var(--muted);}
.slot-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.slot-badge.up{background:var(--up-bg);color:var(--up);}
.slot-badge.dn{background:var(--dn-bg);color:var(--dn);}
.dot-pulse{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

/* Row list */
.month-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.06em;padding:18px 0 8px;text-transform:uppercase;}
.row{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--s1);display:grid;grid-template-columns:100px 1fr 1fr 1fr;align-items:center;min-height:56px;overflow:hidden;transition:box-shadow .15s;}
.row:hover{box-shadow:var(--s2);}
.row+.row{margin-top:4px;}
.row__date{padding:0 16px 0 18px;display:flex;flex-direction:column;gap:1px;}
.row__date-num{font-size:15px;font-weight:700;letter-spacing:-0.3px;}
.row__date-day{font-size:11px;color:var(--muted);font-weight:500;}
.row__slot{padding:12px 16px;border-left:1px solid var(--hairline);display:flex;flex-direction:column;gap:3px;min-height:56px;justify-content:center;transition:background .15s;}
.row__slot.is-ready{cursor:pointer;}
.row__slot.is-ready:hover{background:var(--surface-soft);}
.row__slot.is-empty{opacity:.35;}
.row__slot__label{font-size:11px;color:var(--muted);font-weight:500;}
.row__slot__bottom{display:flex;align-items:center;gap:6px;}
.row__slot__badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.row__slot__badge.up{background:var(--up-bg);color:var(--up);}
.row__slot__badge.dn{background:var(--dn-bg);color:var(--dn);}
.row__slot__badge.neutral{background:var(--surface-inset);color:var(--muted);}
.row__slot__time{font-size:11px;color:var(--muted);}
.row__slot__empty{font-size:11px;color:var(--muted);}

@media(max-width:768px){
  .gnb{padding:0 16px;}
  .briefing-topbar{padding:12px 16px 8px;}
  .list-divider{padding:0 16px;}
  .list-section{padding:0 16px 60px;}
  .today-card__body{grid-template-columns:1fr;}
  .today-slot{border-right:none;border-bottom:1px solid var(--hairline);}
  .today-slot:last-child{border-bottom:none;}
  .row{grid-template-columns:72px 1fr 1fr;}
  .row__slot:last-child{display:none;}
}
</style>
</head>
<body>

<nav class="gnb">
  <div class="gnb__inner">
    <div class="gnb__left">
      <a href="/" class="gnb__logo">
        <div class="gnb__logo-mark">
          <svg viewBox="0 0 32 32" fill="none"><rect x="7" y="15" width="5.5" height="9" rx="1.6" fill="white"/><line x1="9.75" y1="10" x2="9.75" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="9.75" y1="24" x2="9.75" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/><rect x="19.5" y="9" width="5.5" height="13" rx="1.6" fill="white"/><line x1="22.25" y1="5" x2="22.25" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="22.25" y1="22" x2="22.25" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="gnb__title">Double<span>-Shot</span></span>
      </a>
      <a href="#" class="gnb__chips-link">Chip-Board →</a>
    </div>
    <div class="gnb__meta">
      <span class="gnb__date" id="gnbDate"></span>
      <button class="gnb__theme-toggle" onclick="toggleTheme()">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
</nav>

<!-- 최신 브리핑 -->
<div class="briefing-section">

  <!-- 브리핑 본문 — iframe으로 기존 프로토타입 임베드 -->
  <div class="briefing-frame-wrap">
    <iframe
      id="briefingFrame"
      src="briefing-kospi.html?mode=latest&embed=1"
      scrolling="no"
      onload="resizeFrame(this)"
    ></iframe>
  </div>
</div>


<script>
function toggleTheme(){
  const h=document.documentElement;h.classList.toggle('dark');h.classList.toggle('light');
}
function resizeFrame(f){
  const measure=()=>{
    try{
      const doc=f.contentDocument;
      const wrapper=doc.querySelector('.layout-wrapper')||doc.body;
      const style=doc.defaultView.getComputedStyle(wrapper);
      const pb=parseFloat(style.paddingBottom)||0;
      const h=wrapper.offsetHeight - pb;
      if(h>0) f.style.height=h+'px';
    }catch(e){f.style.height='1200px';}
  };
  setTimeout(measure, 50);
  setTimeout(measure, 400);
}
function copyUrl(){
  navigator.clipboard.writeText('https://doubleshot.space/briefings/2026-05-29/kospi/').then(()=>{
    const btn=document.querySelector('.copy-url-btn');
    btn.textContent='✓ 복사됨';setTimeout(()=>{btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> URL 복사';},2000);
  });
}
const d=new Date();
document.getElementById('gnbDate').textContent=
  `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
</script>
</body>
</html>
