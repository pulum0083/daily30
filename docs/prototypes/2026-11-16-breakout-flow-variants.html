<!doctype html>
<!-- 미국 브리핑 '돌파 관찰 목록' 맨 위 1·2·3 단계 요약 다른 표현 시안 (2026-11-16) — 숫자는 11/13(0·0·7)·11/5(2·1·10) 실데이터 -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>돌파 단계 요약 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--canvas:#fff;--soft:#F9FAFB;--inset:#EEF1F5;--hair:#E5E7EB;--ink:#13151A;--muted:#6B7280;--primary:#006EFF;--primary-bg:#E8F4FF;
  --up:#F33942;--up-bg:#FFF5F7;--dn:#006EFF;--dn-bg:#EFF6FF}
*{box-sizing:border-box}body{margin:0;background:#F3F4F6;font-family:Pretendard,system-ui,sans-serif;color:var(--ink);padding:24px 16px 80px;word-break:keep-all}
h1{font-size:22px;margin:0 0 6px}.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px;max-width:900px}
h2{font-size:17px;margin:34px 0 4px;padding-top:18px;border-top:2px solid var(--hair)}.why{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:720px;line-height:1.55}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cap{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.phone{width:343px;background:var(--canvas);border:1px solid var(--hair);border-radius:16px;padding:16px}
.up{color:var(--up)}.dn{color:var(--dn)}
.t{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.t::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}.t small{font-size:12px;font-weight:500}
.intro{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0 0 12px}
.gh{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;margin:16px 0 8px}
.gh .num{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.gh small{font-size:12px;color:var(--muted);font-weight:500}
/* 아래 내용(간단히) */
.mini{border:1px solid var(--hair);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:13.5px;display:flex;gap:6px;align-items:baseline}
.mini small{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{border:1px solid var(--hair);border-radius:10px;padding:8px 10px}.tile.end{background:var(--soft)}
.tile b{display:block;font-size:12.5px;line-height:1.3}.tile .v{display:block;font-size:17px;font-weight:800}.tile small{font-size:11px;color:var(--muted)}
/* A 진행 표시줄 */
.step{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:4px 0 6px}
.step::before{content:'';position:absolute;left:16.6%;right:16.6%;top:17px;height:2px;background:var(--hair)}
.step .p{position:relative;text-align:center}
.step .c{width:36px;height:36px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;background:var(--canvas);border:2px solid var(--hair);color:var(--muted)}
.step .p.on .c{border-color:var(--ink);background:var(--ink);color:#fff}
.step .l{font-size:12px;font-weight:700;margin-top:5px}.step .p:not(.on) .l{color:var(--muted)}
.step .s{font-size:11px;color:var(--muted)}
.nonote{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:9px 12px;margin-top:12px}
/* B 문장 */
.say{font-size:14.5px;line-height:1.7;background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:4px}
.say b{font-variant-numeric:tabular-nums}
/* C 탭 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--inset);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{all:unset;cursor:pointer;text-align:center;border-radius:8px;padding:7px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button b{display:block;font-size:17px;color:inherit}
.seg button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button.zero b{opacity:.45}
.tabempty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0}
/* D 칩 한 줄 */
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 0 4px}
.chain .k{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;background:var(--inset)}
.chain .k b{font-size:14px}.chain .k.zero{background:transparent;border:1px dashed var(--hair);color:var(--muted)}
.chain .k.hot{background:var(--up-bg);color:var(--up)}
.chain .ar{color:var(--muted);font-size:12px}
.chain .sub{font-size:11.5px;color:var(--muted);margin-left:2px}
</style></head><body>
<h1>돌파 관찰 목록 — 맨 위 '1·2·3' 다른 표현</h1>
<p class="lead">지금은 큰 칸 셋에 숫자가 크게 들어가요. 그런데 0이 많은 날(11/13: 기다리는 중 0 · 오늘 돌파 0 · 결과 7)엔 큰 0 두 개 아래에 같은 말("없어요")이 다시 두 번 나와요. 네 안 모두 <b>11/13(0·0·7)</b>과 <b>11/5(2·1·10)</b> 두 날로 그렸어요. 아래 내용은 간단히 줄여 그렸어요.</p>
<div id="root"></div>
<script>
const DAYS={
 '11/13':{asof:'11/13(금)',wait:[],today:[],track:[['해즈브로','live',-2.8,2,'11/11'],['에퀴팩스','live',-3.0,7,'11/4'],['액센추어','live',-3.4,10,'10/30'],['젠 디지털','live',6.2,10,'10/30'],['메틀러 톨레도 인터내셔널','live',8.4,22,'10/14'],['에스티 로더','stop',-7.1,1,'11/5'],['CDW','stop',-7.5,2,'11/4']]},
 '11/5':{asof:'11/5(목)',wait:[['팩트셋 리서치 시스템즈',2.2],['크라운 캐슬',2.8]],today:[['에스티 로더',-3.92]],
   track:[['CDW','live',-4.7,1,'11/4'],['에퀴팩스','live',0,1,'11/4'],['액센추어','live',2.2,4,'10/30'],['젠 디지털','live',6.9,4,'10/30'],['메틀러 톨레도 인터내셔널','live',4.7,16,'10/14'],['스카이웍스 솔루션스','stop',-18.2,2,'11/2'],['가트너','stop',-7.6,12,'10/16'],['필립스 66','exit',6.0,44,'9/2'],['매러선 페트롤리엄','exit',14.1,46,'8/28'],['아이큐비아 홀딩스','exit',-3.0,50,'8/24']]}};
const pct=p=>(p>0?'+':p<0?'−':'')+Math.abs(p).toFixed(1)+'%',cls=p=>p>0?'up':p<0?'dn':'';
const ST={live:'진행 중',stop:'손절로 끝',exit:'추세 끝'};
function parts(d){const done=d.track.filter(r=>r[1]!=='live'),live=d.track.filter(r=>r[1]==='live');
 return {nw:d.wait.length,nt:d.today.length,nr:d.track.length,ndone:done.length,nlive:live.length,
  win:done.filter(r=>r[2]>0).length,lose:done.filter(r=>r[2]<=0).length};}
const head=d=>`<div class="t">🔭 돌파 관찰 목록 <small>S&amp;P 500 · ${d.asof} 종가 기준</small></div>`;
const waitBody=d=>d.wait.map(r=>`<div class="mini"><b>${r[0]}</b><small>· 넘을 선까지 ${r[1]}% 남음</small></div>`).join('');
const todayBody=d=>d.today.map(r=>`<div class="mini"><b>${r[0]}</b><span class="${cls(r[1])}">${pct(r[1])}</span><small>· 오늘 넘음</small></div>`).join('');
const trackBody=d=>{const o=[...d.track.filter(r=>r[1]==='live'),...d.track.filter(r=>r[1]!=='live')];
 return `<div class="tiles">${o.map(r=>`<div class="tile ${r[1]==='live'?'':'end'}"><b>${r[0]}</b><span class="v ${cls(r[2])}">${pct(r[2])}</span><small>${ST[r[1]]} · ${r[3]}거래일${r[1]==='live'?'째':''}</small></div>`).join('')}</div>`};
const gh=(n,t,s='')=>`<div class="gh"><span class="num">${n}</span>${t}${s?` <small>${s}</small>`:''}</div>`;
// 빈 묶음은 한 줄로 합친다(A·B·D 공통)
function nonEmpty(d,P){let h='';
 if(P.nw)h+=gh(1,'돌파를 기다리는 종목','남은 거리가 가까운 순')+waitBody(d);
 if(P.nt)h+=gh(2,'오늘 돌파한 종목')+todayBody(d);
 if(P.nr)h+=gh(3,'돌파한 뒤 어떻게 됐나',`이김 ${P.win} · 짐 ${P.lose} · 진행 중 ${P.nlive}`)+trackBody(d);
 return h;}
function emptyNote(P){const a=[];if(!P.nw)a.push('조건을 채운 종목');if(!P.nt)a.push('새로 넘은 종목');
 return a.length?`<div class="nonote">오늘은 ${a.join('도, ')}${a.length>1?'도':'은'} 없어요.</div>`:'';}
const V={
 A:{t:'A · 진행 표시줄',w:'1→2→3을 선으로 잇고 숫자를 동그라미 안에 넣어요. 0인 단계는 회색 테두리, 종목이 있는 단계는 검정으로 채워 어디에 종목이 있는지 바로 보여요. 빈 묶음은 아래에 한 줄로 합쳐요.',
  f:(d,P)=>`<div class="step">${[['기다리는 중',P.nw,'고점 아래'],['오늘 돌파',P.nt,'10일 최고가 넘음'],['그 뒤 결과',P.nr,`끝 ${P.ndone} · 진행 ${P.nlive}`]].map(([l,n,s])=>`<div class="p ${n?'on':''}"><div class="c">${n}</div><div class="l">${l}</div><div class="s">${s}</div></div>`).join('')}</div>${emptyNote(P)}${nonEmpty(d,P)}`},
 B:{t:'B · 한 문장 요약',w:'칸을 없애고 오늘 상황을 한 문장으로 말해요. 종목이 있는 묶음만 아래에 나와요. 가장 짧아요.',
  f:(d,P)=>{const a=P.nw?`<b>${P.nw}종목</b>이 고점 바로 아래에서 돌파를 기다리고 있고`:'돌파를 기다리는 종목은 없고';
   const b=P.nt?`, 오늘 <b>${P.nt}종목</b>이 새로 넘었어요.`:', 오늘 새로 넘은 종목도 없어요.';
   const c=` 최근 돌파 <b>${P.nr}번</b> 가운데 <b>${P.nlive}번</b>은 아직 진행 중이고, 끝난 ${P.ndone}번은 이김 ${P.win} · 짐 ${P.lose}예요.`;
   return `<div class="say">${a}${b}${c}</div>${nonEmpty(d,P)}`}},
 C:{t:'C · 탭 세 개',w:'숫자를 탭 이름에 넣고 한 번에 한 묶음만 보여요. 처음엔 종목이 있는 첫 탭이 열려요. 섹션 길이가 가장 짧지만, 다른 탭을 눌러야 보이는 내용이 생겨요.',
  f:(d,P,id)=>{const tabs=[['기다리는 중',P.nw,waitBody(d)||'<div class="tabempty">조건을 채운 종목이 없어요.</div>'],
   ['오늘 돌파',P.nt,todayBody(d)||'<div class="tabempty">오늘 새로 넘은 종목은 없어요.</div>'],
   ['그 뒤 결과',P.nr,(P.nr?`<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">이김 ${P.win} · 짐 ${P.lose} · 진행 중 ${P.nlive}</div>`:'')+(trackBody(d))]];
   const first=Math.max(0,tabs.findIndex(t=>t[1]>0));
   return `<div class="seg" data-id="${id}">${tabs.map((t,i)=>`<button class="${i===first?'on':''} ${t[1]?'':'zero'}" data-i="${i}">${t[0]}<b>${t[1]}</b></button>`).join('')}</div>
   ${tabs.map((t,i)=>`<div class="pane" data-id="${id}" data-i="${i}" ${i===first?'':'hidden'}>${t[2]}</div>`).join('')}`}},
 D:{t:'D · 한 줄 칩',w:'세 단계를 작은 칩 한 줄로 줄여요. 0인 칩은 점선으로 흐리게, 오늘 돌파가 있으면 빨갛게 강조해요. 빈 묶음은 숨겨요(칩의 0이 이미 말해 줘요).',
  f:(d,P)=>`<div class="chain"><span class="k ${P.nw?'':'zero'}">기다리는 중 <b>${P.nw}</b></span><span class="ar">→</span><span class="k ${P.nt?'hot':'zero'}">오늘 돌파 <b>${P.nt}</b></span><span class="ar">→</span><span class="k ${P.nr?'':'zero'}">그 뒤 결과 <b>${P.nr}</b></span></div>${nonEmpty(d,P)}`}};
let html='';let k=0;
for(const [key,v] of Object.entries(V)){
 html+=`<h2>${v.t}</h2><p class="why">${v.w}</p><div class="row">`;
 for(const day of ['11/13','11/5']){const d=DAYS[day],P=parts(d);
  html+=`<div><div class="cap">${day} — 기다리는 중 ${P.nw} · 오늘 돌파 ${P.nt} · 결과 ${P.nr}</div><div class="phone">${head(d)}<p class="intro">크게 오른 뒤 쉬고 있는 종목이 최근 고점을 다시 넘는지 지켜보는 목록이에요. 넘은 뒤 어떻게 됐는지도 빠짐없이 남겨요.</p>${v.f(d,P,'s'+(k++))}</div></div>`;}
 html+='</div>';}
document.getElementById('root').innerHTML=html;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const id=b.parentNode.dataset.id;
 b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll(`.pane[data-id="${id}"]`).forEach(p=>p.hidden=p.dataset.i!==b.dataset.i);});
</script>
</body></html>
