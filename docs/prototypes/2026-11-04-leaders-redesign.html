<!-- 종목 홈(/stocks/) '코스피 주도주' 다시 구성 시안 — 실제 홈 위에 덮어씌운다. 아래 막대로 지금/A/B/C와 장중/마감 후를 바꿔 본다.
     미리보기: scratchpad의 proto_proxy.py가 /stocks/ 응답 끝에 PROTO 구간을 끼우고 /api는 실제 사이트로 넘긴다.
     요청(2026-11-04): 펼치기 안의 레인지·수급·목표주가·외국계 시각을 없애고, 어제와 비교한 수치를 밖으로, 뉴스만 3~5개 꺼낸다.
     공통 규칙
       - 장중 비교는 /api/intraday?vs=intraday의 leaders(같은 확정 분의 오늘·어제 등락, §49). 큰 가격은 실시간이라 비교 줄에 그 분을 적는다.
       - 어제와의 차이(%p)는 빨강·파랑을 쓰지 않는다 — 오르내림과 헷갈린다(§49 2026-10-28).
       - '마감 후 예시'는 11/3 공식 종가(오늘)와 11/2 공식 종가(어제)로 만든 실제 값이다.
     A안: 지금 타일 모양 그대로 + 타일 안에 어제 비교 두 줄 + 고른 종목 뉴스 3개
     B안: 세 종목을 한 줄씩(특이 신호와 같은 목록 모양) + 세 종목 섞은 뉴스 7개(썸네일 포함, 2026-11-04 사용자 선택)
     C안: 오늘·어제 짝 막대(대결판 아래 카드와 같은 그림 언어) + 종목 탭 뉴스 3개 -->

/* C안 — 짝 막대 */
#pv-leaders .c-line{font-size:13px;color:#334155;margin:-4px 0 10px;line-height:1.5}

<div class="pv-bar" id="pv-bar">
  <button data-v="0">지금</button><button data-v="A">A</button><button data-v="B" class="on">B</button><button data-v="C">C</button>
  <span class="sep"></span><button data-s="live" class="on">장중</button><button data-s="close">마감 후 예시</button>
</div>
<script>
(function(){
  var NAMES={'005930':'삼성전자','000660':'SK하이닉스','005380':'현대차'}, CODES=['005930','000660','005380'];
  var ENT={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ENT[c];}); }
  function safeUrl(u){ return (typeof u==='string'&&/^https?:\/\//i.test(u))?u:''; }
  function f2(n){ return n==null?'—':(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2); }
  function cls(n){ return n>0?'up':n<0?'dn':'zr'; }
  function won(n){ return n==null?'—':Number(n).toLocaleString('ko-KR'); }
  function newsTime(n){
    var d=new Date(n.published); if(isNaN(d)) return esc(n.time||'');
    var k=new Date(d.getTime()+9*3600e3), now=new Date(Date.now()+9*3600e3);
    var hm=String(k.getUTCHours()).padStart(2,'0')+':'+String(k.getUTCMinutes()).padStart(2,'0');
    return k.toISOString().slice(0,10)===now.toISOString().slice(0,10)?hm:(k.getUTCMonth()+1)+'/'+k.getUTCDate()+' '+hm;
  }

  var ST={v:'B',s:'live',sel:'005930',live:null,vs:null,news:null};
  // 마감 후 예시 — 11/3 공식 종가 등락(오늘)과 11/2 공식 종가 등락(어제). kr_official_closes로 확인한 값.
  var CLOSE={head:'11/3(화) 마감 · 11/2(월) 종가 등락과 비교',k:'어제',
    rows:{'005930':{px:219500,t:-4.15,y:1.78},'000660':{px:1398000,t:-5.03,y:3.81},'005380':{px:277500,t:-3.31,y:1.77}}};

  function data(){
    var rows={};
    if(ST.s==='close'){
      CODES.forEach(function(c){ var r=CLOSE.rows[c]; rows[c]={px:r.px,pc:r.t,t:r.t,y:r.y,diff:Math.round((r.t-r.y)*100)/100}; });
      return {rows:rows,head:CLOSE.head,tLbl:'오늘 종가',yLbl:'어제 종가',vsK:'어제 종가',cap:'어제보다'};
    }
    var vs=ST.vs&&ST.vs.status==='ok'?ST.vs:null, byL={};
    (vs?vs.leaders:[]).forEach(function(l){ byL[l.code]=l; });
    var px={}; ((ST.live&&ST.live.prices)||[]).forEach(function(p){ px[p.code]=p; });
    CODES.forEach(function(c){ var l=byL[c]||{}, p=px[c]||{};
      rows[c]={px:p.price,pc:p.changePct,t:l.t,y:l.y,diff:l.diff}; });
    var rel=vs?vs.prev.rel:'어제', tm=vs?vs.time:'';
    return {rows:rows,head:vs?rel+'('+vs.prev.label.replace(/\(.\)/,'')+') '+tm+'와 비교':'어제 같은 시각과 비교',
      tLbl:'오늘 '+tm,yLbl:rel+' '+tm,vsK:rel+' '+tm,cap:rel+'보다'};
  }

  function newsItems(code,n){
    var s=ST.news&&ST.news.stocks||{}, list=(s[code]||[]).slice();
    return list.slice(0,n);
  }
  function mixedNews(n){
    var s=ST.news&&ST.news.stocks||{}, lists=CODES.map(function(c){ return (s[c]||[]).map(function(x){ return Object.assign({code:c},x); }); });
    var out=[], seen={};
    // 종목마다 가장 최신 1건을 먼저 넣고, 나머지는 발행 시각 순으로 채운다 — 한 종목 뉴스로만 차지 않게.
    lists.forEach(function(l){ if(l[0]){ out.push(l[0]); seen[l[0].url]=1; } });
    var rest=[].concat.apply([],lists).filter(function(x){ return !seen[x.url]; })
      .sort(function(a,b){ return (Date.parse(b.published)||0)-(Date.parse(a.published)||0); });
    out=out.concat(rest).slice(0,n);
    return out.sort(function(a,b){ return (Date.parse(b.published)||0)-(Date.parse(a.published)||0); });
  }
  function newsRow(x,opt){
    var href=safeUrl(x.url), th=safeUrl(x.thumb);
    return '<a class="pv-n" '+(href?'href="'+esc(href)+'" target="_blank" rel="noopener noreferrer"':'')+'><div class="bd">'+
      '<div class="tt">'+(opt&&opt.chip?'<span class="pv-chip">'+esc(NAMES[x.code])+'</span>':'')+esc(x.title)+'</div>'+
      (opt&&opt.sum&&x.summary?'<div class="sm">'+esc(x.summary)+'</div>':'')+
      '<div class="mt">'+newsTime(x)+' · '+esc(x.source)+'</div></div>'+
      (th&&opt&&opt.img?'<img src="'+esc(th)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</a>';
  }

  function head(d){ return '<div class="pv-h"><span class="pv-t">📈 코스피 주도주</span><span class="pv-sub">'+esc(d.head)+'</span></div>'; }

  function renderA(d){
    var tiles=CODES.map(function(c){ var r=d.rows[c];
      var vs=r.y!=null&&r.diff!=null
        ? '<div class="a-vs"><span class="k">'+esc(d.vsK)+'</span><span class="v num '+cls(r.y)+'">'+f2(r.y)+'%</span>'+
          '<span class="k">'+esc(d.cap)+'</span><span class="v num gd">'+f2(r.diff)+'%p</span></div>' : '';
      return '<button type="button" class="a-tile'+(ST.sel===c?' on':'')+'" data-c="'+c+'"><div class="a-nm">'+NAMES[c]+'</div>'+
        '<div class="a-px num">'+won(r.px)+'</div><div class="a-pc num '+cls(r.pc)+'">'+f2(r.pc)+'%</div>'+vs+'</button>'; }).join('');
    var news=newsItems(ST.sel,3).map(function(x){ return newsRow(x,{img:true}); }).join('');
    return head(d)+'<div class="a-tiles">'+tiles+'</div>'+
      '<div class="pv-nh">📰 '+NAMES[ST.sel]+' 뉴스<small>최신순 · 위 종목을 누르면 바뀌어요</small></div>'+news;
  }

  function renderB(d){
    var max=Math.max.apply(null,CODES.map(function(c){ return Math.abs(d.rows[c].diff||0); }))||1;
    var rows=CODES.map(function(c){ var r=d.rows[c];
      var w=r.diff==null?0:Math.abs(r.diff)/max*50;
      var bar='<span class="b-trk"><i style="'+(r.diff>=0?'left:50%':'right:50%')+';width:'+w.toFixed(1)+'%"></i></span>';
      return '<div class="b-row"><div class="b-nm"><b>'+NAMES[c]+'</b><small class="num">'+won(r.px)+' <span class="'+cls(r.pc)+'">'+f2(r.pc)+'%</span></small></div>'+
        '<div class="b-c t num '+cls(r.t)+'">'+f2(r.t)+'%</div>'+
        '<div class="b-c y num '+cls(r.y)+'" data-k="'+esc(d.yLbl)+'">'+f2(r.y)+'%</div>'+
        '<div class="b-d">'+bar+'<em class="num gd">'+f2(r.diff)+'%p</em></div></div>'; }).join('');
    var news=mixedNews(7).map(function(x){ return newsRow(x,{chip:true,img:true}); }).join('');
    return head(d)+'<div class="b-list"><div class="b-row b-hd"><span>종목 · 지금</span><span style="text-align:right">'+esc(d.tLbl)+'</span><span style="text-align:right">'+esc(d.yLbl)+'</span><span style="text-align:right">차이</span></div>'+rows+'</div>'+
      '<div class="pv-nh">📰 주도주 뉴스<small>세 종목 · 최신순</small></div>'+news;
  }

  function renderC(d){
    var vals=[]; CODES.forEach(function(c){ vals.push(Math.abs(d.rows[c].t||0),Math.abs(d.rows[c].y||0)); });
    var max=Math.max.apply(null,vals)||1;
    function bar(v,kind){
      if(v==null) return '<div class="c-b"></div>';
      // 값 글자는 0선 건너편에 둔다 — 막대 끝에 붙이면 긴 막대에서 글자가 칸 밖(종목명 쪽)으로 넘친다.
      var w=Math.abs(v)/max*48, pos=v>=0?'left:50%':'right:50%', lab=v>=0?'right:calc(50% + 5px)':'left:calc(50% + 5px)';
      return '<div class="c-b"><i class="'+(kind==='y'?'y':cls(v))+'" style="'+pos+';width:'+w.toFixed(1)+'%"></i><span class="num '+(kind==='y'?'zr':cls(v))+'" style="'+lab+'">'+f2(v)+'%</span></div>';
    }
    var up=CODES.filter(function(c){ return d.rows[c].diff>0; }).length, n=CODES.filter(function(c){ return d.rows[c].diff!=null; }).length;
    var line=n===3?(up===3?'세 종목 모두 '+d.cap.replace('보다','')+'보다 높아요.':up===0?'세 종목 모두 '+d.cap.replace('보다','')+'보다 낮아요.':'세 종목 중 '+up+'종목이 '+d.cap.replace('보다','')+'보다 높아요.'):'';
    var rows=CODES.map(function(c){ var r=d.rows[c];
      return '<div class="c-row"><div class="c-nm"><b>'+NAMES[c]+'</b><small class="num">'+won(r.px)+'</small></div>'+
        '<div class="c-bars">'+bar(r.t,'t')+bar(r.y,'y')+'</div>'+
        '<div class="c-d num gd">'+f2(r.diff)+'%p<small>'+esc(d.cap)+'</small></div></div>'; }).join('');
    var tabs=CODES.map(function(c){ return '<button type="button" class="'+(ST.sel===c?'on':'')+'" data-c="'+c+'">'+NAMES[c]+'</button>'; }).join('');
    var news=newsItems(ST.sel,3).map(function(x){ return newsRow(x,{sum:true}); }).join('');
    return head(d)+(line?'<div class="c-line">'+esc(line)+'</div>':'')+
      '<div class="c-key"><span><i style="background:#E86464"></i>'+esc(d.tLbl)+'</span><span><i style="background:#CBD5E1"></i>'+esc(d.yLbl)+'</span></div>'+rows+
      '<div class="c-tabs"><b>📰 관련 뉴스</b>'+tabs+'</div>'+news;
  }

  function render(){
    var orig=document.getElementById('us-linked-widget'); if(!orig) return;
    var pv=document.getElementById('pv-leaders');
    if(!pv){ pv=document.createElement('section'); pv.id='pv-leaders'; orig.after(pv);
      pv.addEventListener('click',function(e){ var b=e.target.closest('[data-c]'); if(b){ ST.sel=b.getAttribute('data-c'); render(); } }); }
    pv.style.order=getComputedStyle(orig).order;
    if(ST.v==='0'){ orig.style.display=''; pv.style.display='none'; return; }
    orig.style.display='none'; pv.style.display='';
    var d=data();
    pv.innerHTML=ST.v==='A'?renderA(d):ST.v==='B'?renderB(d):renderC(d);
  }

  document.getElementById('pv-bar').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.v){ ST.v=b.dataset.v; [].forEach.call(this.querySelectorAll('[data-v]'),function(x){ x.classList.toggle('on',x===b); }); }
    if(b.dataset.s){ ST.s=b.dataset.s; [].forEach.call(this.querySelectorAll('[data-s]'),function(x){ x.classList.toggle('on',x===b); }); }
    render();
  });

  function j(u){ return fetch(u,{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); }
  function load(){
    Promise.all([j('/api/stocks-live?codes='+CODES.join(',')),j('/api/intraday?vs=intraday'),j('/data/stock-news.json')]).then(function(r){
      ST.live=r[0]; ST.vs=r[1]; ST.news=r[2]; render();
    });
  }
  load(); setInterval(load,60000);
  // 홈 스크립트가 블록 순서를 정한 뒤에도 같은 자리에 있게 몇 번 다시 맞춘다.
  [300,1500,4000].forEach(function(t){ setTimeout(render,t); });
})();
</script>
