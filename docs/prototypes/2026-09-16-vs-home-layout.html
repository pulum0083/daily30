/* ═══════ 헬퍼 ═══════ */
const sp=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2);
const cl=v=>v>0?'up':v<0?'dn':'mu';
const nf=n=>Math.abs(n).toLocaleString('en-US');
const sgn=n=>(n>0?'+':n<0?'−':'')+nf(n);   // 부호를 잃지 않는 정수 표기
const eok=v=>(v>0?'+':'−')+(Math.abs(v)>=10000?(Math.abs(v)/10000).toFixed(2)+'조':nf(v)+'억');
const B=(t,c)=>`<span class="badge ${c}">${t}</span>`;
const card=(t,sub,body,isNew)=>`<div class="card${isNew?' new':''}">
  <div class="chead"><span class="ctitle">${t}</span><span class="csub">${sub}</span></div>${body}</div>`;
const blk=(tag,html)=>`<div class="blk"><span class="blk__tag ${tag[0]}">${tag[1]}</span>${html}</div>`;

function fcChart(prev,today,zero=true){
  const M=Math.max(Math.abs(prev),Math.abs(today))||1;
  const bar=(v,isT)=>{
    const h=Math.max(Math.abs(v)/M*(zero?20:40),2);
    const st=zero?(v>=0?`bottom:50%;height:${h}px`:`top:50%;height:${h}px`):`bottom:0;height:${h}px`;
    const c=!zero?'mag':(v>=0?'up':'down');
    return `<div class="fcbar ${isT?'':'prev'}"><span class="fcbar__rect ${c}" style="${st}"></span></div>`;};
  return `<div class="fc"><div class="fc__bars ${zero?'zero':'base'}">${bar(prev,0)}${bar(today,1)}</div>
    <div class="fc__axis"><span>어제</span><span class="t">오늘</span></div></div>`;}
function cellRow(lbl,badge,amt,unit,cls2,sub,chart){
  return `<div class="cell"><div><div class="cell__lbl">${lbl}${badge}</div>
    <div class="cell__amt num ${cls2}">${amt}${unit?`<span class="u">${unit}</span>`:''}</div>
    <div class="cell__sub">${sub}</div></div>${chart}</div>`;}

function flowCard(d){
  const M=Math.max(...d.inst.flatMap(r=>[Math.abs(r[1]),Math.abs(r[2])]));
  const pairs=d.inst.map(([nm,t,y])=>{
    const bar=(v,isT)=>{const h=Math.max(Math.abs(v)/M*36,2);
      return `<div class="fcbar ${isT?'':'prev'}"><span class="fcbar__rect ${v>=0?'up':'down'}"
        style="${v>=0?`bottom:50%;height:${h}px`:`top:50%;height:${h}px`}"></span></div>`;};
    return `<div><div class="pair__bars">${bar(y,0)}${bar(t,1)}</div>
      <div class="pair__val ${cl(t)}">${eok(t)}</div>
      <div class="pair__prev">어제 ${eok(y)}</div><div class="pair__lbl">${nm}</div></div>`;}).join('');
  const c=(k)=>cellRow(k,B(Math.sign(d.supply[k])!==Math.sign(d.supplyPrev[k])?'돌아섬':'같은 방향',
      Math.sign(d.supply[k])!==Math.sign(d.supplyPrev[k])?(d.supply[k]>0?'up':'dn'):'same'),
      eok(d.supply[k]).replace(/[+−]/,''),'',cl(d.supply[k]),
      `어제 <b class="${cl(d.supplyPrev[k])}">${eok(d.supplyPrev[k])}</b>`,fcChart(d.supplyPrev[k],d.supply[k]));
  return card('누가 사는가','새 축 · 수급 심층',`
    <div class="cbody"><div class="cells">${c('개인')}${c('외국인')}${c('기관')}</div></div>
    <div class="cbody">
      <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:10px">

      <div class="pairs">${pairs}</div>
      <p class="mini">기관 세부 6칸은 <b>지금도 이미 받아오는 값</b>이에요 — 시간대별 표 11칸 중 쓰지 않고 버리던 <code>v[3]~v[8]</code>입니다.</p>
    </div>`,true);}

<div class="tw" style="margin:10px 0 6px"><table>

<tr><td class="nm">누가 · 수급</td><td class="up" style="text-align:center">●</td><td class="up" style="text-align:center">●</td><td class="up" style="text-align:center">●</td><td class="up" style="text-align:center">●</td><td class="up" style="text-align:center">●</td></tr>
</tbody></table></div>
<p class="mini">● 됨 · ◐ 저장된 공식 종가에 의존 · ○ 안 됨</p>
<ul style="margin-top:12px">
<li><b>LIVE 바와 대결판이 겹칩니다</b> — 코스피 등락률과 수급이 두 곳에 나와요. 장중엔 시차로 0.1%p, 마감 후엔 애프터장 포함 여부로 29~80억 어긋납니다. 그래서 대결판은 <b>오늘 값을 다시 적지 않고 "어제 이 시각"만</b> 말하도록 바꿨어요.</li>
<li><b>장 전은 전날 마감 후와 같은 데이터예요</b> — 라벨만 "오늘"에서 "어제"로 바뀝니다. 카드를 새로 만들 필요가 없어요.</li>
<li><b>15:30~15:40은 공백입니다</b> — 정규장은 끝났는데 확정 수급 행(15:31~15:40)이 아직 안 나와요. 그 10분은 "집계 중"으로 둡니다.</li>
<li><b>규칙을 교차 검증했어요</b> — 15:40 행으로 뽑은 9/15 수급(외국인 −15,711억 · 기관 −9,040억 · 개인 +8,320억)이 그날 마감 브리핑이 발행한 숫자와 정확히 일치했고, 오늘 코스피 마감 +1.37%(6,717.97)도 브리핑과 같았습니다.</li>
<li><b>주도주 가격은 이미 맞습니다</b> — §48 수정 덕분에 홈 타일 가격이 정규장 확정 종가와 0원 차이로 일치해요(삼성전자 253,500 · SK하이닉스 1,759,000 · 현대차 362,000). 어긋나는 건 수급뿐입니다.</li>
<li><b>1분봉은 약 7거래일까지만 옵니다</b>(9/16 기준 9/8까지, 9/4는 0건). 주말의 "지난주" 비교는 <code>data/kr_official_closes.json</code>에 의존하고, 진폭은 고·저가가 필요해 주말엔 아예 안 됩니다.</li>
</ul>`;
const order=['pre','open','close','night','weekend'];
const tabs=document.getElementById('tabs');
tabs.innerHTML=order.map(k=>`<button class="tab" data-k="${k}" aria-selected="false">${SLOTS[k].label}<span class="tm">${SLOTS[k].time}</span></button>`).join('');
function render(k){
  const s=SLOTS[k];
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.k===k)));
  document.getElementById('slotnote').innerHTML=`<div class="k">비교 대상 — ${s.cmp}</div><div class="v">${s.why}</div>`;
  document.getElementById('stack').innerHTML=s.build();
  document.getElementById('note').innerHTML=NOTE;
}
tabs.addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t) render(t.dataset.k);});
(function(){const n=new Date(Date.now()+(new Date().getTimezoneOffset()+540)*60000);
 const d=n.getDay(),hm=n.getHours()*100+n.getMinutes();
 render((d===0||d===6)?'weekend':hm>=730&&hm<900?'pre':hm>=900&&hm<1530?'open':hm>=1540&&hm<1700?'close':'night');})();
</script>
