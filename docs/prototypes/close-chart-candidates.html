<!DOCTYPE html>
<!-- 코스피 마감 스냅샷 차트 히어로 리디자인 후보 비교 (저점/고점 라벨·해상도 개선) -->
<html lang="ko" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마감 차트 — 후보 비교</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --canvas:#FFFFFF;--surface-soft:#F9FAFB;--surface-inset:#EEF1F5;
  --hairline:#E5E7EB;--ink:#13151A;--muted:#6B7280;
  --primary:#006EFF;--primary-bg:#E8F4FF;
  --up:#E03131;--up-bg:#FFE8E8;--dn:#2775ED;--dn-bg:#DBE8FE;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --s2:0 4px 8px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --r-sm:6px;--r-md:10px;--r-lg:16px;
}
html.dark{
  --canvas:#1C1D1F;--surface-soft:#242628;--surface-inset:#2A2B2D;
  --hairline:#3C3E40;--ink:#F3F5F7;--muted:#888B90;
  --primary:#3B8BFF;--primary-bg:rgba(59,139,255,.12);
  --up-bg:rgba(224,49,49,.16);--dn:#4A8FF5;--dn-bg:rgba(39,117,237,.16);
  --s1:0 1px 4px rgba(0,0,0,.35);--s2:0 4px 12px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;-webkit-font-smoothing:antialiased;}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;word-break:keep-all;padding:32px 20px 80px;}
button{cursor:pointer;border:none;background:none;font:inherit;}

.page-head{max-width:760px;margin:0 auto 26px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
.page-head h1{font-size:21px;font-weight:800;letter-spacing:-0.4px;margin-bottom:8px;}
.page-head p{font-size:13px;color:var(--muted);line-height:1.7;}
.theme-btn{flex-shrink:0;width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-inset);color:var(--muted);display:flex;align-items:center;justify-content:center;}
.icon-sun,.icon-moon{display:none;}
html.dark .icon-sun{display:block;}html.light .icon-moon{display:block;}

.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px;}
.cand{}
.cand__head{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;}
.cand__tag{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:5px;padding:2px 8px;flex-shrink:0;}
.cand__tag.cur{background:var(--muted);}
.cand__name{font-size:15px;font-weight:700;}
.cand__concept{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px;}

/* 마감 스냅샷 카드 (실제 브리핑 맥락 재현) */
.section-card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--s1);overflow:hidden;}
.section-card__head{display:flex;align-items:baseline;justify-content:space-between;padding:13px 18px 0;}
.section-card__title{font-size:14px;font-weight:700;}
.section-card__sub{font-size:11px;color:var(--muted);}
.a-hero{padding:14px 18px 16px;}
.a-hero__lead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;}
.a-hero__idx-name{font-size:12px;color:var(--muted);font-weight:600;}
.a-hero__idx-val{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums;}
.a-hero__idx-chg{font-size:14px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums;}
.a-hero__idx-chg.up{color:var(--up);}
.a-hero__vol{text-align:right;}
.a-hero__vol-label{font-size:11px;color:var(--muted);font-weight:600;}
.a-hero__vol-val{font-size:16px;font-weight:800;letter-spacing:-.4px;margin-top:2px;font-variant-numeric:tabular-nums;}
.intraday-axis{display:flex;justify-content:space-between;padding:4px 0 0;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}
.a-sub-row{display:flex;gap:10px;margin-top:12px;}
.a-sub-cell{flex:1;display:flex;align-items:center;gap:7px;background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-md);padding:8px 12px;}
.a-sub-cell__name{font-size:11px;color:var(--muted);font-weight:700;}
.a-sub-cell__val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
.a-sub-cell__chg{font-size:12px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums;}
.a-sub-cell__chg.down{color:var(--dn);}

/* 차트 영역 (SVG + 오버레이 마커) */
.chart-area{position:relative;width:100%;}
.chart-svg{display:block;width:100%;height:100%;position:absolute;inset:0;}
.chart-canvas-wrap{position:relative;width:100%;height:104px;}
.chart-canvas-wrap canvas{display:block;width:100%;height:100%;}

.mk-dot{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--canvas);}
.mk-dot.hi{background:var(--up);}
.mk-dot.lo{background:var(--dn);}
.mk-dot.last{background:var(--up);}

/* B: 핀 라벨 */
.mk-pin{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#fff;line-height:1.3;}
.mk-pin.hi{background:var(--up);}
.mk-pin.lo{background:var(--dn);}
.mk-pin__tail{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid;}
.mk-pin.hi .mk-pin__tail{border-top-color:var(--up);}
.mk-pin.lo .mk-pin__tail{border-top-color:var(--dn);}

/* C: 헤일로 라벨 (박스 없음) */
.mk-halo{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;
  text-shadow:0 0 3px var(--canvas),0 0 3px var(--canvas),0 0 5px var(--canvas),0 0 2px var(--canvas);}
.mk-halo.hi{color:var(--up);}
.mk-halo.lo{color:var(--dn);}

/* D: 외부 스탯 */
.chart-stats{display:flex;gap:0;margin-top:10px;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;}
.chart-stat{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--hairline);}
.chart-stat:last-child{border-right:none;}
.chart-stat__lbl{font-size:10px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:4px;}
.chart-stat__dot{width:6px;height:6px;border-radius:50%;}
.chart-stat__val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.chart-stat.hi .chart-stat__val{color:var(--up);}
.chart-stat.lo .chart-stat__val{color:var(--dn);}
</style>
</head>
<body>

<div class="page-head">
  <div>
    <h1>마감 스냅샷 차트 — 후보</h1>
    <p>음영(그라데이션 영역)은 유지하고, 저점·고점 라벨의 어색한 흰 박스와 캔버스 저해상도를 개선했어요. A는 현행(canvas), B~D는 모두 <b>SVG 벡터 + DOM 텍스트</b>라 어떤 화면에서도 선명해요. 라벨 처리 방식만 달라요.</p>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">
    <svg class="icon-sun" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icon-moon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>
</div>

<div class="wrap" id="wrap"></div>

<script>
function toggleTheme(){const h=document.documentElement;h.classList.toggle('dark');h.classList.toggle('light');renderAll();}

const INTRADAY=[8050.2,8065.4,8074.5,7874.51,7862.3,7845.1,7806.06,7820.4,7835.7,7850.2,7862.8,7878.3,7892.1,7901.5,7915.2,7928.7,7940.1,7952.3,7965.8,7978.2,7989.5,8001.3,8012.7,8024.1,8035.6,8047.2,8058.9,8070.3,8081.7,8093.2,8104.6,8115.9,8127.3,8138.7,8150.1,8161.4,8172.8,8184.2,8195.5,8206.9,8218.3,8222.1,8225.8,8228.7,8226.3,8224.1,8221.8,8219.5,8220.3,8222.7,8221.0,8223.5,8226.8,8228.7,8224.5,8220.3,8228.7,8225.1,8221.8,8218.4,8222.7,8228.7,8225.3,8221.9,8218.5,8222.1,8225.6,8229.0,8225.8,8222.6,8219.3,8223.1,8228.7,8225.4,8222.0,8228.7];
const HIGH_IDX=INTRADAY.indexOf(Math.max(...INTRADAY));
const LOW_IDX=INTRADAY.indexOf(Math.min(...INTRADAY));
const fmt=v=>v.toLocaleString('ko-KR',{minimumFractionDigits:2});

const candidates=[
  {tag:'현행',cls:'cur',name:'canvas + 흰 박스 (현행)',concept:'캔버스 래스터. 라벨 뒤 반투명 흰 박스가 곡선 위에 패치처럼 얹혀 어색하고, 한글 텍스트가 덜 또렷해요.',type:'canvas'},
  {tag:'B',name:'핀 라벨 (SVG)',concept:'솔리드 컬러 핀을 곡선 바깥 여백에 띄우고 꼬리로 지점을 가리켜요. 흰 박스 없이 또렷, 값이 데이터를 안 가려요.',type:'pin'},
  {tag:'C',name:'헤일로 라벨 (SVG)',concept:'박스 대신 캔버스색 글로우만 줘 곡선 위에 값을 직접 얹어요. 가장 미니멀, 라벨이 점 바로 옆에 붙어요.',type:'halo'},
  {tag:'D',name:'깨끗한 차트 + 외부 스탯 (SVG)',concept:'차트엔 점만, 저점·고점·종가 값은 아래 스탯으로 분리해요. 겹침 0, 차트가 가장 깔끔해요.',type:'stats'}
];

// SVG 경로 생성 (현행과 동일한 midpoint bezier 스무딩)
function buildPaths(data,W,H,pad){
  const min=Math.min(...data)-10,max=Math.max(...data)+10,range=max-min,n=data.length;
  const X=i=>pad.l+(i/(n-1))*(W-pad.l-pad.r);
  const Y=v=>pad.t+(1-(v-min)/range)*(H-pad.t-pad.b);
  let line=`M ${X(0)} ${Y(data[0])}`;
  for(let i=1;i<n;i++){const cx=(X(i-1)+X(i))/2;line+=` C ${cx.toFixed(1)} ${Y(data[i-1]).toFixed(1)} ${cx.toFixed(1)} ${Y(data[i]).toFixed(1)} ${X(i).toFixed(1)} ${Y(data[i]).toFixed(1)}`;}
  const area=line+` L ${X(n-1).toFixed(1)} ${H-pad.b} L ${X(0).toFixed(1)} ${H-pad.b} Z`;
  return {line,area,X,Y,W,H};
}

function leadHTML(){return `
  <div class="a-hero__lead">
    <div class="a-hero__idx">
      <div class="a-hero__idx-name">KOSPI 종가</div>
      <div class="a-hero__idx-val">8,228.70</div>
      <div class="a-hero__idx-chg up">▲ 181.19 (+2.25%)</div>
    </div>
    <div class="a-hero__vol">
      <div class="a-hero__vol-label">코스피 거래대금</div>
      <div class="a-hero__vol-val">55조 8,408억</div>
    </div>
  </div>`;}
function axisHTML(){return `<div class="intraday-axis"><span>09:00</span><span>10:30</span><span>12:00</span><span>13:30</span><span>15:20</span></div>`;}
function subHTML(){return `
  <div class="a-sub-row">
    <div class="a-sub-cell"><span class="a-sub-cell__name">KOSDAQ</span><span class="a-sub-cell__val">1,133.13</span><span class="a-sub-cell__chg down">▼ -3.36%</span></div>
    <div class="a-sub-cell"><span class="a-sub-cell__name">원/달러</span><span class="a-sub-cell__val">1,501.70</span><span class="a-sub-cell__chg down">▼ -0.38%</span></div>
  </div>`;}

function svgChartHTML(type){
  const W=1000;
  const H = type==='stats' ? 120 : 150;
  const pad = type==='stats' ? {t:14,b:12,l:8,r:8} : {t:42,b:14,l:8,r:8};
  const P=buildPaths(INTRADAY,W,H,pad);
  const isDark=document.documentElement.classList.contains('dark');
  const dn=isDark?'#4A8FF5':'#2775ED';
  const base=INTRADAY[0];
  // 마커 위치 (left %, top px = viewBox y 와 1:1)
  const pos=idx=>({left:(P.X(idx)/W*100),top:P.Y(INTRADAY[idx])});
  const hi=pos(HIGH_IDX),lo=pos(LOW_IDX),last=pos(INTRADAY.length-1);

  // 가장자리에서 라벨이 잘리지 않도록 안쪽 정렬
  const align=L=> L<16?'translateX(-10px)' : L>84?'translateX(calc(-100% + 10px))' : 'translateX(-50%)';
  const centered=L=> L>=16 && L<=84;
  let overlay='';
  if(type==='pin'){
    overlay=`
      <div class="mk-dot hi" style="left:${hi.left}%;top:${hi.top}px"></div>
      <div class="mk-pin hi" style="left:${hi.left}%;top:${hi.top-26}px;transform:${align(hi.left)}">▲ 고점 ${fmt(INTRADAY[HIGH_IDX])}${centered(hi.left)?'<span class="mk-pin__tail"></span>':''}</div>
      <div class="mk-dot lo" style="left:${lo.left}%;top:${lo.top}px"></div>
      <div class="mk-pin lo" style="left:${lo.left}%;top:${lo.top-26}px;transform:${align(lo.left)}">▼ 저점 ${fmt(INTRADAY[LOW_IDX])}${centered(lo.left)?'<span class="mk-pin__tail"></span>':''}</div>`;
  }else if(type==='halo'){
    overlay=`
      <div class="mk-dot hi" style="left:${hi.left}%;top:${hi.top}px"></div>
      <div class="mk-halo hi" style="left:${hi.left}%;top:${hi.top-22}px;transform:${align(hi.left)}">▲ 고점 ${fmt(INTRADAY[HIGH_IDX])}</div>
      <div class="mk-dot lo" style="left:${lo.left}%;top:${lo.top}px"></div>
      <div class="mk-halo lo" style="left:${lo.left}%;top:${lo.top-22}px;transform:${align(lo.left)}">▼ 저점 ${fmt(INTRADAY[LOW_IDX])}</div>`;
  }else if(type==='stats'){
    overlay=`
      <div class="mk-dot hi" style="left:${hi.left}%;top:${hi.top}px"></div>
      <div class="mk-dot lo" style="left:${lo.left}%;top:${lo.top}px"></div>
      <div class="mk-dot last" style="left:${last.left}%;top:${last.top}px"></div>`;
  }

  return `
    <div class="chart-area" style="height:${H}px">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad-${type}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${dn}" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="${dn}" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <line x1="${pad.l}" y1="${P.Y(base)}" x2="${W-pad.r}" y2="${P.Y(base)}" stroke="rgba(120,120,120,.28)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
        <path d="${P.area}" fill="url(#grad-${type})"/>
        <path d="${P.line}" fill="none" stroke="${dn}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
      ${overlay}
    </div>
    ${axisHTML()}
    ${type==='stats'?`
    <div class="chart-stats">
      <div class="chart-stat lo"><span class="chart-stat__lbl"><span class="chart-stat__dot" style="background:${dn}"></span>저점</span><span class="chart-stat__val">${fmt(INTRADAY[LOW_IDX])}</span></div>
      <div class="chart-stat hi"><span class="chart-stat__lbl"><span class="chart-stat__dot" style="background:var(--up)"></span>고점</span><span class="chart-stat__val">${fmt(INTRADAY[HIGH_IDX])}</span></div>
      <div class="chart-stat"><span class="chart-stat__lbl"><span class="chart-stat__dot" style="background:var(--up)"></span>종가</span><span class="chart-stat__val">${fmt(INTRADAY[INTRADAY.length-1])}</span></div>
    </div>`:''}`;
}

function drawCanvas(canvas){
  const dpr=window.devicePixelRatio||1,W=canvas.parentElement.offsetWidth||600,H=104;
  canvas.style.width=W+'px';canvas.style.height=H+'px';canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const min=Math.min(...INTRADAY)-10,max=Math.max(...INTRADAY)+10,range=max-min;
  const pad={t:24,b:6,l:8,r:8},pW=W-pad.l-pad.r,pH=H-pad.t-pad.b;
  const xf=i=>pad.l+(i/(INTRADAY.length-1))*pW,yf=v=>pad.t+(1-(v-min)/range)*pH;
  ctx.beginPath();ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(100,100,100,.2)';ctx.lineWidth=1;ctx.moveTo(pad.l,yf(INTRADAY[0]));ctx.lineTo(W-pad.r,yf(INTRADAY[0]));ctx.stroke();ctx.setLineDash([]);
  const color='#2775ED';
  const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);grad.addColorStop(0,'rgba(39,117,237,.18)');grad.addColorStop(1,'rgba(39,117,237,.02)');
  ctx.beginPath();ctx.moveTo(xf(0),yf(INTRADAY[0]));for(let i=1;i<INTRADAY.length;i++){const cx=(xf(i-1)+xf(i))/2;ctx.bezierCurveTo(cx,yf(INTRADAY[i-1]),cx,yf(INTRADAY[i]),xf(i),yf(INTRADAY[i]));}ctx.lineTo(xf(INTRADAY.length-1),H-pad.b);ctx.lineTo(xf(0),H-pad.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(xf(0),yf(INTRADAY[0]));for(let i=1;i<INTRADAY.length;i++){const cx=(xf(i-1)+xf(i))/2;ctx.bezierCurveTo(cx,yf(INTRADAY[i-1]),cx,yf(INTRADAY[i]),xf(i),yf(INTRADAY[i]));}ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.stroke();
  function drawLabel(x,y,text,c){ctx.font=`bold 11px 'Pretendard Variable',sans-serif`;const tw=ctx.measureText(text).width,th=13,p=4;let lx=Math.min(Math.max(x,tw/2+p+2),W-tw/2-p-2);const ly=y-10;const isDark=document.documentElement.classList.contains('dark');ctx.fillStyle=isDark?'rgba(36,38,40,0.92)':'rgba(255,255,255,0.92)';ctx.beginPath();ctx.roundRect(lx-tw/2-p,ly-th,tw+p*2,th+2,4);ctx.fill();ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(text,lx,ly);}
  ctx.beginPath();ctx.arc(xf(HIGH_IDX),yf(INTRADAY[HIGH_IDX]),4,0,Math.PI*2);ctx.fillStyle='#E03131';ctx.fill();
  drawLabel(xf(HIGH_IDX),yf(INTRADAY[HIGH_IDX]),`▲ 고점 ${fmt(INTRADAY[HIGH_IDX])}`,'#E03131');
  ctx.beginPath();ctx.arc(xf(LOW_IDX),yf(INTRADAY[LOW_IDX]),4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  drawLabel(xf(LOW_IDX),yf(INTRADAY[LOW_IDX]),`▼ 저점 ${fmt(INTRADAY[LOW_IDX])}`,color);
}

function renderAll(){
  document.getElementById('wrap').innerHTML=candidates.map(c=>`
    <div class="cand">
      <div class="cand__head"><span class="cand__tag ${c.cls||''}">${c.tag}</span><span class="cand__name">${c.name}</span></div>
      <div class="cand__concept">${c.concept}</div>
      <div class="section-card">
        <div class="section-card__head"><span class="section-card__title">마감 스냅샷</span><span class="section-card__sub">09:00 ~ 15:30 정규장</span></div>
        <div class="a-hero">
          ${leadHTML()}
          ${c.type==='canvas'?`<div class="chart-canvas-wrap"><canvas></canvas></div>${axisHTML()}`:svgChartHTML(c.type)}
          ${subHTML()}
        </div>
      </div>
    </div>`).join('');
  document.querySelectorAll('canvas').forEach(drawCanvas);
}

(function(){if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.remove('light');document.documentElement.classList.add('dark');}})();
renderAll();
window.addEventListener('resize',()=>document.querySelectorAll('canvas').forEach(drawCanvas));
</script>
</body>
</html>
