<!-- '어제랑 비교해서' 종목 시그널 프로토타입 v3 — NC AI Design System 토큰·컴포넌트 기준 (실측: 2026-09-11 금 · 09-14 월) -->
<!DOCTYPE html><html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>종목 시그널 — 어제랑 비교해서 (시안 v3)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ============================================================
   ① Foundation 토큰 — ncai-design-system preview/src/styles.css :root 값 그대로
   ============================================================ */
:root{
  color-scheme:light;
  --color-canvas:#ffffff;--color-surface-soft:#f9fafb;--color-surface-elevated:#ffffff;--color-surface-elevated-hover:var(--color-surface-soft);
  --color-surface-inset:#eef1f5;--color-hairline:#e5e7eb;--color-control-track:#e5e7eb;
  --color-ink:#13151a;--color-body-muted:#6b7280;--color-on-primary:#ffffff;--color-disabled:#c4c9cb;
  --color-primary:#006eff;--color-primary-hover:#005bed;
  --color-semantic-success:#32be81;--color-semantic-success-bg:#ecfdf5;--color-semantic-success-text:#059669;
  --color-semantic-error:#f33942;--color-semantic-error-bg:#fff5f7;--color-semantic-error-text:#f33942;
  --color-semantic-warning:#ffae00;--color-semantic-warning-bg:#fff9e3;--color-semantic-warning-text:#eb8e02;
  --color-semantic-info:var(--color-primary);--color-semantic-info-bg:#eff6ff;
  --color-semantic-neutral:var(--color-body-muted);--color-semantic-neutral-bg:#f3f4f6;
  --font-text:"Pretendard Variable","Pretendard",system-ui,-apple-system,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Monaco,monospace;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;
  --radius-6:6px;--radius-10:10px;--radius-12:12px;--radius-16:16px;--radius-20:20px;--radius-pill:9999px;--radius-full:50%;
  --spacing-4:4px;--spacing-8:8px;--spacing-12:12px;--spacing-16:16px;--spacing-20:20px;--spacing-24:24px;--spacing-32:32px;--spacing-40:40px;--spacing-120:120px;
  --stack-section-eyebrow-gap:var(--spacing-8);--stack-card-eyebrow-gap:var(--spacing-8);--stack-card-title-gap:var(--spacing-8);
  --shadow-level-1:0 4px 12px rgba(15,23,42,.08);--shadow-level-2:0 8px 24px rgba(15,23,42,.12);
  --motion-fast:120ms;--motion-normal:200ms;--motion-slow:320ms;
  --ease-standard:ease;--ease-out-expo:cubic-bezier(.22,1,.36,1);
  /* 프로젝트 확장 — 한국 시장 관례(상승 빨강·하락 파랑)를 시멘틱 토큰에 연결. 새 색을 만들지 않는다 */
  --market-up-text:var(--color-semantic-error-text);--market-up-fill:var(--color-semantic-error);
  --market-dn-text:var(--color-semantic-info);--market-dn-fill:var(--color-semantic-info);
  --segment-indicator:var(--color-canvas);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --color-canvas:#111212;--color-surface-soft:#18191b;--color-surface-elevated:#27282d;
  --color-surface-inset:#2b2c30;--color-hairline:#25272b;--color-control-track:#3e3e41;
  --color-ink:#e5e5e5;--color-body-muted:#959799;--color-disabled:#424347;
  --color-primary:#1c82ff;--color-primary-hover:#3791ff;
  --color-semantic-neutral:#c7c9cb;--color-semantic-neutral-bg:rgba(149,151,153,.15);--color-semantic-info-bg:rgba(0,110,255,.15);
  --color-semantic-success:#34d399;--color-semantic-success-bg:rgba(5,150,105,.15);--color-semantic-success-text:var(--color-semantic-success);
  --color-semantic-error:#f74b53;--color-semantic-error-bg:rgba(247,75,83,.15);--color-semantic-error-text:var(--color-semantic-error);
  --color-semantic-warning:#fe9f19;--color-semantic-warning-bg:rgba(254,159,25,.15);--color-semantic-warning-text:var(--color-semantic-warning);
  --shadow-level-1:0 4px 12px rgba(0,0,0,.30);--shadow-level-2:0 8px 24px rgba(0,0,0,.45);
  --segment-indicator:#3e3e41;
}

/* ② 텍스트 스타일 클래스 (쓰는 역할만) */
.display-28sb{font-family:var(--font-text);font-weight:var(--fw-semibold);font-size:28px;line-height:1.20;letter-spacing:-.6px}
.title-24sb{font-family:var(--font-text);font-weight:var(--fw-semibold);font-size:24px;line-height:1.22;letter-spacing:-.5px}
.title-22sb{font-family:var(--font-text);font-weight:var(--fw-semibold);font-size:22px;line-height:1.25;letter-spacing:-.4px}
.title-18sb{font-family:var(--font-text);font-weight:var(--fw-semibold);font-size:18px;line-height:1.35;letter-spacing:-.1px}
.title-16sb{font-family:var(--font-text);font-weight:var(--fw-semibold);font-size:16px;line-height:1.40;letter-spacing:-.05px}
.body-16r,body{font-family:var(--font-text);font-weight:var(--fw-regular);font-size:16px;line-height:1.50;letter-spacing:-.05px}
.body-14r,.data-table{font-family:var(--font-text);font-weight:var(--fw-regular);font-size:14px;line-height:1.50;letter-spacing:0}
.caption-13r,.badge,.data-table thead tr th{font-family:var(--font-text);font-weight:var(--fw-regular);font-size:13px;line-height:1.40;letter-spacing:0}
.label-14m,.toggle-item{font-family:var(--font-text);font-weight:var(--fw-medium);font-size:14px;line-height:1.2;letter-spacing:-.16px}
.eyebrow-13m,.eyebrow{font-family:var(--font-text);font-weight:var(--fw-medium);font-size:13px;line-height:1.30;letter-spacing:.4px}

/* ③ 전역 베이스 */
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:where(button,a,input,[tabindex]):focus-visible{outline:2px solid var(--color-primary);outline-offset:3px}
body{margin:0;background:var(--color-surface-soft);color:var(--color-ink);word-break:keep-all;overflow-wrap:break-word}
p,h1,h2,h3{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--color-body-muted)}
.up{color:var(--market-up-text)}.dn{color:var(--market-dn-text)}
.icon{width:16px;height:16px;flex:none;vertical-align:-3px}

/* ============================================================
   레이아웃
   ============================================================ */
.page{max-width:1040px;margin:0 auto;padding:var(--spacing-40) var(--spacing-24) var(--spacing-120)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--spacing-16);margin-bottom:var(--spacing-24)}
.page-head .eyebrow{color:var(--color-body-muted);margin-bottom:var(--stack-card-eyebrow-gap)}
.page-head h1{margin-bottom:var(--stack-card-title-gap)}
.proto-note{display:inline-flex;align-items:center;gap:var(--spacing-8);margin-top:var(--spacing-12)}

/* Toggle Group (세그먼트) — 트랙 surface-inset · radius-10 · padding 4 · 인디케이터 칩 */
.segment-wrap{overflow-x:auto;margin:0 calc(-1 * var(--spacing-4));padding:var(--spacing-4);scrollbar-width:none}
.segment-wrap::-webkit-scrollbar{display:none}
.toggle-group{position:relative;display:inline-flex;align-items:center;gap:var(--spacing-4);padding:var(--spacing-4);border:1px solid transparent;background:var(--color-surface-inset);border-radius:var(--radius-10)}
.toggle-item{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--radius-6);color:var(--color-body-muted);white-space:nowrap;transition:color var(--motion-normal) var(--ease-out-expo)}
.toggle-item:hover{color:var(--color-ink)}
.toggle-item[aria-selected="true"]{color:var(--color-ink)}
.toggle-indicator{position:absolute;top:var(--spacing-4);left:0;height:36px;border-radius:var(--radius-6);background:var(--segment-indicator);box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform var(--motion-slow) var(--ease-out-expo),width var(--motion-slow) var(--ease-out-expo)}
html[data-theme="dark"] .toggle-item{color:#c7c7cc}
html[data-theme="dark"] .toggle-item:hover,html[data-theme="dark"] .toggle-item[aria-selected="true"]{color:#ffffff}
.slot-caption{margin:var(--spacing-8) 0 var(--spacing-40);display:flex;align-items:center;gap:var(--spacing-8)}

/* 섹션 히어로 — 카드 밖에 둔다(카드 안 display-* 금지 규칙) */
.hero{margin-bottom:var(--spacing-24)}
.hero .eyebrow{display:flex;align-items:center;gap:var(--spacing-8);color:var(--color-body-muted);margin-bottom:var(--stack-section-eyebrow-gap)}
.hero h2{margin-bottom:var(--spacing-8)}
.section + .section{margin-top:var(--spacing-40)}

/* 카드 — canvas · hairline · radius-16, 다크는 보더 대신 레이어 */
.card{background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-16);padding:var(--spacing-32)}
html[data-theme="dark"] .card{border-color:transparent;background:var(--color-canvas)}
html[data-theme="dark"] body{background:var(--color-surface-soft)}
.card + .card{margin-top:var(--spacing-16)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-12);flex-wrap:wrap;margin-bottom:var(--spacing-24)}
.card-head .t{display:flex;align-items:center;gap:var(--spacing-8)}
.card-head .sub{margin-top:var(--spacing-4)}
.separator{height:1px;background:var(--color-hairline);margin:var(--spacing-32) 0}

/* 차트 */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:var(--spacing-8) var(--spacing-16);margin-bottom:var(--spacing-12)}
.legend .k{display:inline-flex;align-items:center;gap:var(--spacing-8)}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid currentColor}
.legend i.dash{border-top-style:dashed}
.legend .r{margin-left:auto}
.chart svg{display:block}

/* 스탯 — 카드 안에서 hairline 세로 구분(중첩 보더 카드 대신) */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:var(--spacing-24);border-top:1px solid var(--color-hairline)}
.stat{padding:var(--spacing-20) var(--spacing-24) 0}
.stat:first-child{padding-left:0}
.stat + .stat{border-left:1px solid var(--color-hairline)}
.stat-h{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-8);margin-bottom:var(--spacing-12)}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--spacing-8)}
.stat-row + .stat-row{margin-top:var(--spacing-4)}
.stat-diff{margin-top:var(--spacing-8)}

/* Badge — pill · 24px · caption-13r weight 500 */
.badge{display:inline-flex;align-items:center;gap:var(--spacing-4);height:24px;padding:0 var(--spacing-8);border-radius:var(--radius-pill);white-space:nowrap;font-weight:var(--fw-medium)}
.badge-success{background:var(--color-semantic-success-bg);color:var(--color-semantic-success-text)}
.badge-warning{background:var(--color-semantic-warning-bg);color:var(--color-semantic-warning-text)}
.badge-error{background:var(--color-semantic-error-bg);color:var(--color-semantic-error-text)}
.badge-info{background:var(--color-semantic-info-bg);color:var(--color-semantic-info)}
.badge-neutral{background:var(--color-semantic-neutral-bg);color:var(--color-semantic-neutral)}
.badge-ink{background:var(--color-ink);color:var(--color-canvas)}
.badge-dot{width:6px;height:6px;border-radius:var(--radius-full);background:currentColor;flex:none}
.badges{display:flex;flex-wrap:wrap;gap:var(--spacing-8)}

/* Table — table-wrap radius-12 · th surface-soft · 행 hairline */
.table-wrap{width:100%;border:1px solid var(--color-hairline);border-radius:var(--radius-12);overflow:hidden;overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.data-table thead tr th{padding:var(--spacing-12) var(--spacing-16);background:var(--color-surface-soft);text-align:right;color:var(--color-body-muted);font-weight:var(--fw-medium);border-bottom:1px solid var(--color-hairline);white-space:nowrap}
.data-table tbody tr td{padding:var(--spacing-12) var(--spacing-16);background:var(--color-canvas);color:var(--color-ink);border-bottom:1px solid var(--color-hairline);text-align:right;white-space:nowrap}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table th:first-child,.data-table td:first-child{text-align:left}
.data-table .sub{display:block;color:var(--color-body-muted)}
.data-table .strong{font-weight:var(--fw-semibold)}

/* 이슈 목록 */
.lbl{margin-bottom:var(--spacing-8)}
.issues{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--spacing-24);margin-top:var(--spacing-24)}
.issue-list{list-style:none;margin:0;padding:0}
.issue-list li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--spacing-12);padding:var(--spacing-12) 0;border-top:1px solid var(--color-hairline)}
.issue-list li:first-child{border-top:0;padding-top:var(--spacing-4)}
.issue-list mark{background:var(--color-semantic-error-bg);color:var(--color-semantic-error-text);border-radius:4px;padding:0 2px}

/* 수급 발산 막대 — 0축이 카드 한가운데. 값은 막대 쪽 바깥 칸에 둔다 */
.flow{max-width:760px;margin:0 auto}
.flow-axis{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;margin-bottom:var(--spacing-12)}
.flow-axis .mid{display:flex;justify-content:space-between}
.flow-group + .flow-group{margin-top:var(--spacing-20)}
.flow-name{text-align:center;margin-bottom:var(--spacing-8)}
.flow-row{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;column-gap:var(--spacing-12)}
.flow-row + .flow-row{margin-top:6px}
.flow-row .vl{text-align:right}.flow-row .vr{text-align:left}
.flow-track{position:relative;height:10px;background:var(--color-surface-inset);border-radius:var(--radius-pill)}
.flow-track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--color-disabled)}
.flow-bar{position:absolute;top:0;bottom:0;border-radius:var(--radius-pill)}
.flow-bar.prev{background:var(--color-disabled)}
.flow-bar.now.up{background:var(--market-up-fill)}.flow-bar.now.dn{background:var(--market-dn-fill)}
.flow-legend{display:flex;justify-content:center;gap:var(--spacing-16);margin-top:var(--spacing-20)}
.flow-legend span{display:inline-flex;align-items:center;gap:6px}
.flow-legend i{display:inline-block;width:12px;height:8px;border-radius:var(--radius-pill);background:var(--color-disabled)}
.flow-legend i.now{background:linear-gradient(90deg,var(--market-dn-fill) 50%,var(--market-up-fill) 50%)}

/* 주말 — 지금 이시각 추정가 타일 + 선택 종목 뉴스 */
.est-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--spacing-12)}
.est-tile{position:relative;border:1px solid var(--color-hairline);border-radius:var(--radius-12);padding:var(--spacing-20);background:var(--color-canvas);cursor:pointer;transition:border-color var(--motion-fast) var(--ease-standard)}
.est-tile:hover{border-color:var(--color-disabled)}
.est-tile[aria-pressed="true"]{border-color:var(--color-primary);box-shadow:inset 0 0 0 .5px var(--color-primary)}
.est-h{display:flex;justify-content:space-between;align-items:center;gap:var(--spacing-8);margin-bottom:var(--spacing-8)}
.est-px{margin-bottom:var(--spacing-4)}
.est-range{margin-top:var(--spacing-16)}
.est-range-h{display:flex;justify-content:space-between;gap:var(--spacing-8)}
.est-track{position:relative;height:6px;border-radius:var(--radius-pill);background:var(--color-hairline);margin:var(--spacing-12) 0 var(--spacing-8)}
.est-close{position:absolute;top:-4px;width:2px;height:14px;border-radius:1px;background:var(--color-body-muted);transform:translateX(-50%)}
.est-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:var(--radius-full);background:var(--color-ink);border:2px solid var(--color-canvas);box-shadow:0 0 0 1px var(--color-hairline);transform:translate(-50%,-50%)}
.est-ends{display:flex;justify-content:space-between}
.est-go{display:inline-block;margin-top:var(--spacing-16);color:var(--color-primary);text-decoration:none}
.est-go:hover{color:var(--color-primary-hover)}
.news-row{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:var(--spacing-16);align-items:start;padding:var(--spacing-16) 0;border-top:1px solid var(--color-hairline);color:inherit;text-decoration:none}
.news-row:first-child{border-top:0;padding-top:0}
.news-row:hover .title-16sb{color:var(--color-primary)}
.news-body > * + *{margin-top:var(--spacing-4)}
.news-thumb{width:104px;height:72px;object-fit:cover;border-radius:var(--radius-10);background:var(--color-surface-inset)}
@media (max-width:768px){.est-grid{grid-template-columns:minmax(0,1fr)}.news-row{grid-template-columns:minmax(0,1fr) 80px}.news-thumb{width:80px;height:56px}}
.notes{margin-top:var(--spacing-24);padding-top:var(--spacing-20);border-top:1px solid var(--color-hairline);display:grid;gap:var(--spacing-4)}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-10);color:var(--color-body-muted);transition:color var(--motion-fast) var(--ease-standard),background var(--motion-fast) var(--ease-standard)}
.theme-btn:hover{color:var(--color-ink);background:var(--color-surface-inset)}
.theme-btn .icon{width:20px;height:20px}

@media (max-width:768px){
  .page{padding:var(--spacing-24) var(--spacing-16) var(--spacing-120)}
  .card{padding:var(--spacing-20)}
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat,.stat:first-child{padding:var(--spacing-16) 0}
  .stat + .stat{border-left:0;border-top:1px solid var(--color-hairline)}
  .issues{grid-template-columns:minmax(0,1fr)}
  .flow-axis,.flow-row{grid-template-columns:60px minmax(0,1fr) 60px;column-gap:var(--spacing-8)}
  .display-28sb{font-size:24px;letter-spacing:-.5px}
}
</style></head><body>
<div class="page">
  <header class="page-head">
    <div>
      <p class="eyebrow">종목 시그널</p>
      <h1 class="display-28sb">어제랑 비교해서</h1>
      <p class="body-16r muted">지금을 직전 거래일 같은 시각과 나란히 봐요.</p>

function f2(n){return n==null?'—':(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2)}
function won(e){var a=Math.abs(e),s=e>0?'+':e<0?'−':'';return a>=10000?s+(a/10000).toFixed(2)+'조':s+a.toLocaleString('en-US')+'억'}
function wonAbs(e){return won(Math.abs(e)).replace(/^[+−]/,'')}
function cls(n){return n>0?'up':n<0?'dn':''}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return Number(n).toLocaleString('en-US')}
function judge(d,th){return Math.abs(d)<th?'same':(d>0?'strong':'weak')}
function badge(kind,text,dot){return '<span class="badge badge-'+kind+'">'+(dot?'<i class="badge-dot"></i>':'')+text+'</span>'}
var JB={same:['neutral','비슷해요'],strong:['error','오늘이 셈'],weak:['info','오늘이 약함']};
function jbadge(j,labels){var b=JB[j];return badge(b[0],labels?labels[j]:b[1])}
function hero(icon,eyebrow,verdictHtml,sub){
  return '<div class="hero"><p class="eyebrow">'+icon+eyebrow+'</p><h2 class="display-28sb">'+verdictHtml+'</h2><p class="body-16r muted">'+sub+'</p></div>'}
function vcol(j){return j==='strong'?'up':j==='weak'?'dn':''}
function stat(title,j,rows,diff,jl){
  return '<div class="stat"><div class="stat-h"><span class="label-14m muted">'+title+'</span>'+jbadge(j,jl)+'</div>'+
    rows.map(function(r,i){return '<div class="stat-row"><span class="caption-13r muted">'+r[0]+'</span><span class="num '+(i?'title-24sb ':'body-14r ')+(r[2]||'')+'">'+r[1]+'</span></div>'}).join('')+
    '<p class="stat-diff caption-13r muted num" style="text-align:right">'+diff+'</p></div>'}

      '<div class="table-wrap"><table class="data-table"><thead><tr><th>종목</th><th>오늘 종가</th><th>애프터장</th><th>종가 대비</th></tr></thead><tbody>'+aft+'</tbody></table></div></div></section>';
}

/* ── 주말 — 지금 이시각 추정가 + 종목별 뉴스(지금 사이트 주말 구성), 주간 비교는 그 아래 ── */
var weekendSel=null;
function newsHtml(code){
  var items=(D.weekend.news||{})[code]||[], name=(D.weekend.est.filter(function(e){return e.code===code})[0]||{}).name||'';
  var rows=items.map(function(n){
    return '<a class="news-row" href="'+esc(n.url)+'" target="_blank" rel="noopener"><div class="news-body">'+
      '<p class="caption-13r muted num">'+esc(n.time||'')+'</p><p class="title-16sb">'+esc(n.title)+'</p>'+
      (n.summary?'<p class="body-14r muted">'+esc(n.summary)+'</p>':'')+'<p class="caption-13r muted">'+esc(n.source||'')+'</p></div>'+
      (n.thumb?'<img class="news-thumb" src="'+esc(n.thumb)+'" alt="" loading="lazy">':'<span></span>')+'</a>'}).join('');
  return '<div class="card-head"><div><p class="t title-18sb">'+ICON.news+'관련 뉴스 · '+esc(name)+'</p><p class="sub caption-13r muted">최신순 · 주말은 3시간 주기(09·12·15·18·21시)</p></div></div>'+
    (rows||'<p class="body-14r muted">수집된 뉴스가 없어요.</p>');
}
function selWeekend(code){
  weekendSel=code;
  [].forEach.call(document.querySelectorAll('.est-tile'),function(t){t.setAttribute('aria-pressed',t.getAttribute('data-code')===code?'true':'false')});
  var n=document.getElementById('wk-news'); if(n) n.innerHTML=newsHtml(code);
}
function viewWeekend(){
  var W=D.weekend, E=W.est, a=W.last, b=W.this;
  if(!weekendSel) weekendSel=E[0].code;
  var avg=E.reduce(function(s,e){return s+e.p},0)/E.length;
  var tiles=E.map(function(e){
    var span=e.high-e.low, pos=span>0?(e.krw-e.low)/span*100:50, cpos=span>0?(e.close-e.low)/span*100:50;
    var where=pos<0?'정규장 저가 아래':pos>100?'정규장 고가 위':Math.round(pos)+'% 지점';
    pos=Math.max(0,Math.min(100,pos));
    return '<div class="est-tile" role="button" tabindex="0" data-code="'+e.code+'" aria-pressed="'+(e.code===weekendSel)+'" onclick="selWeekend(\''+e.code+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();selWeekend(\''+e.code+'\')}">'+
      '<div class="est-h"><span class="title-16sb">'+e.name+'</span>'+badge('info',ICON.moon.replace('class="icon"','class="icon" style="width:12px;height:12px"')+'HL 24h')+'</div>'+
      '<p class="est-px title-24sb num">'+fmt(e.krw)+'</p>'+
      '<p class="caption-13r"><span class="num '+cls(e.p)+'">'+(e.p>0?'▲ ':e.p<0?'▼ ':'')+Math.abs(e.p).toFixed(2)+'%</span> <span class="muted">종가 '+fmt(e.close)+' 대비 · 추정</span></p>'+
      '<div class="est-range"><div class="est-range-h caption-13r"><span class="muted">정규장 레인지 · '+e.dateLabel+'</span><span class="label-14m" style="font-size:13px">'+where+'</span></div>'+
        '<div class="est-track"><span class="est-close" style="left:'+cpos.toFixed(1)+'%" title="종가"></span><span class="est-dot" style="left:'+pos.toFixed(1)+'%"></span></div>'+
        '<div class="est-ends caption-13r muted num"><span>저 '+fmt(e.low)+'</span><span>고 '+fmt(e.high)+'</span></div></div>'+
      '<a class="est-go label-14m" href="/stocks/'+e.code+'/" onclick="event.stopPropagation()">종목 상세 →</a></div>'}).join('');

  var kd=+(b.kospi-a.kospi).toFixed(2), fd=b.foreign-a.foreign, ad=+(b.avg-a.avg).toFixed(2);
  var jk=judge(kd,.3), jf=judge(fd,1000), ja=judge(ad,.3);
  var JL={same:'비슷해요',strong:'이번 주가 셈',weak:'이번 주가 약함'};
  var names=Object.keys(b.leaders);
  var rows=names.map(function(n){var d=+(b.leaders[n]-a.leaders[n]).toFixed(2);return '<tr><td class="strong">'+n+'</td><td class="'+cls(a.leaders[n])+'">'+f2(a.leaders[n])+'%</td><td class="strong '+cls(b.leaders[n])+'">'+f2(b.leaders[n])+'%</td><td class="'+cls(d)+'">'+f2(d)+'%p</td></tr>'}).join('');
  var weekly='<div class="card"><div class="card-head"><div><p class="t title-18sb">'+ICON.cal+'이번 주 vs 지난주</p><p class="sub caption-13r muted">'+a.label+' · '+b.label+'</p></div></div>'+
    '<div class="stats" style="margin-top:0;border-top:0">'+
      stat('코스피 주간',jk,[['지난주',f2(a.kospi)+'%',cls(a.kospi)],['이번 주',f2(b.kospi)+'%',cls(b.kospi)]],'차이 '+f2(kd)+'%p',JL)+
      stat('외국인 주간 순매수',jf,[['지난주',won(a.foreign),cls(a.foreign)],['이번 주',won(b.foreign),cls(b.foreign)]],'차이 '+won(fd),JL)+
      stat('주도주 3종목 평균',ja,[['지난주',f2(a.avg)+'%',cls(a.avg)],['이번 주',f2(b.avg)+'%',cls(b.avg)]],'차이 '+f2(ad)+'%p',JL)+
    '</div><div class="separator"></div>'+
    '<p class="lbl label-14m">주도주 · 주간 등락 (전주 금요일 종가 대비)</p><div class="table-wrap"><table class="data-table"><thead><tr><th>종목</th><th>지난주</th><th>이번 주</th><th>차이</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

  return '<section class="section">'+hero(ICON.moon,'주말 · 지금 이시각 추정가',
      '<span class="'+(avg>0?'up':avg<0?'dn':'')+'">주도주 추정가, 종가보다 평균 '+Math.abs(avg).toFixed(2)+'% '+(avg<0?'낮아요':avg>0?'높아요':'같아요')+'</span>',
      '하이퍼리퀴드 24시간 무기한선물 가격을 원화로 환산한 참고값이에요. 실제 체결가가 아니에요.')+
    '<div class="card"><div class="est-grid">'+tiles+'</div>'+
      '<div class="notes caption-13r muted"><p>기준 종가는 정규장 공식 종가(15:30)예요. 장 마감 뒤 실시간 종가는 애프터장 가격이라 쓰지 않았어요(§48).</p></div></div>'+
    '<div class="card" id="wk-news">'+newsHtml(weekendSel)+'</div>'+weekly+'</section>';
}

var TABS=[
  {label:'장 시작 직후',time:'09:01',icon:ICON.sunrise,slot:'07:30~09:00엔 저녁 신호만 보이고, 09:00 시초가가 나오면 같은 방향이었는지가 붙어요',fn:viewPre},
  {label:'장중',time:'11:00',icon:ICON.clock,slot:'09:00~15:30 · 어제 이 시각 vs 지금',fn:viewIntra},
  {label:'애프터장',time:D.after[0].lastT.slice(0,2)+':'+D.after[0].lastT.slice(2),icon:ICON.sunset,slot:'15:40~17:00 · 오늘 애프터장 vs 어제 애프터장 같은 시각',fn:viewAfter},
  {label:'밤',time:'21:00',icon:ICON.moon,slot:'17:00~다음 날 07:30 · 밤사이 미국 반도체가 위로, 애프터장(~20:00)은 그 아래로',fn:viewNight},
  {label:'주말',time:'',icon:ICON.cal,slot:'토·일 종일 · 지금 이시각 추정가와 종목 뉴스, 그 아래 이번 주 vs 지난주',fn:viewWeekend}
];
var cur=1;
function moveIndicator(){
  var btn=document.querySelectorAll('#seg .toggle-item')[cur], ind=document.getElementById('ind');
  ind.style.width=btn.offsetWidth+'px'; ind.style.transform='translateX('+btn.offsetLeft+'px)';
}
function go(i){
  cur=i; charts=[];
  [].forEach.call(document.querySelectorAll('#seg .toggle-item'),function(b,j){b.setAttribute('aria-selected',j===i?'true':'false')});
  moveIndicator();
  document.getElementById('slot').innerHTML=ICON.clock.replace('class="icon"','class="icon" style="width:14px;height:14px"')+'<span>'+TABS[i].slot+'</span>';
  document.getElementById('view').innerHTML=TABS[i].fn();
  drawCharts();
}
document.getElementById('seg').insertAdjacentHTML('beforeend',TABS.map(function(t,i){
  return '<button class="toggle-item" role="tab" aria-selected="false" onclick="go('+i+')">'+t.icon+t.label+(t.time?' <span class="num">'+t.time+'</span>':'')+'</button>'}).join(''));
document.getElementById('theme').onclick=function(){var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark')};
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){moveIndicator();drawCharts()},120)});
go(1);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(moveIndicator);
</script></body></html>
