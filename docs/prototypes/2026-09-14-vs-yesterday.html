  function list(a,n){return a.length?'<ul class="iss">'+a.map(function(x){return '<li><span class="t">'+x.t+'</span><span>'+hl(x.title,n)+'</span></li>'}).join('')+'</ul>':'<div class="h2sub">이 시각까지 수집된 이슈가 없어요.</div>'}
  var wY=s.leaders.slice().sort(function(a,b){return a[Y]-b[Y]})[0].code, wT=s.leaders.slice().sort(function(a,b){return a[T]-b[T]})[0].code;
  var rows=s.leaders.map(function(l){var d=+(l[T]-l[Y]).toFixed(2);
    return '<tr><td>'+l.name+'</td><td class="'+cls(l[Y])+'">'+f2(l[Y])+'%<span class="px">'+fmt(l.px[Y])+'</span>'+(l.code===wY?'<span class="tag t-weak">가장 약함</span>':'')+'</td>'+
      '<td class="'+cls(l[T])+'">'+f2(l[T])+'%<span class="px">'+fmt(l.px[T])+'</span>'+(l.code===wT?'<span class="tag t-weak">가장 약함</span>':'')+'</td><td class="'+cls(d)+'">'+f2(d)+'%p</td></tr>'}).join('');
  var mx=Math.max.apply(null,[Y,T].map(function(d){return Math.max(Math.abs(s.flow[d]['개인']),Math.abs(s.flow[d]['외국인']),Math.abs(s.flow[d]['기관']))}));
  function bar(v,c){var w=Math.abs(v)/mx*48;return '<div class="bar"><span class="mid"></span><span style="'+(v>=0?'left:50%':'right:50%')+';width:'+w+'%;background:'+c+'"></span></div>'}
  var fl=['개인','외국인','기관'].map(function(k){return '<span>'+k+'</span><div class="bars">'+bar(s.flow[Y][k],'#C9D1DC')+bar(s.flow[T][k],s.flow[T][k]>=0?'#F4A6A6':'#9DC0F5')+'</div><div class="fv"><span>'+won(s.flow[Y][k])+'</span><b class="'+cls(s.flow[T][k])+'">'+won(s.flow[T][k])+'</b></div>'}).join('');
  return hero+'<div class="card"><h2>지난 금요일과 달라진 것</h2><div class="h2sub">'+s.time+'까지 기준</div>'+
    '<div class="block"><div class="lab">장중 이슈 · 새로 떠오른 소재</div><div class="chips">'+chips(I['new'],'c-new')+'</div><div class="lab">계속 이어지는 소재</div><div class="chips">'+chips(I.keep,'c-keep')+'</div>'+
      '<div class="two"><div><div class="colh">'+YL+' 9/11(금)</div>'+list(I[Y],[])+'</div><div><div class="colh">'+TL+' 9/14(월)</div>'+list(I[T],I['new'])+'</div></div></div>'+
    '<div class="block"><div class="lab">주도주 · 전일 종가 대비</div><table><tr><th>종목</th><th>'+YL+'</th><th>'+TL+'</th><th>차이</th></tr>'+rows+'</table></div>'+
    '<div class="block"><div class="lab" style="margin-bottom:8px">누적 순매수 · 위 '+YL+' / 아래 '+TL+'</div><div class="fl">'+fl+'</div></div></div>';
}

/* ── 애프터장: 오늘 애프터장 vs 어제 애프터장 같은 시각 ── */
function renderAfter(){
  var A=D.after, t=A[0].lastT, tl=t.slice(0,2)+':'+t.slice(2);
  var top=A.slice().sort(function(a,b){return Math.abs(b.p)-Math.abs(a.p)})[0], quiet=Math.abs(top.p)<.3;
  var colors=['#0F172A','#64748B','#A3AEBF'];
  var chart=lineChart(A.map(function(a,i){return {pts:a.curve,color:colors[i],label:a.name,w:i?2:2.6}}),260,[[0,'15:40'],[20,'16:00'],[140,'18:00'],[260,'20:00']],[A[0].curve[A[0].curve.length-1][0],'지금 '+tl],'오늘 종가 대비');
  var tiles=A.map(function(a){
    return '<div class="tile"><div class="k">'+a.name+'<span class="badge b-wait">어제 비교 내일부터</span></div>'+
      '<div class="pair"><span class="l">오늘 종가</span><span class="v">'+fmt(a.close)+'</span><span class="l">애프터장 '+tl+'</span><span class="v now '+cls(a.p)+'">'+fmt(a.last)+'</span></div>'+
      '<div class="diff">종가 대비 <b class="'+cls(a.p)+'">'+f2(a.p)+'%</b> · 범위 '+fmt(a.lo)+'~'+fmt(a.hi)+'</div>'+
      '<div class="diff" style="border-top:0;padding-top:0;margin-top:2px">거래량 '+fmt(a.volPost)+'주 <span style="color:var(--muted)">(16시 전 '+fmt(a.volPre)+'주)</span></div></div>'}).join('');
  return '<div class="card"><div class="vs-h"><b>어제 애프터장 '+tl+'</b> vs <b>오늘 애프터장 '+tl+'</b></div>'+
    '<div class="verdict"><span class="w-same">'+(quiet?'애프터장은 종가 근처에서 조용해요':esc(top.name)+'이(가) 애프터장에서 '+f2(top.p)+'% 움직였어요')+'</span></div>'+
    '<div class="vsub">어제(금요일) 애프터장은 기록이 없어요 — KRX 애프터마켓이 오늘 처음 열렸어요. 내일부터 같은 시각 비교가 붙어요.</div>'+
    chart+'<div class="tiles">'+tiles+'</div>'+
    '<div class="note">· 기준가는 오늘 공식 종가(일봉)예요. 실시간 응답의 종가는 장 마감 뒤에도 바뀌어서 쓰지 않았어요.<br>'+
    '· 실시간 응답에 딸린 애프터장 시가·고가·거래량 칸은 정규장까지 합친 값이라 쓰지 않고, 1분봉으로 직접 계산했어요.<br>'+
    '· 15:40~16:00 체결은 넥스트레이드 애프터마켓 시간대(KRX는 16:00 시작)예요. 거래가 적을 땐 가격보다 거래량을 먼저 보세요.</div></div>';
}

/* ── 밤: 밤사이 미국 반도체(지금 섹션 유지) + 그 전 밤 비교 열 ── */
function renderNight(){
  var N=D.night, rows=N.rows, up=rows.filter(function(r){return r.p>0}).length, dn=rows.filter(function(r){return r.p<0}).length;
  var upP=rows.filter(function(r){return r.prev>0}).length;
  var sx=rows.filter(function(r){return r.tk==='SOXX'})[0], jd=judge(+(sx.p-sx.prev).toFixed(2),.3);
  var hero='<div class="card"><div class="vs-h"><b>그 전 밤(9/10 미국장)</b> vs <b>직전 밤(9/11 미국장)</b></div>'+
    '<div class="verdict">'+head(jd,'그 전 밤과 비슷해요','그 전 밤보다 반도체가 셌어요','그 전 밤보다 반도체가 약했어요')+'</div>'+
    '<div class="vsub">반도체 ETF SOXX '+f2(sx.prev)+'% → '+f2(sx.p)+'% · 11종목 중 상승 '+upP+'개 → '+up+'개</div>'+
    '<div class="note" style="margin-top:0">시안: 월요일 밤 미국장은 아직 열리지 않아 목·금 미국장으로 틀만 보여줘요. 실제 화면은 "어제 밤 이 시각 vs 오늘 밤 이 시각"이에요.</div></div>';
  var macro=N.macro.map(function(m){return '<div class="ue-m"><div class="l">'+m.l+'</div><div class="v '+(m.v!=null?'':cls(m.p))+'">'+(m.v!=null?m.v.toFixed(2)+' <span class="'+cls(m.p)+'" style="font-size:12px">'+f2(m.p)+'%</span>':f2(m.p)+'%')+'</div><div class="pv">그 전 밤 '+f2(m.prev)+'%</div></div>'}).join('');
  var grid='<div class="ue-row h"><span>종목</span><span class="r px">9/11 종가</span><span class="r">9/11</span><span class="r">그 전 밤<span class="new-col">새 열</span></span></div>'+
    rows.map(function(r){return '<div class="ue-row"><span class="nm">'+r.nm+'<span class="tk">'+r.tk+'</span>'+(r.lead?'<span class="lead">선행</span>':'')+'</span><span class="r px">$'+r.px.toFixed(2)+'</span><span class="r '+cls(r.p)+'">'+f2(r.p)+'%</span><span class="r prev">'+f2(r.prev)+'%</span></div>'}).join('');
  var ue='<div class="card ue"><div class="ue-h"><span class="ue-t">🌙 밤사이 미국 반도체 시황</span><span class="ue-badge">직전 종가 · 9/11 미국장</span><span class="ue-br">11개 중 <b class="up">'+up+' 상승</b> · <b class="dn">'+dn+' 하락</b></span></div>'+
    '<div class="ue-macro">'+macro+'</div>'+grid+
    '<div class="note">지금 사이트의 섹션을 그대로 살렸어요(평일 17:00~다음 날 07:30, 주말 종일). 새로 붙인 건 "그 전 밤" 열과 위 비교 한 줄뿐이에요. 환율 자료에 9/11 값이 없어 시안에선 달러로 표시했어요.</div></div>';
  var aftTail='<div class="card"><h2>오늘 애프터장 최종</h2><div class="h2sub">20:00에 애프터장이 끝나면 여기에 종가 대비 최종 결과가 남아요. 다음 날 아침 "저녁 신호 체크"의 재료가 돼요.</div>'+
    '<table><tr><th>종목</th><th>오늘 종가</th><th>애프터장 ('+D.after[0].lastT.slice(0,2)+':'+D.after[0].lastT.slice(2)+' 기준)</th></tr>'+
    D.after.map(function(a){return '<tr><td>'+a.name+'</td><td>'+fmt(a.close)+'</td><td class="'+cls(a.p)+'">'+fmt(a.last)+' ('+f2(a.p)+'%)</td></tr>'}).join('')+'</table></div>';
  return hero+ue+aftTail;
}

/* ── 주말: 이번 주 vs 지난주 ── */
function renderWeekend(){
  var W=D.weekend, a=W.last, b=W.this;
  var kd=+(b.kospi-a.kospi).toFixed(2), fd=b.foreign-a.foreign, ad=+(b.avg-a.avg).toFixed(2);
  var jk=judge(kd,.3), jf=judge(fd,1000), ja=judge(ad,.3);
  var subs=['코스피 주간 등락 '+f2(a.kospi)+'% → '+f2(b.kospi)+'%'];
  if(jf!=='same') subs.push('외국인은 지난주보다 '+won(Math.abs(fd)).replace(/^[+−]/,'')+' 원어치 '+(fd<0?'더 팔았어요':(b.foreign<0?'덜 팔았어요':'더 샀어요')));
  var names=Object.keys(b.leaders);
  var rows=names.map(function(n){var d=+(b.leaders[n]-a.leaders[n]).toFixed(2);
    return '<tr><td>'+n+'</td><td class="'+cls(a.leaders[n])+'">'+f2(a.leaders[n])+'%</td><td class="'+cls(b.leaders[n])+'">'+f2(b.leaders[n])+'%</td><td class="'+cls(d)+'">'+f2(d)+'%p</td></tr>'}).join('');
  var fri=W.fri.map(function(u){return '<tr><td>'+u.nm+' <span class="px" style="display:inline">'+u.tk+'</span></td><td class="'+cls(u.p)+'">'+f2(u.p)+'%</td></tr>'}).join('');
  return '<div class="card"><div class="vs-h"><b>'+a.label+'</b> vs <b>'+b.label+'</b></div>'+
    '<div class="verdict">'+head(jk,'이번 주는 지난주와 비슷했어요','이번 주가 지난주보다 셌어요','이번 주가 지난주보다 약했어요')+'</div><div class="vsub">'+subs.join(' · ')+'</div>'+
    '<div class="tiles">'+
    tile('코스피 주간',jk,'지난주',[f2(a.kospi)+'%',cls(a.kospi)],'이번 주',[f2(b.kospi)+'%',cls(b.kospi)],'차이 '+f2(kd)+'%p',jk==='same'?'비슷해요':jk==='strong'?'이번 주가 셈':'이번 주가 약함')+
    tile('외국인 주간 순매수',jf,'지난주',[won(a.foreign),cls(a.foreign)],'이번 주',[won(b.foreign),cls(b.foreign)],'차이 '+won(fd),jf==='same'?'비슷해요':jf==='strong'?'이번 주가 셈':'이번 주가 약함')+
    tile('주도주 3종목 평균',ja,'지난주',[f2(a.avg)+'%',cls(a.avg)],'이번 주',[f2(b.avg)+'%',cls(b.avg)],'차이 '+f2(ad)+'%p',ja==='same'?'비슷해요':ja==='strong'?'이번 주가 셈':'이번 주가 약함')+'</div>'+
    '<div class="block"><div class="lab">주도주 · 주간 등락 (전주 금요일 종가 대비)</div><table><tr><th>종목</th><th>지난주</th><th>이번 주</th><th>차이</th></tr>'+rows+'</table></div>'+
    '<div class="block"><h2>금요일 저녁 신호</h2><div class="h2sub">월요일 아침 "장 시작 직후" 화면에서 시초가와 맞았는지 확인해요 · 9/11(금) 미국 정규장</div><table><tr><th>종목</th><th>9/11 미국장</th></tr>'+fri+'</table>'+
    '<div class="note">주말 동안의 이슈는 날짜·시각 기록이 없어 넣지 않았어요. 금요일 애프터장 결과는 다음 주 금요일부터 이 칸에 함께 들어가요.</div></div></div>';
}

var TABS=[
  {id:'pre',label:'장 시작 직후 · 09:01',slot:'07:30~09:00엔 저녁 신호만, 09:00 시초가가 나오면 맞았는지 체크가 붙어요',fn:renderPre},
  {id:'intra',label:'장중 · 11:00',slot:'09:00~15:30 · 어제 이 시각 vs 지금',fn:renderIntra},
  {id:'after',label:'애프터장 · '+D.after[0].lastT.slice(0,2)+':'+D.after[0].lastT.slice(2),slot:'15:40~20:00 · 오늘 애프터장 vs 어제 애프터장 같은 시각',fn:renderAfter},
  {id:'night',label:'밤 · 21:00',slot:'17:00~다음 날 07:30 · 밤사이 미국 반도체(지금 섹션 유지) + 그 전 밤 비교',fn:renderNight},
  {id:'weekend',label:'주말',slot:'토·일 종일 · 이번 주 vs 지난주 + 금요일 저녁 신호',fn:renderWeekend}
];
function go(i){
  [].forEach.call(document.querySelectorAll('#seg button'),function(b,j){b.classList.toggle('on',j===i)});
  document.getElementById('slotline').textContent=TABS[i].slot;
  document.getElementById('view').innerHTML=TABS[i].fn();
}
document.getElementById('seg').innerHTML=TABS.map(function(t,i){return '<button onclick="go('+i+')">'+t.label+'</button>'}).join('');
go(1);
</script></body></html>
