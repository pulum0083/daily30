<!-- '어제랑 비교해서' 종목 시그널 프로토타입 v4 — 지금 사이트(/stocks/) 디자인 기준 (실측: 2026-09-11 금 · 09-14 월) -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>종목 시그널 — 어제랑 비교해서 (시안 v4)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ============================================================
   지금 사이트(/stocks/) 디자인 — stocks-home.css · ds-subnav.css 값을 그대로 옮겼다
   ============================================================ */
:root{
  --canvas:#FFF;--soft:#F9FAFB;--inset:#EEF1F5;--hair:#E5E7EB;--line:#F1F5F9;--ink:#13151A;--head:#0F172A;--body:#334155;--muted:#5B6472;--faint:#94A3B8;
  --primary:#006EFF;--primary-bg:#E8F4FF;--up:#E03131;--up-bg:#FFE8E8;--dn:#2775ED;--dn-bg:#DBE8FE;--gold:#B7791F;--gold-bg:#FEF3C7;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--gnb:#16181A;
  /* 차트·막대 스크립트가 쓰는 이름 — 값만 사이트 팔레트로 */
  --color-canvas:var(--canvas);--color-hairline:var(--hair);--color-surface-inset:var(--line);--color-ink:var(--head);
  --color-body-muted:var(--muted);--color-disabled:#CBD5E1;--font-text:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-text);background:var(--soft);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
p,h1,h2,h3{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--up)}.dn{color:var(--dn)}

/* 글자 — 사이트 크기 체계(굵은 800, 작은 11~15px) */
.display-28sb{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.35;color:var(--head)}
.title-24sb{font-size:17px;font-weight:800;letter-spacing:-.3px}
.title-22sb,.title-18sb{font-size:15px;font-weight:800;color:var(--head)}
.title-16sb{font-size:14px;font-weight:800;color:var(--head)}
.body-16r{font-size:12px;line-height:1.55}
.body-14r{font-size:13px;line-height:1.55}
.caption-13r{font-size:11px;line-height:1.5}
.label-14m{font-size:13px;font-weight:700;color:var(--head)}

/* GNB */
.gnb{position:sticky;top:0;z-index:10;background:var(--gnb);height:52px;display:flex;align-items:center}
.gnb__in{max-width:1120px;margin:0 auto;width:100%;padding:0 28px;display:flex;align-items:center;gap:22px}
.gnb__logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.gnb__logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#E03131,#FF6A6A);display:flex;align-items:center;justify-content:center}
.gnb__logo-mark svg{width:17px;height:17px}
.gnb__title{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em}
.gnb__title span{color:#5AA2FF}
.gnb__subs{display:flex;align-items:center}
.gnb__sub{font-size:13px;font-weight:700;color:#8A9099;padding:5px 4px;text-decoration:none}
.gnb__divider{width:1px;height:16px;background:#2E3035;margin:0 4px}

/* 페이지 머리말 */
.wrap{max-width:1120px;margin:0 auto;padding:24px 28px 64px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.phead h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.phead h1 .a{color:var(--primary)}
.phead .beta{display:inline-block;font-size:11px;font-weight:700;color:#7C3AED;background:rgba(124,58,237,.12);padding:2px 6px;border-radius:4px;vertical-align:middle;letter-spacing:.04em;line-height:1.4}
.phead p{font-size:12px;color:var(--muted);margin-top:5px}
.proto{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-bg);border-radius:999px;padding:3px 9px}

/* 시간대 탭 — 사이트 서브탭(밑줄형) */
.segment-wrap{display:flex;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.segment-wrap::-webkit-scrollbar{display:none}
.toggle-group{display:flex;align-items:stretch}
.toggle-indicator{display:none}
.toggle-item{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;min-height:40px;padding:0 16px;font-size:14px;font-weight:500;letter-spacing:-.16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.toggle-item:hover{color:var(--ink)}
.toggle-item[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.toggle-item .num{font-size:11px;font-weight:600;color:var(--faint)}
.toggle-item[aria-selected="true"] .num{color:var(--primary);opacity:.7}
.slot-caption{display:flex;justify-content:flex-end;font-size:11px;color:var(--muted);margin:8px 0 12px}

/* 판정 한 줄 — 사이트 브리핑 카드처럼 카드 안 */
.hero{background:var(--canvas);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--s1);padding:14px 16px;margin-bottom:12px}
.hero .eyebrow{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.hero .body-16r{color:var(--muted);margin-top:4px}

/* 카드 — 사이트 위젯(흰 바탕 · 14px 모서리 · 옅은 그림자) */
.card{background:var(--canvas);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--s1);padding:15px 16px}
.card + .card,.pw + .card,.card + .pw{margin-top:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.card-head .t{display:flex;align-items:center;gap:6px}
.card-head .sub{margin-top:2px;color:var(--muted)}
.separator{height:1px;background:var(--line);margin:16px 0}
.lbl{margin-bottom:8px}

/* 차트 */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:8px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid currentColor}
.legend i.dash{border-top-style:dashed}
.legend .r{margin-left:auto}
.chart svg{display:block}

/* 비교 칸 — 사이트 지표 박스(연회색 칸 안 라벨 + 큰 숫자) */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:#F7F9FC;border:1px solid var(--inset);border-radius:10px;padding:10px 12px}
.stat-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.stat-h .label-14m{font-size:11px;font-weight:600;color:var(--muted)}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat-row + .stat-row{margin-top:2px}
.stat-diff{margin-top:4px}

/* 알약 표시 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;line-height:1.6}
.badge-success{color:#15803D;background:#ECFDF3}
.badge-warning{color:var(--gold);background:var(--gold-bg)}
.badge-error{color:var(--up);background:var(--up-bg)}
.badge-info{color:var(--dn);background:var(--dn-bg)}
.badge-neutral{color:var(--muted);background:var(--line)}
.badge-ink{color:#fff;background:var(--head)}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.badges{display:flex;flex-wrap:wrap;gap:6px}

/* 표 — 사이트 표(연한 줄 · 작은 굵은 머리글) */
.table-wrap{width:100%;border:1px solid #EEF2F6;border-radius:10px;overflow:hidden;overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.data-table th{padding:7px 10px;background:#FAFBFC;font-size:11px;font-weight:800;color:var(--muted);text-align:right;border-bottom:1px solid #EEF2F6;white-space:nowrap}
.data-table td{padding:8px 10px;border-bottom:1px solid #EEF2F6;text-align:right;white-space:nowrap;color:var(--head)}
.data-table td.up{color:var(--up)}.data-table td.dn{color:var(--dn)}
.data-table tr:last-child td{border-bottom:0}
.data-table th:first-child,.data-table td:first-child{text-align:left}
.data-table .sub{display:block;font-size:11px;color:var(--faint)}
.data-table .strong{font-weight:800}

/* 이슈 목록 — 사이트 '오늘 장중 이슈' 줄 */
.issues{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px}
.issue-list{list-style:none;margin:0;padding:0}
.issue-list li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.issue-list li:first-child{border-top:0;padding-top:2px}
.issue-list .body-14r{font-weight:600;color:var(--head)}
.issue-list mark{background:var(--up-bg);color:var(--up);border-radius:3px;padding:0 2px}

/* 투자자별 막대 */
.flow{max-width:760px;margin:0 auto}
.flow-axis{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;margin-bottom:8px}
.flow-axis .mid{display:flex;justify-content:space-between}
.flow-group + .flow-group{margin-top:14px}
.flow-name{text-align:center;margin-bottom:6px}
.flow-row{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;column-gap:10px}
.flow-row + .flow-row{margin-top:5px}
.flow-row .vl{text-align:right}.flow-row .vr{text-align:left}
.flow-row .caption-13r{font-weight:700}
.flow-track{position:relative;height:8px;background:var(--line);border-radius:999px}
.flow-track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:#CBD5E1}
.flow-bar{position:absolute;top:0;bottom:0;border-radius:999px}
.flow-bar.prev{background:#CBD5E1}
.flow-bar.now.up{background:var(--up)}.flow-bar.now.dn{background:var(--dn)}
.flow-legend{display:flex;justify-content:center;gap:14px;margin-top:14px}
.flow-legend span{display:inline-flex;align-items:center;gap:6px}
.flow-legend i{display:inline-block;width:12px;height:7px;border-radius:999px;background:#CBD5E1}
.flow-legend i.now{background:linear-gradient(90deg,var(--dn) 50%,var(--up) 50%)}

.notes{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:3px}

/* 주말 추정가·뉴스 — 지금 사이트 /stocks/ '코스피 주도주' 위젯(stocks-home.css) 스타일 이식 */
.pw{--pw-bg:#fff;--pw-tile:#F7F9FC;--pw-line:#E5E7EB;--pw-soft:#F1F5F9;--pw-ink:#0F172A;--pw-body:#334155;--pw-muted:#64748B;--pw-faint:#94A3B8;--pw-up:#E03131;--pw-dn:#2775ED;
  background:var(--pw-bg);border:1px solid var(--pw-line);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);padding:15px 16px;color:var(--pw-ink)}
.pw-h{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;margin-bottom:11px}
.pw-t{font-size:15px;font-weight:800}
.pw-s{margin-left:auto;font-size:11px;color:var(--pw-muted)}
.pw-tiles{display:flex;gap:9px}
.us-tile{position:relative;flex:1 1 0;min-width:0;cursor:pointer;background:var(--pw-tile);border:1.5px solid var(--pw-line);border-radius:14px;padding:15px 15px 13px;transition:border-color .12s,box-shadow .12s,background .12s}
.us-tile.on{background:var(--pw-bg);border-color:#2775ED;box-shadow:0 4px 14px rgba(37,117,237,.13)}
.ut-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ut-nm{font-size:14px;font-weight:800}
.usw-pill{font-size:11px;font-weight:700;color:#6D28D9;background:#EDE9FE;border-radius:999px;padding:1px 6px;white-space:nowrap}
.ut-px{font-size:25px;font-weight:900;letter-spacing:-.8px;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.ut-cg{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-top:4px}
.ut-chg{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.ut-prev{font-size:11px;color:var(--pw-faint);font-variant-numeric:tabular-nums}
.ut-rng{margin-top:13px}
.ut-rng-h{display:flex;justify-content:space-between;font-size:10.5px;color:var(--pw-muted);margin-bottom:5px}
.ut-rng-pos{color:var(--pw-ink);font-weight:700}
.ut-track{position:relative;height:6px;border-radius:999px;background:linear-gradient(90deg,#DBEAFE,#FEE2E2)}
.ut-open{position:absolute;top:-3px;width:2px;height:12px;background:#94A3B8;border-radius:1px;transform:translateX(-50%)}
.ut-mk{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#0F172A;border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,23,42,.15);transform:translate(-50%,-50%)}
.ut-rng-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--pw-faint);margin-top:5px;font-variant-numeric:tabular-nums}
.ut-stats{margin-top:12px;padding-top:11px;border-top:1px solid var(--pw-line);display:flex;flex-direction:column;gap:6px}
.ut-stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.ut-stat .k{color:var(--pw-muted)}
.ut-stat .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ut-frg-d{font-weight:500;color:var(--pw-faint);font-size:10.5px;margin-left:3px}
.ut-go{display:block;margin-top:10px;text-align:right;font-size:11.5px;font-weight:500;color:var(--pw-faint);text-decoration:none}
.ut-go:hover{color:#2563EB;text-decoration:underline}
.pw-news{margin-top:18px;padding-top:16px;border-top:1px solid var(--pw-soft)}
.lw-h{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.lw-note{margin-left:auto;font-size:12px;font-weight:700;color:var(--pw-muted)}
.lw-news a{display:flex;gap:11px;text-decoration:none;color:inherit;padding:10px 0;border-top:1px solid var(--pw-soft)}
.lw-news a:first-child{border-top:none}
.lw-news .nb{flex:1;min-width:0}
.lw-news .nt{font-size:12px;font-weight:700;color:var(--pw-muted)}
.lw-news .nh{font-size:14px;font-weight:800;line-height:1.45;margin:3px 0 4px}
.lw-news a:hover .nh{color:#2775ED}
.lw-news .ns{font-size:13px;color:var(--pw-body);line-height:1.55;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lw-news .nsrc{font-size:12px;color:var(--pw-muted)}
.lw-news .nimg{flex:0 0 74px;width:74px;height:56px;border-radius:8px;object-fit:cover;background:var(--pw-soft);border:1px solid var(--pw-line);margin-top:14px}
.pw-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--pw-soft);font-size:11px;color:var(--pw-muted)}
@media (max-width:700px){.pw-tiles{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.us-tile{flex:0 0 78%;scroll-snap-align:start}.pw-s{flex-basis:100%;margin-left:0}}

@media (max-width:760px){
  .gnb__in{padding:0 14px;gap:12px}
  .wrap{padding:12px 14px 52px}
  .phead h1{font-size:18px}
  .stats{grid-template-columns:minmax(0,1fr)}
  .issues{grid-template-columns:minmax(0,1fr)}
  .flow-axis,.flow-row{grid-template-columns:60px minmax(0,1fr) 60px;column-gap:8px}
}
</style></head><body>
<div class="gnb"><div class="gnb__in"><a class="gnb__logo" href="/stocks/"><span class="gnb__logo-mark"><svg viewBox="0 0 32 32" fill="none"><rect x="7" y="15" width="5.5" height="9" rx="1.6" fill="white"/><line x1="9.75" y1="10" x2="9.75" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="9.75" y1="24" x2="9.75" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/><rect x="19.5" y="9" width="5.5" height="13" rx="1.6" fill="white"/><line x1="22.25" y1="5" x2="22.25" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="22.25" y1="22" x2="22.25" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span><span class="gnb__title">Double-<span>Shot</span></span></a>
  <nav class="gnb__subs"><a class="gnb__sub" href="/briefings/">브리핑</a><span class="gnb__divider"></span><a class="gnb__sub" href="/dividend/">월배당</a></nav></div></div>
<div class="wrap">
  <div class="phead">
    <div>
      <h1>종목 <span class="a">시그널</span> <span class="beta">BETA</span></h1>
      <p>어제랑 비교해서 · 지금을 직전 거래일 같은 시각과 나란히 봐요</p>
    </div>
    <span class="proto">시안 v4 · 모든 숫자 실측</span>
  </div>

  <div class="segment-wrap"><div class="toggle-group" role="tablist" id="seg"><span class="toggle-indicator" id="ind"></span></div></div>
  <p class="slot-caption" id="slot"></p>
  <main id="view"></main>

    return '<a href="'+esc(n.url)+'" target="_blank" rel="noopener"><div class="nb"><div class="nt">'+esc(n.time||'')+'</div><div class="nh">'+esc(n.title)+'</div>'+
      (n.summary?'<div class="ns">'+esc(n.summary)+'</div>':'')+'<div class="nsrc">'+esc(n.source||'')+'</div></div>'+
      (n.thumb?'<img class="nimg" src="'+esc(n.thumb)+'" alt="" loading="lazy">':'')+'</a>'}).join('');
  return '<div class="lw-h">📰 관련 뉴스 · '+esc(name)+'<span class="lw-note">최신순 · 3시간 주기</span></div>'+
    (rows?'<div class="lw-news">'+rows+'</div>':'<p class="lw-note" style="margin:0">수집된 뉴스가 없어요.</p>');
}
function selWeekend(code){
  weekendSel=code;
  [].forEach.call(document.querySelectorAll('.us-tile'),function(t){var on=t.getAttribute('data-code')===code;t.classList.toggle('on',on);t.setAttribute('aria-pressed',on?'true':'false')});
  var n=document.getElementById('wk-news'); if(n) n.innerHTML=newsHtml(code);
}
function viewWeekend(){
  var W=D.weekend, E=W.est, a=W.last, b=W.this;
  if(!weekendSel) weekendSel=E[0].code;
  var avg=E.reduce(function(s,e){return s+e.p},0)/E.length;
  var UP='#E03131', DN='#2775ED';
  var tiles=E.map(function(e){
    var span=e.high-e.low, raw=span>0?(e.krw-e.low)/span*100:50, opos=span>0?(e.open-e.low)/span*100:50;
    var where=raw<0?'정규장 저가 아래':raw>100?'정규장 고가 위':Math.round(raw)+'% 지점';
    var pos=Math.max(0,Math.min(100,raw)), on=e.code===weekendSel;
    var w52=e.w52==null?'':'<div class="ut-stat"><span class="k">52주 고점 대비</span><span class="v" style="color:'+(e.w52>=0?UP:DN)+'">'+(e.w52>=0?'+':'−')+Math.abs(e.w52).toFixed(1)+'%</span></div>';
    var frg=e.frg==null?'':'<div class="ut-stat"><span class="k">외국인 5일 순매수</span><span class="v"><span style="color:'+(e.frg>0?UP:e.frg<0?DN:'')+'">'+(e.frg>0?'+':e.frg<0?'−':'')+fmt(Math.round(Math.abs(e.frg)/1e4))+'만주</span><small class="ut-frg-d">'+esc(e.frgPeriod)+'</small></span></div>';
    return '<div class="us-tile'+(on?' on':'')+'" role="button" tabindex="0" data-code="'+e.code+'" aria-pressed="'+on+'" onclick="selWeekend(\''+e.code+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();selWeekend(\''+e.code+'\')}">'+
      '<div class="ut-top"><span class="ut-nm">'+e.name+'</span><span class="usw-pill">🌙 HL 24h</span></div>'+
      '<div class="ut-px">'+fmt(e.krw)+'</div>'+
      '<div class="ut-cg"><span class="ut-chg" style="color:'+(e.p>0?UP:e.p<0?DN:'')+'">'+(e.p>0?'▲':e.p<0?'▼':'–')+' '+Math.abs(e.p).toFixed(2)+'%</span><span class="ut-prev">종가 '+fmt(e.close)+' 대비 · 추정</span></div>'+
      '<div class="ut-rng"><div class="ut-rng-h"><span>정규장 레인지 · '+e.dateLabel+'</span><b class="ut-rng-pos">'+where+'</b></div>'+
        '<div class="ut-track"><span class="ut-open" style="left:'+Math.max(0,Math.min(100,opos)).toFixed(1)+'%" title="시가"></span><span class="ut-mk" style="left:'+pos.toFixed(1)+'%"></span></div>'+
        '<div class="ut-rng-ends"><span>저 '+fmt(e.low)+'</span><span>고 '+fmt(e.high)+'</span></div></div>'+
      ((w52||frg)?'<div class="ut-stats">'+w52+frg+'</div>':'')+
      '<a class="ut-go" href="/stocks/'+e.code+'/" onclick="event.stopPropagation()">종목 상세 →</a></div>'}).join('');

  var kd=+(b.kospi-a.kospi).toFixed(2), fd=b.foreign-a.foreign, ad=+(b.avg-a.avg).toFixed(2);
  var jk=judge(kd,.3), jf=judge(fd,1000), ja=judge(ad,.3);
  var JL={same:'비슷해요',strong:'이번 주가 셈',weak:'이번 주가 약함'};
  var names=Object.keys(b.leaders);
  var rows=names.map(function(n){var d=+(b.leaders[n]-a.leaders[n]).toFixed(2);return '<tr><td class="strong">'+n+'</td><td class="'+cls(a.leaders[n])+'">'+f2(a.leaders[n])+'%</td><td class="strong '+cls(b.leaders[n])+'">'+f2(b.leaders[n])+'%</td><td class="'+cls(d)+'">'+f2(d)+'%p</td></tr>'}).join('');
  var weekly='<div class="card"><div class="card-head"><div><p class="t title-18sb">'+ICON.cal+'이번 주 vs 지난주</p><p class="sub caption-13r muted">'+a.label+' · '+b.label+'</p></div></div>'+
    '<div class="stats" style="margin-top:0;border-top:0">'+
      stat('코스피 주간',jk,[['지난주',f2(a.kospi)+'%',cls(a.kospi)],['이번 주',f2(b.kospi)+'%',cls(b.kospi)]],'차이 '+f2(kd)+'%p',JL)+
      stat('외국인 주간 순매수',jf,[['지난주',won(a.foreign),cls(a.foreign)],['이번 주',won(b.foreign),cls(b.foreign)]],'차이 '+won(fd),JL)+
      stat('주도주 3종목 평균',ja,[['지난주',f2(a.avg)+'%',cls(a.avg)],['이번 주',f2(b.avg)+'%',cls(b.avg)]],'차이 '+f2(ad)+'%p',JL)+
    '</div><div class="separator"></div>'+
    '<p class="lbl label-14m">주도주 · 주간 등락 (전주 금요일 종가 대비)</p><div class="table-wrap"><table class="data-table"><thead><tr><th>종목</th><th>지난주</th><th>이번 주</th><th>차이</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

  return '<section class="section">'+hero(ICON.moon,'주말 · 지금 이시각 추정가',
      '<span class="'+(avg>0?'up':avg<0?'dn':'')+'">주도주 추정가, 종가보다 평균 '+Math.abs(avg).toFixed(2)+'% '+(avg<0?'낮아요':avg>0?'높아요':'같아요')+'</span>',
      '하이퍼리퀴드 24시간 무기한선물 가격을 원화로 환산한 참고값이에요. 실제 체결가가 아니에요.')+
    '<div class="pw"><div class="pw-h"><span class="pw-t">📈 지금 이시각 추정가</span><span class="pw-s">종가 × 하이퍼리퀴드 야간 변동 · 실제 체결가 아님</span></div>'+
      '<div class="pw-tiles">'+tiles+'</div>'+
      '<div class="pw-news" id="wk-news">'+newsHtml(weekendSel)+'</div>'+
      '<p class="pw-foot">기준 종가는 정규장 공식 종가(15:30)예요. 장 마감 뒤 실시간 종가는 애프터장 가격이라 쓰지 않았어요.</p></div>'+weekly+'</section>';
}

var TABS=[
  {label:'장 시작 직후',time:'09:01',icon:ICON.sunrise,slot:'07:30~09:00엔 저녁 신호만 보이고, 09:00 시초가가 나오면 같은 방향이었는지가 붙어요',fn:viewPre},
  {label:'장중',time:'11:00',icon:ICON.clock,slot:'09:00~15:30 · 어제 이 시각 vs 지금',fn:viewIntra},
  {label:'애프터장',time:D.after[0].lastT.slice(0,2)+':'+D.after[0].lastT.slice(2),icon:ICON.sunset,slot:'15:40~17:00 · 오늘 애프터장 vs 어제 애프터장 같은 시각',fn:viewAfter},
  {label:'밤',time:'17:00',icon:ICON.moon,slot:'17:00부터 다음 날 07:30까지 · 밤사이 미국 반도체가 맨 위로, 애프터장(~20:00)은 그 아래로',fn:viewNight},
  {label:'주말',time:'',icon:ICON.cal,slot:'토·일 종일 · 지금 이시각 추정가와 종목 뉴스, 그 아래 이번 주 vs 지난주',fn:viewWeekend}
];
var cur=1;
function moveIndicator(){
  var btn=document.querySelectorAll('#seg .toggle-item')[cur], ind=document.getElementById('ind');
  ind.style.width=btn.offsetWidth+'px'; ind.style.transform='translateX('+btn.offsetLeft+'px)';
}
function go(i){
  cur=i; charts=[];
  [].forEach.call(document.querySelectorAll('#seg .toggle-item'),function(b,j){b.setAttribute('aria-selected',j===i?'true':'false')});
  moveIndicator();
  document.getElementById('slot').textContent=TABS[i].slot;
  document.getElementById('view').innerHTML=TABS[i].fn();
  drawCharts();
}
document.getElementById('seg').insertAdjacentHTML('beforeend',TABS.map(function(t,i){
  return '<button class="toggle-item" role="tab" aria-selected="false" onclick="go('+i+')">'+t.label+(t.time?' <span class="num">'+t.time+'</span>':'')+'</button>'}).join(''));
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){moveIndicator();drawCharts()},120)});
go(1);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(moveIndicator);
</script></body></html>
