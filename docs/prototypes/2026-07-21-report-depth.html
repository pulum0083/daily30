<style>
:root{--canvas:#FFF;--soft:#F9FAFB;--inset:#EEF1F5;--hair:#E5E7EB;--ink:#13151A;--muted:#6B7280;
  --primary:#006EFF;--primary-bg:#E8F4FF;--up:#E03131;--dn:#2775ED;--gold:#B7791F;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:var(--soft);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 70px}

/* 프로토타입 크롬 (실제 서비스엔 없음) */
.proto{max-width:560px;margin:0 auto 18px;padding:16px 16px 4px}
.proto h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.proto p{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.65}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:flex;background:var(--inset);border-radius:9px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);
  padding:6px 13px;border-radius:7px;cursor:pointer;transition:.12s}
.seg button.on{background:var(--canvas);color:var(--ink);box-shadow:var(--s1)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
  font-weight:600;cursor:pointer;margin-left:auto;user-select:none}
.chk input{accent-color:var(--primary);width:15px;height:15px}
.legend{background:var(--canvas);border:1px solid var(--hair);border-radius:10px;
  padding:12px 14px;font-size:12.5px;line-height:1.9;color:var(--muted);margin-bottom:16px}
.legend b{color:var(--ink)}
.legend .k{display:inline-block;width:7px;height:7px;border-radius:2px;background:#F5A524;
  margin-right:7px;vertical-align:1px}

/* 변경점 하이라이트 */
.hl{position:relative}
body.mark .hl{outline:2px solid #F5A524;outline-offset:3px;border-radius:6px}
body.mark .hl::after{content:attr(data-tag);position:absolute;top:-9px;right:6px;
  background:#F5A524;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.02em;
  padding:1px 6px;border-radius:4px;z-index:2}

/* 카드 (stocks.css 원본) */
.np{background:var(--canvas);border:1px solid var(--hair);border-radius:12px;
  overflow:hidden;margin-bottom:14px;box-shadow:var(--s1)}
.np__h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  border-bottom:1px solid var(--hair)}
.np__t{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink)}
.np__t svg{width:17px;height:17px;color:var(--primary)}
.np__s{font-size:11px;color:var(--muted)}
.tgt-range-wrap{padding:36px 18px 16px;border-bottom:1px solid var(--hair)}
.tgt-range{position:relative;height:6px;border-radius:3px;
  background:linear-gradient(90deg,#A7C8F2,#9BDDBE 45%,#F3CE94)}
.tgt-dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);border:2px solid var(--canvas)}
.tgt-cur{position:absolute;top:-32px;transform:translateX(-50%);font-size:10px;font-weight:700;
  color:var(--ink);background:var(--canvas);border:1px solid var(--hair);border-radius:5px;
  padding:2px 7px;white-space:nowrap}
.tgt-scale{display:flex;justify-content:space-between;margin-top:16px}
.tgt-scale .lab{font-size:11px;color:var(--muted);margin-bottom:2px}
.tgt-scale .v2{font-size:15px;font-weight:800}
.tgt-scale .c{text-align:center}.tgt-scale .r{text-align:right}
.tgt-tbl{width:100%;border-collapse:collapse}
.tgt-tbl th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;
  padding:10px 16px 8px;border-bottom:1px solid var(--hair)}
.tgt-tbl th:first-child{text-align:left}
.tgt-tbl td{font-size:13px;padding:9px 16px;border-bottom:1px solid #F1F5F9;text-align:right}
.tgt-tbl td:first-child{text-align:left;font-weight:600;color:var(--ink)}
.tgt-tbl tr:last-child td{border-bottom:none}
.tgt-tbl .pr{font-weight:700;color:var(--primary)}
.tgt-tbl .op2{font-size:11px;font-weight:700;color:#1A7F4B;background:#E3F5EA;
  padding:2px 8px;border-radius:5px}
.tgt-tbl .op2.hold{color:var(--muted);background:var(--inset)}
.tgt-tbl .dt{color:var(--muted);font-size:12px}

/* 신규 — 증권사명 PDF 링크 */
.firm-pdf{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.firm-pdf:hover{color:var(--primary);text-decoration:underline}
.firm-pdf svg{width:11px;height:11px;color:#B0B6BE;flex-shrink:0}
.firm-pdf:hover svg{color:var(--primary)}

/* 신규 — 정렬 */
.sortbar{display:flex;gap:4px}
.sortbar button{border:1px solid var(--hair);background:var(--canvas);font:inherit;font-size:11px;
  font-weight:700;color:var(--muted);padding:3px 9px;border-radius:6px;cursor:pointer}
.sortbar button.on{background:var(--primary-bg);border-color:#B9DCFF;color:var(--primary)}

/* 신규 — 연도별 실적 */
.fin-tbl{width:100%;border-collapse:collapse}
.fin-tbl th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;
  padding:10px 14px 8px;border-bottom:1px solid var(--hair);white-space:nowrap}
.fin-tbl th:first-child{text-align:left}
.fin-tbl td{font-size:12.5px;padding:9px 14px;border-bottom:1px solid #F1F5F9;
  text-align:right;white-space:nowrap}
.fin-tbl td:first-child{text-align:left;font-weight:600;color:var(--ink)}
.fin-tbl tr:last-child td{border-bottom:none}
.fin-tbl .est{background:#FFFDF5}
.fin-tbl th.est{background:#FEF6E0;color:var(--gold)}
.fin-tbl .ebadge{display:inline-block;font-size:9px;font-weight:800;background:var(--gold);
  color:#fff;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.fin-tbl .val{font-weight:700}
.fin-tbl .nil{color:#C3C8CF;font-weight:400}
.fin-sep td{border-bottom:1px solid var(--hair)!important;padding:0;height:0}
.fin-note{padding:10px 14px;font-size:11px;color:var(--muted);line-height:1.6;background:var(--soft)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:420px){
  .tgt-tbl th,.tgt-tbl td{padding:7px 8px;font-size:12px}
  .fin-tbl th,.fin-tbl td{padding:7px 9px;font-size:11.5px}
}
</style>

  if (unit === '원') return won(Math.round(v)) + '원';
  return v.toFixed(2) + '배';
};
const opKo = o => {
  const s = (o || '').trim();
  if (/^strong\s*buy$/i.test(s) || s === '적극매수') return '적극매수';
  if (/^buy$/i.test(s) || s === '매수') return '매수';
  if (/^(hold|neutral|marketperform)$/i.test(s) || s === '중립') return '중립';
  if (/^(sell|underperform|reduce)$/i.test(s) || s === '매도') return '매도';
  return s || '—';
};
const relWhen = d => {
  const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(d);
  if (!m) return '';
  const then = new Date(2000 + +m[1], +m[2] - 1, +m[3]);
  const diff = Math.floor((new Date(2026, 6, 21) - then) / 864e5);
  if (diff <= 0) return '오늘';
  if (diff < 7) return diff + '일 전';
  if (diff < 31) return Math.floor(diff / 7) + '주 전';
  return Math.floor(diff / 30) + '개월 전';
};

let sortKey = 'date';

function render() {
  const s = DATA[code];
  const after = mode === 'after';
  const cur = s.close;

  // ── 목표주가 ──
  let rows = s.reports.filter(r => r.price);
  rows.sort((a, b) => sortKey === 'price'
    ? b.price - a.price
    : b.date.localeCompare(a.date));
  const shown = after ? rows : rows.slice(0, 10);
  const prices = rows.map(r => r.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const avg = s.consensus || Math.round(prices.reduce((x, y) => x + y, 0) / prices.length);
  const span = (max - min) || 1;
  const pct = v => Math.max(0, Math.min(100, (v - min) / span * 100));

  const firmCell = r => {
    if (!after || !r.pdf) return r.firm;
    return `<a class="firm-pdf" href="${r.pdf}" target="_blank" rel="noopener">${r.firm}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
      <path d="M14 3h7v7M21 3l-9 9M19 14v6H4V5h6"/></svg></a>`;
  };

  const sortBar = after
    ? `<div class="sortbar hl" data-tag="정렬">
         <button data-sort="date" class="${sortKey === 'date' ? 'on' : ''}">최신순</button>
         <button data-sort="price" class="${sortKey === 'price' ? 'on' : ''}">목표가순</button>
       </div>`
    : `<span class="np__s">컨센서스 ${s.firm_count}개사</span>`;

  let html = `
  <div class="np">
    <div class="np__h">
      <span class="np__t">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V10m4 11V6m4 15V12m4 9V8"/></svg>
        증권사 목표주가
      </span>
      ${sortBar}
    </div>
    <div class="tgt-range-wrap">
      <div class="tgt-range">
        <div class="tgt-cur" style="left:${pct(cur)}%">현재가 ${won(cur)}</div>
        <div class="tgt-dot" style="left:0%;background:#378ADD"></div>
        <div class="tgt-dot" style="left:${pct(avg)}%;background:#1D9E75"></div>
        <div class="tgt-dot" style="left:100%;background:#BA7517"></div>
      </div>
      <div class="tgt-scale">
        <div><div class="lab">최저</div><div class="v2" style="color:#378ADD">${won(min)}원</div></div>
        <div class="c"><div class="lab">평균</div><div class="v2" style="color:#1D9E75">${won(avg)}원</div></div>
        <div class="r"><div class="lab">최고</div><div class="v2" style="color:#BA7517">${won(max)}원</div></div>
      </div>
    </div>
    <table class="tgt-tbl">
      <thead><tr><th>증권사</th><th>목표가</th><th>의견</th><th>발표일</th><th>상승여력</th></tr></thead>
      <tbody>`;

  shown.forEach((r, i) => {
    const up = (r.price / cur - 1) * 100;
    const isNew = after && i >= 10;
    html += `<tr${isNew ? ' class="hl" data-tag="전건"' : ''}>
      <td>${firmCell(r)}</td>
      <td class="pr num">${won(r.price)}</td>
      <td><span class="op2 ${['매수','적극매수'].includes(opKo(r.opinion)) ? '' : 'hold'}">${opKo(r.opinion)}</span></td>
      <td class="dt">${relWhen(r.date)}</td>
      <td class="num" style="color:${up >= 0 ? 'var(--up)' : 'var(--dn)'};font-weight:700">${up >= 0 ? '+' : ''}${up.toFixed(1)}%</td>
    </tr>`;
  });

  html += `</tbody></table>`;
  if (!after) html += `<div class="fin-note">${rows.length}개사 중 10건만 표시 — 상단 "컨센서스 ${s.firm_count}개사"와 행 수가 어긋납니다.</div>`;
  html += `</div>`;

  // ── 연도별 실적 컨센서스 (개선 후 전용) ──
  if (after) {
    const ys = s.years;
    html += `
    <div class="np hl" data-tag="신규 섹션">
      <div class="np__h">
        <span class="np__t">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg>
          연도별 실적 컨센서스
        </span>
        <span class="np__s">확정 ${ys.filter(y => !y.estimate).length}년 + 예상 ${ys.filter(y => y.estimate).length}년</span>
      </div>
      <div class="scrollx"><table class="fin-tbl">
        <thead><tr><th>항목</th>`;
    ys.forEach(y => {
      html += `<th class="${y.estimate ? 'est' : ''}">${y.label}${y.estimate ? '<span class="ebadge">E</span>' : ''}</th>`;
    });
    html += `</tr></thead><tbody>`;
    s.rows.forEach((r, i) => {
      if (i === 3) html += `<tr class="fin-sep"><td colspan="${ys.length + 1}"></td></tr>`;
      html += `<tr><td>${r.title}</td>`;
      ys.forEach(y => {
        const v = fmt(r.values[y.key], r.unit);
        html += `<td class="num ${y.estimate ? 'est' : ''}">
          ${v ? `<span class="val">${v}</span>` : '<span class="nil">—</span>'}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>
      <div class="fin-note">네이버 금융 실측 · <b>E</b> 표시 연도는 증권사 컨센서스 추정치입니다. 값이 없는 항목은 <b>—</b>로 두고 채우지 않습니다.</div>
    </div>`;
  }

  $('#app').innerHTML = html;
  document.querySelectorAll('[data-sort]').forEach(b =>
    b.onclick = () => { sortKey = b.dataset.sort; render(); });
}

function boot() {
  const seg = $('#stockSeg');
  seg.innerHTML = Object.entries(DATA)
    .map(([c, s]) => `<button data-code="${c}" class="${c === code ? 'on' : ''}">${s.name}</button>`).join('');
  seg.onclick = e => {
    const b = e.target.closest('[data-code]'); if (!b) return;
    code = b.dataset.code;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    render();
  };
  $('#modeSeg').onclick = e => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    mode = b.dataset.mode;
    $('#modeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    render();
  };
  $('#markChk').onchange = e => document.body.classList.toggle('mark', e.target.checked);
  document.body.classList.add('mark');
  render();
}
boot();
</script>
</body>
</html>
