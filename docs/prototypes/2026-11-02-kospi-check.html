}

  var xs = r.map(function (x, i) { var now = i === r.length - 1; return '<span' + (now ? ' class="now"' : '') + '>' + (+x[0].slice(5)) + '월</span>'; }).join('');
  return '<div class="ss">' + left() + '<div class="chart"><div class="vb">' + bars + '</div><div class="vb-x">' + xs + '</div></div></div>';
}
