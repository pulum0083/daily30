name               = "doubleshot-cron"
main               = "src/worker.js"
compatibility_date = "2025-01-01"

# ── Cron 트리거 4개 (Free 플랜 5개 한도 → 1슬롯 여유) / 모두 UTC 기준 ─────
# 요일·시각 필터는 Worker 코드에서 처리. 주말 발동 시 코드가 자동 skip.
[triggers]
crons = [
  "25 22 * * *",                          # 코스피 시초가   07:25 KST
  "15,25,30,35 7,8,9,10,11,12,13,14 * * *", # 코스피 마감(07:25) + POST_MARKET이슈(:35,7-11h)
                                           #   + 미국 브리핑(12:15) + US_MARKET이슈(:30,12-14h)
  "0,10,30 0,1,2,3,4,5,6 * * *",          # MARKET 이슈(매 30분, 0-6h) + 정확도(00:10)
  "0 23,2,5,8,11 * * *",                  # 주말 종목뉴스 3시간 간격(08/11/14/17/20 KST) — 요일필터는 Worker에서
]
