name               = "doubleshot-cron"
main               = "src/worker.js"
compatibility_date = "2025-01-01"

# ── Cron 트리거 5개 (Free 플랜 한도) / 모두 UTC 기준 ─────────────────────────
# 요일·시각 필터는 Worker 코드에서 처리. 주말 발동 시 코드가 자동 skip.
[triggers]
crons = [
  "30 22 * * *",              # 코스피 시초가   07:30 KST (UTC 22:30)
  "30  7 * * *",              # 코스피 마감    16:30 KST (UTC 07:30)
  "20,30 12,13,14 * * *",     # 미국 브리핑(12:20) + US_MARKET 이슈(12:30,13:30,14:30)
  "0,10,30 0,1,2,3,4,5,6 * * *", # MARKET 이슈(00:00,00:30…06:30) + 정확도(00:10)
  "35 7,8,9,10,11 * * *",     # POST_MARKET 이슈 16:35~20:35 KST
]
