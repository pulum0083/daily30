name               = "doubleshot-cron"
main               = "src/worker.js"
compatibility_date = "2025-01-01"

# ── Cron 트리거 (모두 UTC 기준) ──────────────────────────────────────────────
# KST = UTC+9. 월요일 07:30 KST = 일요일 22:30 UTC 등 날짜 변환 주의.
[triggers]
crons = [
  # 정기 브리핑
  "30 22 * * 0-4",    # 코스피 시초가  07:30 KST 월~금 (UTC 일~목 22:30)
  "30  7 * * 1-5",    # 코스피 마감   16:30 KST 월~금
  "20 12 * * 1-5",    # 미국 시장     21:20 KST 월~금
  "10  0 * * 2-6",    # 정확도 체크   09:10 KST 화~토

  # 이슈 브리핑
  "0,30 0-6 * * 1-5", # MARKET      09:00~15:30 KST, 30분 간격
  "35  7-11 * * 1-5", # POST_MARKET 16:35~20:35 KST,  1시간 간격
  "30 12-14 * * 1-5", # US_MARKET   21:30~23:30 KST,  1시간 간격
]
